# Microsoft Corporation
#
# Raw stages template for the package-build pipeline (v1 post-merge delta
# build). OneBranch-agnostic: declares the stages/jobs/steps and exposes the
# OneBranch-coupled knobs as parameters. The wrapper at
# .github/workflows/ado/package-build.yml supplies concrete values.
#
# Per push: gather the change-set info (get-changes-info, mode=postmerge: full
# history, deps, commit range, lock + render verification, changed-component
# set), then submit an official Control Tower build for the changed components.

parameters:
  - name: apiAudience
    type: string
  - name: apiBaseAFDUrl
    type: string
  - name: artifactBaseName
    type: string
  - name: containerImage
    type: string
  - name: outputDirectory
    type: string
  # Control Tower package target for builds submitted from this pipeline
  # (e.g. azl4 for the 4.0 branch, azl5 for 5.0).
  - name: packageTarget
    type: string
  - name: poolType
    type: string
    default: linux
  - name: serviceConnection
    type: string
  - name: timeoutInMinutes
    type: number

stages:
  - stage: PackageBuild
    jobs:
      - job: PackageBuild
        # Post-merge build: code has already merged, so there is no PR or merge
        # queue to gate. Fails loud -- any failing step turns the run red so
        # submission/validation breakage is visible rather than masked. The
        # build runs asynchronously in Control Tower/Koji; this pipeline only
        # submits it and confirms acceptance (see run_package_build.py).
        timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
        pool:
          type: ${{ parameters.poolType }}
        variables:
          - name: apiAudience
            value: ${{ parameters.apiAudience }}
          - name: apiBaseAFDUrl
            value: ${{ parameters.apiBaseAFDUrl }}
          - name: LinuxContainerImage
            value: ${{ parameters.containerImage }}
          - name: ob_artifactBaseName
            value: ${{ parameters.artifactBaseName }}
          - name: ob_outputDirectory
            value: ${{ parameters.outputDirectory }}
          - name: packageTarget
            value: ${{ parameters.packageTarget }}
        steps:
          # Sets job variables:
          # - changedComponentsFile
          # - sourceCommit
          - template: steps/get-changes-info.yml
            parameters:
              mode: postmerge

          - template: steps/install-deps.yml
            parameters:
              installControlTowerClient: true

          - task: AzureCLI@2
            displayName: "Submit package build to Control Tower"
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                python3 scripts/ci/control-tower/run_package_build.py \
                  --api-audience "$API_AUDIENCE" \
                  --api-base-url "$API_BASE_URL" \
                  --build-reason "$BUILD_REASON" \
                  --changed-components-file "$CHANGED_COMPONENTS_FILE" \
                  --package-target "$PACKAGE_TARGET" \
                  --official-build \
                  --commit-sha "$SOURCE_COMMIT" \
                  --repo-uri "$UPSTREAM_REPO_URL"
            env:
              API_AUDIENCE: $(apiAudience)
              API_BASE_URL: $(apiBaseAFDUrl)
              CHANGED_COMPONENTS_FILE: $(changedComponentsFile)
              PACKAGE_TARGET: $(packageTarget)
              SOURCE_COMMIT: $(sourceCommit)
              UPSTREAM_REPO_URL: $(Build.Repository.Uri)
              # Build.Reason is auto-exposed to the script as $BUILD_REASON; do
              # not add a BUILD_REASON entry here -- the agent silently ignores
              # env: overrides of that reserved predefined variable.
