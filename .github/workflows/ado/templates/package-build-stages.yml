#
# Raw stages template for the package-build pipeline (v1 post-merge delta
# build). OneBranch-agnostic: declares the stages/jobs/steps and exposes the
# OneBranch-coupled knobs as parameters. The wrapper at
# .github/workflows/ado/package-build.yml supplies concrete values.
#
# Per push and deployment: gather the change-set info (get-changes-info,
# mode=postmerge: full history, deps, commit range, lock + render verification,
# changed-component set), then submit an official Control Tower build for the
# changed components. Each deployment runs in a separate parallel job.

parameters:
  - name: artifactBaseName
    type: string
  - name: containerImage
    type: string
  # Named map of deployment identifier to apiAudience, apiBaseAFDUrl, and
  # serviceConnection. Identifiers must be valid Azure Pipelines job-name
  # suffixes.
  - name: deployments
    type: object
  - name: outputDirectory
    type: string
  # Distro-config RPM build-environment used by Control Tower.
  - name: packageEnvironment
    type: string
  - name: poolType
    type: string
    default: linux
  - name: timeoutInMinutes
    type: number

stages:
  - stage: PackageBuild
    jobs:
      - ${{ each deployment in parameters.deployments }}:
          - job: PackageBuild_${{ deployment.key }}
            displayName: "Package build (${{ deployment.key }})"
            # Post-merge build: code has already merged, so there is no PR or
            # merge queue to gate. Fails loud -- any failing deployment turns
            # the run red so submission/validation breakage is visible rather
            # than masked. Deployment jobs run independently in parallel. The
            # build runs asynchronously in Control Tower/Koji; this pipeline
            # only submits it and confirms acceptance (see
            # run_official_package_build.py).
            timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
            pool:
              type: ${{ parameters.poolType }}
            variables:
              - name: LinuxContainerImage
                value: ${{ parameters.containerImage }}
              - name: ob_artifactBaseName
                value: ${{ parameters.artifactBaseName }}-${{ deployment.key }}
              - name: ob_outputDirectory
                value: ${{ parameters.outputDirectory }}/${{ deployment.key }}
              - name: packageEnvironment
                value: ${{ parameters.packageEnvironment }}
            steps:
              # Sets job variables:
              # - changedComponentsFile
              - template: steps/get-changes-info.yml
                parameters:
                  mode: postmerge

              - template: steps/install-deps.yml
                parameters:
                  installControlTowerClient: true

              - task: AzureCLI@2
                displayName: "Submit official package build to Control Tower (${{ deployment.key }})"
                inputs:
                  azureSubscription: ${{ deployment.value.serviceConnection }}
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail

                    python3 scripts/ci/control-tower/run_official_package_build.py \
                      --api-audience "$API_AUDIENCE" \
                      --api-base-url "$API_BASE_URL" \
                      --build-reason "$BUILD_REASON" \
                      --changed-components-file "$CHANGED_COMPONENTS_FILE" \
                      --environment "$PACKAGE_ENVIRONMENT"
                env:
                  # Values come directly from parameters rather than same-named
                  # job variables, which would create cyclical references.
                  API_AUDIENCE: ${{ deployment.value.apiAudience }}
                  API_BASE_URL: ${{ deployment.value.apiBaseAFDUrl }}
                  CHANGED_COMPONENTS_FILE: $(changedComponentsFile)
                  PACKAGE_ENVIRONMENT: $(packageEnvironment)
                  # Secret predefined variables are not auto-exposed.
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                  # Build.Reason is predefined and auto-exposed as
                  # $BUILD_REASON; reference it directly and do not map it here
                  # (env: overrides of reserved variables are silently ignored
                  # by the agent).
