# Microsoft Corporation
#
# Step template: verify lock files are current. --check-only validates without
# writing and exits nonzero if any lock would change. Publishes a lock-update
# diff to ob_outputDirectory for triage.
#
# Requires the job-scope variable `ob_outputDirectory`.

steps:
  - script: |
      set -euo pipefail
      scripts/ci/control-tower/verify_locks.sh \
        --output-file "$(Build.ArtifactStagingDirectory)/lock-update.json" \
        --publish-dir "$(ob_outputDirectory)"
    displayName: "Verify lock files are up to date"
