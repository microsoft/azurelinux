# Microsoft Corporation
#
# Shared step template for the Control Tower integration pipelines (package
# build + source upload). Spliced into each pipeline's single job via:
#
#   steps:
#     - template: steps/common-steps.yml
#     - <the pipeline-specific Control Tower call>
#
# Keeping these as STEPS (not a separate job/stage) is deliberate: the
# change-detection steps emit job-scoped pipeline variables (sourceCommit,
# targetCommit, changedComponentsFile, renderSetFile) and write the change-set
# files to disk.
# Those flow freely to later steps in the SAME job but would need output
# variables + artifact upload/download to cross a job boundary. Splicing the
# common steps inline keeps that wiring trivial.
#
# Contract for the including job:
#   * It MUST define the job-scope variable `ob_outputDirectory` (both stages
#     templates set it from their `outputDirectory` parameter); the verify-locks
#     and prepare-change-set steps publish triage artifacts there.
#   * These steps assume normal step sequencing -- a failed step stops the ones
#     after it (the default; do NOT set step-level `continueOnError` on them).
#     Later steps depend on earlier ones, e.g. the render step trusts that
#     "Prepare change set" ran and set renderSetFile to a real path. A job-level
#     `continueOnError` (which only affects how the JOB result is reported, not
#     intra-job step flow) is fine -- the source-upload pipeline uses one.
#
# The steps below are identical across both pipelines: ensure full git history,
# authenticate + install dependencies, resolve the (target, source) commit
# range, and validate (lock files + rendered specs). The pipeline-specific
# Control Tower call (package build or prcheck) is appended by the including
# stages template.

steps:
  # Ensure the full git history is present, ONCE, before anything that needs it.
  # The OneBranch checkout may be shallow (depth 1), but lock resolution, spec
  # rendering (rpmautospec derives Release/changelog from `git log` over the
  # lock files), and commit-range detection all require the complete history.
  # Doing the unshallow here means the helper scripts can assume full history
  # and never fetch themselves -- a `git fetch --depth=N` inside a script would
  # re-shallow a full clone, which silently corrupts the rpmautospec Release
  # calculation (and is a footgun when running the scripts locally).
  - script: |
      set -euo pipefail
      if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
        echo "##[group]Fetching full git history"
        git fetch --unshallow
        echo "##[endgroup]"
      fi
    displayName: "Ensure full git history"

  - task: PipAuthenticate@1
    displayName: "Authenticate pip"
    inputs:
      artifactFeeds: "azl/ControlTowerFeed"

  - script: |
      set -euo pipefail

      echo "##[group]Mock"
      tdnf install -y mock mock-rpmautospec python3-chardet
      sudo usermod -aG mock "$(whoami)"
      echo "##[endgroup]"

      echo "##[group]Azldev"
      AZLDEV_VERSION=$(cat .azldev-version)
      echo "Installing azldev@${AZLDEV_VERSION}..."
      go install "github.com/microsoft/azure-linux-dev-tools/cmd/azldev@${AZLDEV_VERSION}"

      go_bin_path="$(go env GOPATH)/bin"
      echo "##vso[task.prependpath]$go_bin_path"

      "$go_bin_path/azldev" --version
      echo "##[endgroup]"

      echo "##[group]Python dependencies"
      pip install -r scripts/ci/control-tower/requirements.txt
      pip install -r scripts/ci/ado/requirements.txt
      echo "##[endgroup]"
    displayName: "Install dependencies"

  # Resolve the (target, source) commit range for this post-merge build:
  #   source = the commit that triggered this run (Build.SourceVersion).
  #   target = the previous CI build's commit on this branch, looked up
  #            via the ADO Builds API. Pairing each build with the
  #            one immediately before it keeps concurrent runs from
  #            overlapping and captures every commit a rebase merge
  #            appends. Runs after the dependency-install step because
  #            it imports the azure-devops SDK. See
  #            scripts/ci/ado/determine_commit_range.py for the full
  #            rationale and the first-run (source^1) fallback.
  - script: |
      set -euo pipefail
      # The helper prints the resolved range to stdout as two lines:
      #   sourceCommit=<sha>
      #   targetCommit=<sha>
      # (all diagnostics go to stderr). We parse them and set the
      # pipeline variables HERE so the variable wiring is visible in
      # the YAML rather than hidden in the script.
      range_output="$(python3 scripts/ci/ado/determine_commit_range.py \
        --definition-id "$SYSTEM_DEFINITIONID" \
        --current-build-id "$BUILD_BUILDID" \
        --branch "$DELTA_QUERY_BRANCH" \
        --source-commit "$BUILD_SOURCEVERSION")"
      echo "$range_output"

      source_commit="$(sed -n 's/^sourceCommit=//p' <<< "$range_output")"
      target_commit="$(sed -n 's/^targetCommit=//p' <<< "$range_output")"
      if [[ -z "$source_commit" || -z "$target_commit" ]]; then
        echo "##[error]determine_commit_range.py did not emit a source/target commit range."
        exit 1
      fi

      # The helper emits baselineQueryFailed=true ONLY when the ADO Builds API
      # query itself failed (bad SYSTEM_ACCESSTOKEN scope, network, SDK
      # misconfig) -- as opposed to a successful query that simply found no
      # prior build (a benign first run). A failed query silently degrades EVERY
      # run to a single-commit delta, with the weekly true-up as the sole safety
      # net, so raise a visible pipeline warning here rather than letting it pass
      # unnoticed.
      if [[ "$(sed -n 's/^baselineQueryFailed=//p' <<< "$range_output")" == "true" ]]; then
        echo "##vso[task.logissue type=warning]Delta build could not query previous builds; degraded to a single-commit delta (target=source^1). Check the SYSTEM_ACCESSTOKEN scope and ADO Builds API connectivity. The weekly true-up job covers any gap."
      fi

      # Mark the resolved range readonly: it is computed once here and only
      # consumed downstream, so locking it prevents a later step from clobbering
      # the commit range (matches changedComponentsFile / renderSetFile below).
      echo "##vso[task.setvariable variable=sourceCommit;isreadonly=true]$source_commit"
      echo "##vso[task.setvariable variable=targetCommit;isreadonly=true]$target_commit"
    env:
      SYSTEM_COLLECTIONURI: $(System.CollectionUri)
      SYSTEM_TEAMPROJECT: $(System.TeamProject)
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      SYSTEM_DEFINITIONID: $(System.DefinitionId)
      BUILD_BUILDID: $(Build.BuildId)
      DELTA_QUERY_BRANCH: $(Build.SourceBranch)
      BUILD_SOURCEVERSION: $(Build.SourceVersion)
    displayName: "Determine source and target commit range"

  # Verify lock files are current. --check-only validates without
  # writing, exits nonzero if any lock would change.
  - script: |
      set -euo pipefail
      scripts/ci/control-tower/verify_locks.sh \
        --output-file "$(Build.ArtifactStagingDirectory)/lock-update.json" \
        --publish-dir "$(ob_outputDirectory)"
    displayName: "Verify lock files are up to date"

  # Detect changed components AND prepare the render set. The same
  # changed-components JSON is consumed by the downstream
  # render-verify step (below) and by the CT API calls (appended by
  # the including stages template -- prcheck or package-build), so we
  # compute it once here and publish it as a triage artifact on every
  # exit path.
  #
  # azldev hard-fails if any component has sourcesChange == true
  # without a corresponding identity change (changeType not in
  # {added, changed, deleted}). That combination would let
  # attacker-supplied bytes ride into the lookaside under an
  # unchanged component identity, so we treat it as hostile and
  # fail closed (supply-chain drift tripwire). --include-unchanged
  # (set inside compute_change_set.sh) ensures the full component
  # list is available for downstream consumers.
  - script: |
      set -euo pipefail
      change_set_dir="$(Build.ArtifactStagingDirectory)/change-set"
      json_file="$change_set_dir/changed-components.json"
      render_set_file="$change_set_dir/render-set.txt"

      # Publish the changed-components JSON for post-mortem triage on
      # EVERY exit path, not just success -- if azldev hard-fails on a
      # consistency tripwire the partial JSON is exactly what an
      # operator needs to investigate.
      publish_artifact() {
        if [[ -s "$json_file" ]]; then
          mkdir -p "$(ob_outputDirectory)/changed-components"
          cp "$json_file" "$(ob_outputDirectory)/changed-components/" || true
        fi
      }
      trap publish_artifact EXIT

      echo "##[group]Preparing change set"
      # from = previous build's commit (baseline), to = this build's commit.
      scripts/ci/components/compute_change_set.sh \
        --output-dir "$change_set_dir" \
        --from-commit "$TARGET_COMMIT" \
        --to-commit "$SOURCE_COMMIT"
      echo "##[endgroup]"

      echo "##[group]Upload set (sourcesChange == true, changeType in {added, changed})"
      upload_count=$(jq -r '[.[] | select(.sourcesChange == true and (.changeType | IN("added", "changed")))] | length' "$json_file")
      jq -r '.[] | select(.sourcesChange == true and (.changeType | IN("added", "changed"))) | .component' "$json_file" | sort
      echo "Total: $upload_count component(s) to upload."
      echo "##[endgroup]"

      # Publish the downstream pipeline variables now that the change set is
      # ready (consumed by the render-verify step and the trailing Control
      # Tower call).
      echo "##vso[task.setvariable variable=changedComponentsFile;isreadonly=true]$json_file"
      echo "##vso[task.setvariable variable=renderSetFile;isreadonly=true]$render_set_file"
    env:
      SOURCE_COMMIT: $(sourceCommit)
      TARGET_COMMIT: $(targetCommit)
    displayName: "Prepare change set"

  # Render the components flagged by the change set above
  # (azldev-flagged plus any with hand-edited spec files) in
  # --check-only mode: azldev renders to a staging area and diffs
  # against the on-disk output without writing. Exits nonzero if
  # any component's rendered output would change, catching both
  # stale renders and direct hand-edits.
  - script: |
      set -euo pipefail
      # A missing render-set file means "Prepare change set" did not complete;
      # fail loud rather than silently skipping the render check.
      if [[ ! -f "$RENDER_SET_FILE" ]]; then
        echo "##[error]render-set file '$RENDER_SET_FILE' is missing -- 'Prepare change set' did not complete cleanly."
        exit 1
      fi
      # An empty render set just means no PR-scoped components changed.
      if [[ ! -s "$RENDER_SET_FILE" ]]; then
        echo "No changed components -- skipping render."
        exit 0
      fi
      echo "##[group]Render set"
      sed 's/^/  - /' "$RENDER_SET_FILE"
      echo "##[endgroup]"
      echo "##[group]Specs rendering + verification"
      # `-x` fails loudly if the arg list would split into multiple
      # xargs invocations -- a multi-batch render-check would
      # silently mask drift in the later batches. `-n 50000` is
      # required for `-x` to have any effect (without `-n`/`-L`,
      # GNU xargs never splits). `--` ends azldev option parsing so
      # component names beginning with `-` (none today) are
      # unambiguous. `env AZLDEV_ALLOW_ROOT=1` is inline per
      # .github/instructions/ado-pipeline.instructions.md.
      xargs -x -n 50000 -d '\n' env AZLDEV_ALLOW_ROOT=1 azldev component render --check-only -- \
        < "$RENDER_SET_FILE"
      echo "##[endgroup]"
    env:
      RENDER_SET_FILE: $(renderSetFile)
    displayName: "Verify rendered specs are up to date"
