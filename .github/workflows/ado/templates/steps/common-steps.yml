# Microsoft Corporation
#
# Shared step set for the POST-MERGE Control Tower pipelines (package build +
# source upload). Spliced into each pipeline's single job via:
#
#   steps:
#     - template: steps/common-steps.yml
#     - <the pipeline-specific Control Tower call>
#
# It composes the granular step templates in templates/steps/. Keeping these as
# STEPS (not a separate job/stage) is deliberate: the change-detection steps
# emit job-scoped pipeline variables (sourceCommit, targetCommit,
# changedComponentsFile, renderSetFile) and write the change-set files to disk.
# Those flow freely to later steps in the SAME job but would need output
# variables + artifact upload/download to cross a job boundary.
#
# Contract for the including job:
#   * It MUST define the job-scope variable `ob_outputDirectory` (both stages
#     templates set it from their `outputDirectory` parameter); the verify-locks
#     and prepare-change-set steps publish triage artifacts there.
#   * These steps assume normal step sequencing -- a failed step stops the ones
#     after it (the default; do NOT set step-level `continueOnError` on them).
#     Later steps depend on earlier ones. A job-level `continueOnError` (which
#     only affects how the JOB result is reported, not intra-job step flow) is
#     fine -- the source-upload pipeline uses one.
#
# The PR check composes these same granular templates directly, with its own
# commit-range-pr.yml and without the lock/render-verify steps (those are
# covered by the GitHub Actions PR gates).

steps:
  - template: ensure-full-history.yml
  - template: install-deps.yml
    parameters:
      installMock: true
      installAdoRequirements: true
  - template: commit-range-postmerge.yml
  - template: verify-locks.yml
  - template: prepare-change-set.yml
  - template: verify-rendered-specs.yml
