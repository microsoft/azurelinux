# Microsoft Corporation
#
# Raw stages template for the Control Tower integration pipeline.
#
# This template is OneBranch-agnostic: it declares the stages/jobs/steps that
# do the actual work and exposes the OneBranch-coupled knobs as parameters.
# The wrapper at .github/workflows/ado/sources-upload.yml is responsible for
# choosing the OneBranch governed template variant (Official vs NonOfficial),
# configuring its featureFlags, and supplying concrete values for the
# parameters declared below.

parameters:
  - name: outputDirectory
    type: string
  - name: artifactBaseName
    type: string
  - name: containerImage
    type: string
  - name: poolType
    type: string
    default: linux
  - name: serviceConnection
    type: string
  - name: variableGroup
    type: string
  - name: timeoutInMinutes
    type: number

stages:
  - stage: Integration
    jobs:
      - job: UploadAndBuild
        # Non-blocking PR check: failing steps still render red error annotations
        # and surface in the build-issues view, but the job resolves to
        # SucceededWithIssues and the run to PartiallySucceeded, which the Azure
        # Pipelines GitHub integration reports as success to GitHub PR checks and
        # the merge queue. Errors and warnings remain visible to the user.
        # TODO: Remove `continueOnError` once the pipeline is stable so failures
        #       block PRs and the merge queue.
        # ADO task: 19179
        continueOnError: true
        # Covers setup + change-set/render + the package-build acceptance poll
        # (run_package_build.py --poll-timeout-seconds, default 600s = 10m). The
        # long prcheck (source-upload) poll is disabled in this v1 build-only
        # pipeline.
        timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
        pool:
          type: ${{ parameters.poolType }}
        variables:
          - group: ${{ parameters.variableGroup }}
          - name: ob_outputDirectory
            value: ${{ parameters.outputDirectory }}
          - name: ob_artifactBaseName
            value: ${{ parameters.artifactBaseName }}
          - name: LinuxContainerImage
            value: ${{ parameters.containerImage }}
        steps:
          # Resolve the (target, source) commit range for this post-merge build:
          #   source = the commit that triggered this run (Build.SourceVersion).
          #   target = the previous CI build's commit on this branch, looked up
          #            via the ADO Builds REST API. Pairing each build with the
          #            one immediately before it keeps concurrent runs from
          #            overlapping and captures every commit a rebase merge
          #            appends. The helper is stdlib-only, so it runs here before
          #            the dependency-install step. See
          #            scripts/ci/ado/determine_commit_range.py for the full
          #            rationale and the first-run (source^1) fallback.
          - script: |
              set -euo pipefail
              # The helper prints the resolved range to stdout as two lines:
              #   sourceCommit=<sha>
              #   targetCommit=<sha>
              # (all diagnostics go to stderr). We parse them and set the
              # pipeline variables HERE so the variable wiring is visible in
              # the YAML rather than hidden in the script.
              range_output="$(python3 scripts/ci/ado/determine_commit_range.py \
                --definition-id "$SYSTEM_DEFINITIONID" \
                --current-build-id "$BUILD_BUILDID" \
                --branch "$DELTA_QUERY_BRANCH" \
                --source-commit "$BUILD_SOURCEVERSION" \
                --repo-uri "$BUILD_REPOSITORY_URI")"
              echo "$range_output"

              source_commit="$(sed -n 's/^sourceCommit=//p' <<< "$range_output")"
              target_commit="$(sed -n 's/^targetCommit=//p' <<< "$range_output")"
              if [[ -z "$source_commit" || -z "$target_commit" ]]; then
                echo "##[error]determine_commit_range.py did not emit a source/target commit range."
                exit 1
              fi

              echo "##vso[task.setvariable variable=sourceCommit]$source_commit"
              echo "##vso[task.setvariable variable=targetCommit]$target_commit"
            env:
              SYSTEM_COLLECTIONURI: $(System.CollectionUri)
              SYSTEM_TEAMPROJECT: $(System.TeamProject)
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              SYSTEM_DEFINITIONID: $(System.DefinitionId)
              BUILD_BUILDID: $(Build.BuildId)
              # The branch whose previous build sets the baseline. Uses a
              # NON-reserved env var name: the agent auto-exports predefined
              # variables as BUILD_*/SYSTEM_*, so an `env:` override of a
              # reserved name like BUILD_SOURCEBRANCH does not reliably take
              # effect. A custom name (DELTA_QUERY_BRANCH) is always honored.
              # >>> TEST HACK (branch: test_delta_v1) >>>
              # Force the baseline QUERY branch to refs/heads/4.0 instead of the
              # PR merge ref ($(Build.SourceBranch) = refs/pull/N/merge on a PR
              # build). The merge ref has no prior builds, so PR runs would only
              # ever hit the source^1 fallback and never exercise the
              # previous-build selection path. --source-commit still uses the PR
              # merge commit below, so the resolved range stays the PR's diff.
              # DO NOT MERGE -- restore `DELTA_QUERY_BRANCH: $(Build.SourceBranch)`.
              DELTA_QUERY_BRANCH: refs/heads/4.0
              # <<< TEST HACK <<<
              BUILD_SOURCEVERSION: $(Build.SourceVersion)
              BUILD_REPOSITORY_URI: $(Build.Repository.Uri)
            displayName: "Determine source and target commit range"

          - task: PipAuthenticate@1
            displayName: "Authenticate pip"
            inputs:
              artifactFeeds: "azl/ControlTowerFeed"

          - script: |
              set -euo pipefail

              echo "##[group]Mock"
              tdnf install -y mock mock-rpmautospec python3-chardet
              sudo usermod -aG mock "$(whoami)"
              echo "##[endgroup]"

              echo "##[group]Azldev"
              AZLDEV_VERSION=$(cat .azldev-version)
              echo "Installing azldev@${AZLDEV_VERSION}..."
              go install "github.com/microsoft/azure-linux-dev-tools/cmd/azldev@${AZLDEV_VERSION}"

              go_bin_path="$(go env GOPATH)/bin"
              echo "##vso[task.prependpath]$go_bin_path"

              "$go_bin_path/azldev" --version
              echo "##[endgroup]"

              echo "##[group]Python dependencies"
              pip install -r scripts/ci/control-tower/requirements.txt
              echo "##[endgroup]"
            displayName: "Install dependencies"

          # Verify lock files are current. --check-only validates without
          # writing, exits nonzero if any lock would change.
          - script: |
              set -euo pipefail
              scripts/ci/control-tower/verify_locks.sh \
                --output-file "$(Build.ArtifactStagingDirectory)/lock-update.json" \
                --publish-dir "$(ob_outputDirectory)"
            displayName: "Verify lock files are up to date"

          # Detect changed components AND prepare the render set. The same
          # changed-components JSON is consumed by the downstream
          # render-verify step (below) and by the CT API calls (further
          # down -- prcheck + package-build), so we compute it once here
          # and publish it as a triage artifact on every exit path.
          #
          # azldev hard-fails if any component has sourcesChange == true
          # without a corresponding identity change (changeType not in
          # {added, changed, deleted}). That combination would let
          # attacker-supplied bytes ride into the lookaside under an
          # unchanged component identity, so we treat it as hostile and
          # fail closed (supply-chain drift tripwire). --include-unchanged
          # (set inside compute_changed.sh) ensures the full component
          # list is available for downstream consumers.
          - script: |
              set -euo pipefail
              change_set_dir="$(Build.ArtifactStagingDirectory)/change-set"
              json_file="$change_set_dir/changed-components.json"
              render_set_file="$change_set_dir/render-set.txt"

              # Declare the downstream pipeline variables UP FRONT with empty
              # values. ADO's `$(varName)` substitution leaves the literal
              # string unchanged when the variable is undefined; we want
              # downstream `[[ ! -f "$(renderSetFile)" ]]` assertions to fail
              # cleanly on a missing file instead of relying on bash's
              # "command not found" behavior for a literal `$(renderSetFile)`
              # path. Re-set after success below.
              echo "##vso[task.setvariable variable=changedComponentsFile;isreadonly=false]"
              echo "##vso[task.setvariable variable=renderSetFile;isreadonly=false]"

              # Publish the changed-components JSON for post-mortem triage on
              # EVERY exit path, not just success -- if azldev hard-fails on a
              # consistency tripwire the partial JSON is exactly what an
              # operator needs to investigate.
              publish_artifact() {
                if [[ -s "$json_file" ]]; then
                  mkdir -p "$(ob_outputDirectory)/changed-components"
                  cp "$json_file" "$(ob_outputDirectory)/changed-components/" || true
                fi
              }
              trap publish_artifact EXIT

              echo "##[group]Preparing change set"
              scripts/ci/components/compute_change_set.sh \
                --output-dir "$change_set_dir" \
                --source-commit "$(sourceCommit)" \
                --target-commit "$(targetCommit)"
              echo "##[endgroup]"

              echo "##[group]Upload set (sourcesChange == true, changeType in {added, changed})"
              upload_count=$(jq -r '[.[] | select(.sourcesChange == true and (.changeType | IN("added", "changed")))] | length' "$json_file")
              jq -r '.[] | select(.sourcesChange == true and (.changeType | IN("added", "changed"))) | .component' "$json_file" | sort
              echo "Total: $upload_count component(s) to upload."
              echo "##[endgroup]"

              # Re-set the variables now that the script has succeeded.
              echo "##vso[task.setvariable variable=changedComponentsFile;isreadonly=true]$json_file"
              echo "##vso[task.setvariable variable=renderSetFile;isreadonly=true]$render_set_file"
            displayName: "Prepare change set"

          # Render the components flagged by the change set above
          # (azldev-flagged plus any with hand-edited spec files) in
          # --check-only mode: azldev renders to a staging area and diffs
          # against the on-disk output without writing. Exits nonzero if
          # any component's rendered output would change, catching both
          # stale renders and direct hand-edits.
          - script: |
              set -euo pipefail
              # Distinguish "render-set file is missing" (Prepare step
              # crashed; supply-chain tripwire or other hard failure) from
              # "render-set is empty" (no PR-scoped components). The former
              # MUST fail loud so a `continueOnError` job does not silently
              # mask the upstream crash.
              if [[ ! -f "$(renderSetFile)" ]]; then
                echo "##[error]renderSetFile is unset or missing -- 'Prepare change set' did not complete cleanly. Treating as failure rather than silently skipping render."
                exit 1
              fi
              if [[ ! -s "$(renderSetFile)" ]]; then
                echo "No changed components -- skipping render."
                exit 0
              fi
              echo "##[group]Render set"
              sed 's/^/  - /' "$(renderSetFile)"
              echo "##[endgroup]"
              echo "##[group]Specs rendering + verification"
              # `-x` fails loudly if the arg list would split into multiple
              # xargs invocations -- a multi-batch render-check would
              # silently mask drift in the later batches. `-n 50000` is
              # required for `-x` to have any effect (without `-n`/`-L`,
              # GNU xargs never splits). `--` ends azldev option parsing so
              # component names beginning with `-` (none today) are
              # unambiguous. `env AZLDEV_ALLOW_ROOT=1` is inline per
              # .github/instructions/ado-pipeline.instructions.md.
              xargs -x -n 50000 -d '\n' env AZLDEV_ALLOW_ROOT=1 azldev component render --check-only -- \
                < "$(renderSetFile)"
              echo "##[endgroup]"
            displayName: "Verify rendered specs are up to date"

          # === DISABLED: source upload (prcheck) — v1 post-merge build stopgap ===
          # This "source upload" step is intentionally disabled until source
          # upload is reworked. The script scripts/ci/control-tower/run_prcheck.py
          # is deliberately LEFT IN PLACE; only this caller step is turned off.
          #
          # - task: AzureCLI@2
          #   displayName: "Call Control Tower 'prcheck' API"
          #   inputs:
          #     azureSubscription: ${{ parameters.serviceConnection }}
          #     scriptType: bash
          #     scriptLocation: inlineScript
          #     inlineScript: |
          #       set -euo pipefail
          #
          #       python3 scripts/ci/control-tower/run_prcheck.py \
          #         --api-audience "$API_AUDIENCE" \
          #         --api-base-url "$API_BASE_URL" \
          #         --build-reason "$BUILD_REASON" \
          #         --changed-components-file "$CHANGED_COMPONENTS_FILE" \
          #         --source-commit "$SOURCE_COMMIT" \
          #         --repo-uri "$UPSTREAM_REPO_URL"
          #   env:
          #     API_AUDIENCE: $(ApiAudience)
          #     API_BASE_URL: $(ApiBaseDirectUrl)
          #     BUILD_REASON: $(Build.Reason)
          #     CHANGED_COMPONENTS_FILE: $(changedComponentsFile)
          #     SOURCE_COMMIT: $(sourceCommit)
          #     UPSTREAM_REPO_URL: $(Build.Repository.Uri)

          - task: AzureCLI@2
            displayName: "Submit package build to Control Tower"
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                # >>> TEST HACK (branch: test_delta_v1) >>>
                # Submit SCRATCH builds while testing this pipeline, instead of
                # official/persisted builds. run_package_build.py treats the
                # ABSENCE of --official-build as a scratch build
                # (isScratchBuild = not --official-build), which keeps test runs
                # out of the real package feed and avoids NEVR collisions with
                # production builds.
                # DO NOT MERGE this into the v1 pipeline PR — restore the
                # `--official-build \` line below for the real pipeline.
                # <<< TEST HACK <<<
                python3 scripts/ci/control-tower/run_package_build.py \
                  --api-audience "$API_AUDIENCE" \
                  --api-base-url "$API_BASE_URL" \
                  --build-reason "$CT_BUILD_REASON" \
                  --changed-components-file "$CHANGED_COMPONENTS_FILE" \
                  --package-target azl4 \
                  --commit-sha "$SOURCE_COMMIT" \
                  --repo-uri "$UPSTREAM_REPO_URL"
            env:
              API_AUDIENCE: $(ApiAudience)
              API_BASE_URL: $(ApiBaseDirectUrl)
              # >>> TEST HACK (branch: test_delta_v1) >>>
              # Force a non-PullRequest reason so run_package_build.py does NOT
              # skip submission on PR-triggered test runs (it returns early when
              # reason == PullRequest: "unmerged code should not consume build
              # capacity"). The determine-range step is unaffected and still uses
              # the real PR context -- on a PR build Build.SourceVersion is the
              # merge commit, so its fallback source^1..source is exactly the
              # PR's diff, which is a convenient test range.
              #
              # NOTE: this MUST be a non-reserved env var name. `BUILD_REASON` is
              # the predefined ADO variable Build.Reason, which the agent
              # auto-exports as `PullRequest` and which SILENTLY OVERRIDES any
              # `env: BUILD_REASON:` mapping (same class of bug as the
              # BUILD_SOURCEBRANCH -> DELTA_QUERY_BRANCH rename). Use the neutral
              # CT_BUILD_REASON instead so the override actually sticks.
              # DO NOT MERGE -- for the real pipeline set
              # `CT_BUILD_REASON: $(Build.Reason)`.
              CT_BUILD_REASON: IndividualCI
              # <<< TEST HACK <<<
              CHANGED_COMPONENTS_FILE: $(changedComponentsFile)
              SOURCE_COMMIT: $(sourceCommit)
              UPSTREAM_REPO_URL: $(Build.Repository.Uri)
