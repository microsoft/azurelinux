# Microsoft Corporation
#
# Raw stages template for the source-upload pipeline (Control Tower prcheck).
# OneBranch-agnostic: declares the stages/jobs/steps and exposes the
# OneBranch-coupled knobs as parameters. The wrapper at
# .github/workflows/ado/sources-upload.yml supplies concrete values.
#
# The setup + change-detection + validation steps are shared with the
# package-build pipeline via templates/steps/common-steps.yml; this template
# appends only the source-upload-specific Control Tower call (prcheck).
#
# NOTE: source upload is the original Control Tower flow. It runs prcheck, which
# returns early (no upload) on pull-request triggers -- unmerged code should not
# consume capacity. This pipeline is retained for when source upload returns to
# active duty; the v1 stopgap runs builds via package-build.yml instead.

parameters:
  - name: outputDirectory
    type: string
  - name: artifactBaseName
    type: string
  - name: containerImage
    type: string
  - name: poolType
    type: string
    default: linux
  - name: serviceConnection
    type: string
  - name: variableGroup
    type: string
  - name: timeoutInMinutes
    type: number

stages:
  - stage: SourceUpload
    jobs:
      - job: SourceUpload
        # Non-blocking PR check: failing steps still render red error annotations
        # and surface in the build-issues view, but the job resolves to
        # SucceededWithIssues and the run to PartiallySucceeded, which the Azure
        # Pipelines GitHub integration reports as success to GitHub PR checks and
        # the merge queue. Errors and warnings remain visible to the user.
        # TODO: Remove `continueOnError` once the pipeline is stable so failures
        #       block PRs and the merge queue.
        # ADO task: 19179
        continueOnError: true
        # Must exceed the script's --poll-timeout-seconds (run_prcheck.py default
        # 7200s = 120m) with enough headroom for setup steps and the final API call.
        timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
        pool:
          type: ${{ parameters.poolType }}
        variables:
          - group: ${{ parameters.variableGroup }}
          - name: ob_outputDirectory
            value: ${{ parameters.outputDirectory }}
          - name: ob_artifactBaseName
            value: ${{ parameters.artifactBaseName }}
          - name: LinuxContainerImage
            value: ${{ parameters.containerImage }}
        steps:
          # Shared setup + change detection + validation (PipAuthenticate,
          # install deps, determine commit range, verify locks, prepare change
          # set, verify rendered specs). Produces the job-scope variables and
          # change-set files the prcheck step below consumes.
          - template: steps/common-steps.yml

          - task: AzureCLI@2
            displayName: "Call Control Tower 'prcheck' API"
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                python3 scripts/ci/control-tower/run_prcheck.py \
                  --api-audience "$API_AUDIENCE" \
                  --api-base-url "$API_BASE_URL" \
                  --build-reason "$CT_BUILD_REASON" \
                  --changed-components-file "$CHANGED_COMPONENTS_FILE" \
                  --source-commit "$SOURCE_COMMIT" \
                  --repo-uri "$UPSTREAM_REPO_URL"
            env:
              API_AUDIENCE: $(ApiAudience)
              API_BASE_URL: $(ApiBaseAFDUrl)
              # Non-reserved name: an `env:` override of the reserved BUILD_REASON var is silently ignored by the agent.
              CT_BUILD_REASON: $(Build.Reason)
              CHANGED_COMPONENTS_FILE: $(changedComponentsFile)
              SOURCE_COMMIT: $(sourceCommit)
              # TODO: Target commit is not used. Will be needed once we move detection of affected components to CT.
              # ADO task: 18816
              TARGET_COMMIT: $(targetCommit)
              UPSTREAM_REPO_URL: $(Build.Repository.Uri)
