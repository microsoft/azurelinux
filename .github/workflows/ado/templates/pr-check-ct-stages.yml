#
# Raw stages template for the PR Control Tower check (prcheck + scratch package
# build). Wrapper-agnostic: declares the stages/jobs/steps and exposes the
# wrapper-coupled knobs as parameters. The wrapper at
# .github/workflows/ado/pr-check-ct.yml supplies concrete values.
#
# Per PR: gather the change-set info (get-changes-info, mode=pr: full history,
# deps, commit range, lock + render verification, changed-component set), then
# call Control Tower 'prcheck' (uploads the changed components' missing
# lookaside sources) and submit a *scratch* Control Tower build of the PR head
# for those components, waiting for it to finish. NO PR-controlled code is built
# on the CI agent -- only read-only change detection runs here.

parameters:
  - name: apiAudience
    type: string
  - name: apiBaseAFDUrl
    type: string
  - name: artifactBaseName
    type: string
  - name: containerImage
    type: string
  - name: outputDirectory
    type: string
  # Distro-config RPM build-environment used by Control Tower.
  - name: packageEnvironment
    type: string
  # Max seconds run_scratch_package_build.py waits for the Control Tower build
  # to reach a terminal state. Keep below the job's timeoutInMinutes so the
  # script's own clear failure fires before ADO blunt-kills the job. Default
  # 21600 = 6h.
  - name: pollTimeoutSeconds
    type: number
    default: 21600
  - name: poolType
    type: string
    default: linux
  - name: serviceConnection
    type: string
  - name: timeoutInMinutes
    type: number

stages:
  - stage: PRCheckCT
    jobs:
      - job: PRCheckCT
        # Fail-loud: a failed submission, an immediate Control Tower rejection,
        # or a build that fails (or never reaches a terminal state) turns the PR
        # check red. The build runs in Control Tower's own sandbox -- NOT on this
        # agent -- but this pipeline WAITS for it to finish. Size the timeout to
        # cover the FULL build: it must exceed pollTimeoutSeconds (6h default).
        timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
        pool:
          type: ${{ parameters.poolType }}
        variables:
          - name: LinuxContainerImage
            value: ${{ parameters.containerImage }}
          - name: ob_artifactBaseName
            value: ${{ parameters.artifactBaseName }}
          - name: ob_outputDirectory
            value: ${{ parameters.outputDirectory }}
          - name: packageEnvironment
            value: ${{ parameters.packageEnvironment }}
          - name: pollTimeoutSeconds
            value: ${{ parameters.pollTimeoutSeconds }}
        steps:
          # Sets job variables:
          # - baseCommit
          # - changedComponentsFile
          # - sourceCommit
          - template: steps/get-changes-info.yml
            parameters:
              mode: pr

          - template: steps/install-deps.yml
            parameters:
              installControlTowerClient: true

          # Call Control Tower 'prcheck' BEFORE the build. Among other things,
          # prcheck uploads the missing lookaside sources for the changed
          # components, so they are available when the scratch build below
          # fetches them.
          - task: AzureCLI@2
            displayName: "Call Control Tower 'prcheck' API"
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                python3 scripts/ci/control-tower/run_prcheck.py \
                  --api-audience "$API_AUDIENCE" \
                  --api-base-url "$API_BASE_URL" \
                  --build-reason "$BUILD_REASON" \
                  --changed-components-file "$CHANGED_COMPONENTS_FILE" \
                  --source-commit "$SOURCE_COMMIT" \
                  --repo-uri "$BUILD_REPOSITORY_URI"
            env:
              # apiAudience / apiBaseAFDUrl are referenced from the parameters
              # directly (NOT surfaced as same-named job variables): the wrapper
              # passes $(ApiAudience) / $(ApiBaseAFDUrl) from the variable group,
              # and a job variable of the same (case-insensitive) name would
              # self-reference -> "cyclical reference" and never resolve.
              API_AUDIENCE: ${{ parameters.apiAudience }}
              API_BASE_URL: ${{ parameters.apiBaseAFDUrl }}
              # TODO: Base commit is not used yet. Will be needed once we move
              # detection of affected components to CT. ADO task: 18816
              BASE_COMMIT: $(baseCommit)
              CHANGED_COMPONENTS_FILE: $(changedComponentsFile)
              SOURCE_COMMIT: $(sourceCommit)
              # Build.Reason and Build.Repository.Uri are predefined and
              # auto-exposed as $BUILD_REASON / $BUILD_REPOSITORY_URI; reference
              # them directly and do not map them here (env: overrides of
              # reserved variables are silently ignored by the agent).

          # Submit a SCRATCH Control Tower build of the PR head for the changed
          # components. Scratch = throwaway: it never persists to a production
          # repo, so building unmerged PR code is safe. The scratch-only runner
          # has no official endpoint or mode switch. --wait-for-completion
          # blocks until the build reaches a terminal state and fails the check
          # on a build failure (or on poll-timeout). No PR code is built on this
          # agent.
          #
          # This step assumes the pipeline is wired as a REVIEWER-GATED check in
          # ADO: it should not auto-run on every PR push, so a maintainer
          # eyeballs the diff before unmerged code is submitted for a build.
          - task: AzureCLI@2
            displayName: "Submit scratch build to Control Tower"
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                python3 scripts/ci/control-tower/run_scratch_package_build.py \
                  --api-audience "$API_AUDIENCE" \
                  --api-base-url "$API_BASE_URL" \
                  --changed-components-file "$CHANGED_COMPONENTS_FILE" \
                  --environment "$PACKAGE_ENVIRONMENT" \
                  --commit-sha "$SOURCE_COMMIT" \
                  --wait-for-completion \
                  --poll-timeout-seconds "$POLL_TIMEOUT_SECONDS"
            env:
              # See the prcheck step: apiAudience / apiBaseAFDUrl come from the
              # parameters directly to avoid a cyclical self-reference with the
              # same-named variable-group variables.
              API_AUDIENCE: ${{ parameters.apiAudience }}
              API_BASE_URL: ${{ parameters.apiBaseAFDUrl }}
              CHANGED_COMPONENTS_FILE: $(changedComponentsFile)
              PACKAGE_ENVIRONMENT: $(packageEnvironment)
              POLL_TIMEOUT_SECONDS: $(pollTimeoutSeconds)
              SOURCE_COMMIT: $(sourceCommit)
