#
# Raw stages template for the PR Control Tower check (prcheck + scratch package
# build). Wrapper-agnostic: declares the stages/jobs/steps and exposes the
# wrapper-coupled knobs as parameters. The wrapper at
# .github/workflows/ado/pr-check-ct.yml supplies concrete values.
#
# Per PR and deployment: gather the change-set info (get-changes-info, mode=pr:
# full history, deps, commit range, lock + render verification,
# changed-component set), then call Control Tower 'prcheck' (uploads the changed
# components' missing lookaside sources). When skipPackageBuilds is false, also
# submit a *scratch* Control Tower build of the PR head for those components and
# wait for it to finish. The candidate-closure check then downloads the fresh
# binary RPMs from PROD Koji and checks the base and base+builddeps views for
# each configured architecture, without submitting another scratch build.
# Checkout-controlled helpers execute on the CI agent under the
# deployment-specific service connection; package builds run in Control Tower's
# sandbox.

parameters:
  - name: artifactBaseName
    type: string
  # Architecture-keyed map of baseRepoUrl and builddepsRepoUrl.
  - name: closureRepositories
    type: object
  - name: containerImage
    type: string
  # Named map of deployment identifier to apiAudience, apiBaseAFDUrl,
  # continueOnError, serviceConnection, skipPackageBuilds, and
  # runCandidateClosureCheck.
  # Identifiers must be valid Azure Pipelines job-name suffixes.
  - name: deployments
    type: object
  - name: enableCandidateClosureCheck
    type: boolean
    default: false
  - name: kojiFilesUrl
    type: string
  - name: kojiHubUrl
    type: string
  - name: outputDirectory
    type: string
  # Distro-config RPM build-environment used by Control Tower.
  - name: packageEnvironment
    type: string
  # Max seconds run_scratch_package_build.py waits for the Control Tower build
  # to reach a terminal state. Keep below the job's timeoutInMinutes so the
  # script's own clear failure fires before ADO blunt-kills the job. Default
  # 21600 = 6h.
  - name: pollTimeoutSeconds
    type: number
    default: 21600
  - name: poolType
    type: string
    default: linux
  - name: timeoutInMinutes
    type: number

stages:
  - stage: PRCheckCT
    jobs:
      - ${{ each deployment in parameters.deployments }}:
          - job: PRCheckCT_${{ deployment.key }}
            displayName: "PR Control Tower check (${{ deployment.key }})"
            # Fail-loud: a failed submission, an immediate Control Tower
            # rejection, or a build that fails (or never reaches a terminal
            # state) turns the PR check red unless that deployment explicitly
            # allows prcheck errors. Deployment jobs run independently in
            # parallel, and any failed job fails the stage. The build runs in
            # Control Tower's own sandbox -- NOT on this agent -- but this
            # pipeline WAITS for it to finish. Size the timeout to cover the
            # FULL build: it must exceed pollTimeoutSeconds (6h default).
            timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
            pool:
              type: ${{ parameters.poolType }}
            variables:
              - name: LinuxContainerImage
                value: ${{ parameters.containerImage }}
              - name: ob_artifactBaseName
                value: ${{ parameters.artifactBaseName }}-${{ deployment.key }}
              - name: ob_outputDirectory
                value: ${{ parameters.outputDirectory }}/${{ deployment.key }}
              - name: packageEnvironment
                value: ${{ parameters.packageEnvironment }}
              - name: pollTimeoutSeconds
                value: ${{ parameters.pollTimeoutSeconds }}
            steps:
              # Sets job variables:
              # - baseCommit
              # - changedComponentsFile
              # - sourceCommit
              - template: steps/get-changes-info.yml
                parameters:
                  mode: pr

              - template: steps/install-deps.yml
                parameters:
                  installControlTowerClient: true

              # Source changes are not the complete closure-impact set:
              # publication-policy-only moves must also produce fresh RPMs.
              - ${{ if and(eq(parameters.enableCandidateClosureCheck, true), eq(deployment.value.runCandidateClosureCheck, true), ne(deployment.value.skipPackageBuilds, true)) }}:
                  - script: |
                      set -euo pipefail
                      closure_components_file="$CLOSURE_COMPONENTS_FILE"
                      replaced_components_file="$REPLACED_COMPONENTS_FILE"
                      python3 scripts/ci/control-tower/prepare_closure_build_set.py \
                        --base-commit "$BASE_COMMIT" \
                        --changed-components-file "$CHANGED_COMPONENTS_FILE" \
                        --output "$closure_components_file" \
                        --replaced-components-output "$replaced_components_file" \
                        --source-commit "$SOURCE_COMMIT"
                      echo "##vso[task.setvariable variable=closureComponentsFile;isreadonly=true]$closure_components_file"
                    displayName: "Prepare repository closure build set"
                    continueOnError: ${{ deployment.value.continueOnError }}
                    env:
                      BASE_COMMIT: $(baseCommit)
                      CHANGED_COMPONENTS_FILE: $(changedComponentsFile)
                      CLOSURE_COMPONENTS_FILE: $(ob_outputDirectory)/closure-components.json
                      REPLACED_COMPONENTS_FILE: $(ob_outputDirectory)/closure-replaced-components.json
                      SOURCE_COMMIT: $(sourceCommit)

              # Call Control Tower 'prcheck' BEFORE the build. Among other
              # things, prcheck uploads the missing lookaside sources for the
              # changed components, so they are available when the scratch
              # build below fetches them.
              - task: AzureCLI@2
                displayName: "Call Control Tower 'prcheck' API (${{ deployment.key }})"
                continueOnError: ${{ deployment.value.continueOnError }}
                inputs:
                  azureSubscription: ${{ deployment.value.serviceConnection }}
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail

                    python3 scripts/ci/control-tower/run_prcheck.py \
                      --api-audience "$API_AUDIENCE" \
                      --api-base-url "$API_BASE_URL" \
                      --build-reason "$BUILD_REASON" \
                      --changed-components-file "$CHANGED_COMPONENTS_FILE" \
                      --source-commit "$SOURCE_COMMIT" \
                      --repo-uri "$BUILD_REPOSITORY_URI"
                env:
                  # Values come directly from parameters rather than same-named
                  # job variables, which would create cyclical references.
                  API_AUDIENCE: ${{ deployment.value.apiAudience }}
                  API_BASE_URL: ${{ deployment.value.apiBaseAFDUrl }}
                  # TODO: Base commit is not used yet. Will be needed once we
                  # move detection of affected components to CT. ADO task:
                  # 18816
                  BASE_COMMIT: $(baseCommit)
                  CHANGED_COMPONENTS_FILE: $(changedComponentsFile)
                  SOURCE_COMMIT: $(sourceCommit)
                  # Secret predefined variables are not auto-exposed.
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                  # Build.Reason and Build.Repository.Uri are predefined and
                  # auto-exposed as $BUILD_REASON / $BUILD_REPOSITORY_URI;
                  # reference them directly and do not map them here (env:
                  # overrides of reserved variables are silently ignored by
                  # the agent).

              - ${{ if ne(deployment.value.skipPackageBuilds, true) }}:
                  # Submit a SCRATCH Control Tower build of the PR head for the
                  # changed components. Scratch artifacts are throwaway and are
                  # not persisted to a production repo. The scratch-only runner
                  # has no official endpoint or mode switch, preventing
                  # accidental official submissions. This is not an
                  # authorization boundary: PR code can modify
                  # checkout-controlled helpers. --wait-for-completion blocks
                  # until the build reaches a terminal state and fails the
                  # check on failure or poll timeout.
                  #
                  # This step assumes the pipeline is wired as a REVIEWER-GATED
                  # check in ADO: it should not auto-run on every PR push, so a
                  # maintainer eyeballs the diff before unmerged code is
                  # submitted for a build.
                  - task: AzureCLI@2
                    displayName: "Submit scratch build to Control Tower (${{ deployment.key }})"
                    continueOnError: ${{ deployment.value.continueOnError }}
                    inputs:
                      azureSubscription: ${{ deployment.value.serviceConnection }}
                      scriptType: bash
                      scriptLocation: inlineScript
                      inlineScript: |
                        set -euo pipefail

                        component_args=(--changed-components-file "$CHANGED_COMPONENTS_FILE")
                        if [[ "${RUN_CANDIDATE_CLOSURE_CHECK,,}" == "true" ]]; then
                          component_args=(--components-file "$CLOSURE_COMPONENTS_FILE")
                        fi
                        python3 scripts/ci/control-tower/run_scratch_package_build.py \
                          --api-audience "$API_AUDIENCE" \
                          --api-base-url "$API_BASE_URL" \
                          "${component_args[@]}" \
                          --environment "$PACKAGE_ENVIRONMENT" \
                          --commit-sha "$SOURCE_COMMIT" \
                          --job-id-file "$CONTROL_TOWER_JOB_ID_FILE" \
                          --wait-for-completion \
                          --poll-timeout-seconds "$POLL_TIMEOUT_SECONDS"

                        if [[ -s "$CONTROL_TOWER_JOB_ID_FILE" ]]; then
                          echo "##vso[task.setvariable variable=hasScratchPackageBuild]true"
                        else
                          echo "##vso[task.setvariable variable=hasScratchPackageBuild]false"
                        fi
                    env:
                      # See the prcheck step: parameter values are used directly
                      # to avoid cyclical same-named variable references.
                      API_AUDIENCE: ${{ deployment.value.apiAudience }}
                      API_BASE_URL: ${{ deployment.value.apiBaseAFDUrl }}
                      CHANGED_COMPONENTS_FILE: $(changedComponentsFile)
                      CLOSURE_COMPONENTS_FILE: $(closureComponentsFile)
                      CONTROL_TOWER_JOB_ID_FILE: $(ob_outputDirectory)/control-tower-job-id.txt
                      PACKAGE_ENVIRONMENT: $(packageEnvironment)
                      POLL_TIMEOUT_SECONDS: $(pollTimeoutSeconds)
                      ${{ if and(eq(parameters.enableCandidateClosureCheck, true), eq(deployment.value.runCandidateClosureCheck, true)) }}:
                        RUN_CANDIDATE_CLOSURE_CHECK: "true"
                      ${{ else }}:
                        RUN_CANDIDATE_CLOSURE_CHECK: "false"
                      SOURCE_COMMIT: $(sourceCommit)
                      # Secret predefined variables are not auto-exposed.
                      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

                  - ${{ if and(eq(deployment.value.runCandidateClosureCheck, true), eq(parameters.enableCandidateClosureCheck, true)) }}:
                      - script: |
                          set -euo pipefail
                          echo "##[group]Candidate repository closure tools"
                          tdnf install -y createrepo_c dnf dnf-plugins-core rpm
                          createrepo_c --version
                          dnf --version
                          echo "##[endgroup]"
                          echo "##vso[task.setvariable variable=candidateClosureToolsReady;isreadonly=true]true"
                        displayName: "Install candidate repository closure tools"
                        continueOnError: ${{ deployment.value.continueOnError }}
                        condition: and(succeeded(), eq(variables['hasCandidateClosureChanges'], 'true'))

                      - ${{ each architecture in parameters.closureRepositories }}:
                          - task: AzureCLI@2
                            displayName: "Download fresh candidate RPMs (${{ architecture.key }})"
                            continueOnError: ${{ deployment.value.continueOnError }}
                            condition: >-
                              and(succeededOrFailed(),
                                  eq(variables['candidateClosureToolsReady'], 'true'),
                                  eq(variables['hasScratchPackageBuild'], 'true'))
                            inputs:
                              azureSubscription: ${{ deployment.value.serviceConnection }}
                              scriptType: bash
                              scriptLocation: inlineScript
                              inlineScript: |
                                set -euo pipefail

                                # Current Koji IP endpoints lack a verifiable CA/hostname pair.
                                # Remove this TLS exception once verified endpoints are available.
                                python3 scripts/ci/control-tower/download_candidate_rpms.py \
                                  --api-audience "$API_AUDIENCE" \
                                  --api-base-url "$API_BASE_URL" \
                                  --architecture "$ARCHITECTURE" \
                                  --candidate-base-dir "$CLOSURE_WORK_DIRECTORY/candidate-inputs/base" \
                                  --candidate-sdk-dir "$CLOSURE_WORK_DIRECTORY/candidate-inputs/sdk" \
                                  --download-directory "$CLOSURE_WORK_DIRECTORY/candidate-downloads" \
                                  --expected-components-file "$CLOSURE_COMPONENTS_FILE" \
                                  --insecure-koji-tls \
                                  --job-id-file "$CONTROL_TOWER_JOB_ID_FILE" \
                                  --koji-files-url "$KOJI_FILES_URL" \
                                  --koji-hub-url "$KOJI_HUB_URL" \
                                  --publish-policy base/comps/components-publish-channels.toml \
                                  --report "$CLOSURE_OUTPUT_DIRECTORY/candidate-acquisition.json" \
                                  --replaced-components-file "$REPLACED_COMPONENTS_FILE"
                                echo "##vso[task.setvariable variable=candidateClosureRpmsReady_${{ architecture.key }};isreadonly=true]true"
                            env:
                              API_AUDIENCE: ${{ deployment.value.apiAudience }}
                              API_BASE_URL: ${{ deployment.value.apiBaseAFDUrl }}
                              ARCHITECTURE: ${{ architecture.key }}
                              CLOSURE_COMPONENTS_FILE: $(closureComponentsFile)
                              CLOSURE_OUTPUT_DIRECTORY: $(ob_outputDirectory)/candidate-repository-closure/${{ architecture.key }}
                              CLOSURE_WORK_DIRECTORY: $(Agent.TempDirectory)/candidate-repository-closure-${{ deployment.key }}/${{ architecture.key }}
                              CONTROL_TOWER_JOB_ID_FILE: $(ob_outputDirectory)/control-tower-job-id.txt
                              KOJI_FILES_URL: ${{ parameters.kojiFilesUrl }}
                              KOJI_HUB_URL: ${{ parameters.kojiHubUrl }}
                              REPLACED_COMPONENTS_FILE: $(ob_outputDirectory)/closure-replaced-components.json
                              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

                          - script: |
                              set -euo pipefail

                              # Deletion-only transactions have no acquisition step.
                              mkdir -p "$CLOSURE_WORK_DIRECTORY/candidate-inputs/base" \
                                "$CLOSURE_WORK_DIRECTORY/candidate-inputs/sdk"
                              python3 scripts/ci/repository-closure/check_repo_closure.py \
                                --architecture "$ARCHITECTURE" \
                                --candidate-base-dir "$CLOSURE_WORK_DIRECTORY/candidate-inputs/base" \
                                --candidate-sdk-dir "$CLOSURE_WORK_DIRECTORY/candidate-inputs/sdk" \
                                --replaced-source-components-file "$REPLACED_COMPONENTS_FILE" \
                                --base-repo-url "$BASE_REPO_URL" \
                                --sdk-repo-url "$BUILDDEPS_REPO_URL" \
                                --output-directory "$CLOSURE_OUTPUT_DIRECTORY/check" \
                                --work-directory "$CLOSURE_WORK_DIRECTORY/check"
                            displayName: "Check candidate repository closure (${{ architecture.key }})"
                            continueOnError: ${{ deployment.value.continueOnError }}
                            condition: >-
                              and(succeededOrFailed(),
                                  eq(variables['candidateClosureToolsReady'], 'true'),
                                  eq(variables['hasCandidateClosureChanges'], 'true'),
                                  or(eq(variables['hasScratchPackageBuild'], 'false'),
                                     eq(variables['candidateClosureRpmsReady_${{ architecture.key }}'], 'true')))
                            env:
                              ARCHITECTURE: ${{ architecture.key }}
                              BASE_REPO_URL: ${{ architecture.value.baseRepoUrl }}
                              BUILDDEPS_REPO_URL: ${{ architecture.value.builddepsRepoUrl }}
                              CLOSURE_OUTPUT_DIRECTORY: $(ob_outputDirectory)/candidate-repository-closure/${{ architecture.key }}
                              CLOSURE_WORK_DIRECTORY: $(Agent.TempDirectory)/candidate-repository-closure-${{ deployment.key }}/${{ architecture.key }}
                              REPLACED_COMPONENTS_FILE: $(ob_outputDirectory)/closure-replaced-components.json
