name: "Lint"
on:
  pull_request:
  push:
    branches:
      - toml

# Cancel in-progress runs of this workflow if a new run is triggered.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: "Validate TOML config"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install azldev
        run: |
          go install "github.com/microsoft/azure-linux-dev-tools/cmd/azldev@$(cat .azldev-version)"

      - name: Install editorconfig-checker
        run: |
          go install "github.com/editorconfig-checker/editorconfig-checker/v3/cmd/editorconfig-checker@$(cat .editorconfig-checker-version)"

      - name: "Validate config (strict)"
        run: azldev config dump > /dev/null

      - name: "Validate TOML formatting"
        run: scripts/ci/check-editorconfig.sh
