version: 2

updates:
  # Python tooling dependencies — keep pip-installed scripts patched.
  # `directories` (plural) supports globbing, so new requirements.txt files
  # under these paths are picked up automatically without editing this file.
  # `directory` (singular) does NOT support globbing.
  - package-ecosystem: pip
    directories:
      - /scripts/**
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    # Wait until a release has been public for a few days before opening a PR,
    # so yanked/broken releases get caught upstream first. Majors wait longer.
    cooldown:
      default-days: 7
      semver-major-days: 14
    # Bundle all python tooling bumps into a single PR per run.
    groups:
      python:
        patterns:
          - "*"

  # GitHub Actions used by PR-check workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    # github-actions cooldown only supports a flat default-days (no semver granularity).
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  # Dependabot does not yet update dependencies declared only with Go tool
  # directives: https://github.com/dependabot/dependabot-core/issues/12050.
  # Keep the direct Azure Linux tool current without opening standalone PRs for
  # its transitive dependencies. Add another dependency-name here for each
  # additional repository-managed Go tool.
  - package-ecosystem: gomod
    directory: /tools/azldev
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - dependencies
    allow:
      - dependency-name: github.com/microsoft/azure-linux-dev-tools
