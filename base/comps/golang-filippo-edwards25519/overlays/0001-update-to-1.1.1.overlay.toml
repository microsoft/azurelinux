# Fedora does not package golang-filippo-edwards25519 1.1.1 on f43/f44 yet. Update to the upstream
# release for these CVE fixes:
# CVE-2026-26958
# Remove this overlay once the imported Fedora spec packages 1.1.1 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 1.1.1"
type = "spec-update-tag"
tag = "Version"
value = "1.1.1"

[[overlays]]
description = "Remove the obsolete edwards25519-1.1.0.tar.gz source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(edwards25519-1\.1\.0\.tar\.gz\) = [0-9a-f]+(?:\r?\n|$)'
