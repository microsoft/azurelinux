# Fedora does not package golang-github-yuin-goldmark 1.7.17 on f43/f44 yet. Update to the upstream
# release for these CVE fixes:
# CVE-2026-5160
# Remove this overlay once the imported Fedora spec packages 1.7.17 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 1.7.17"
type = "spec-update-tag"
tag = "Version"
value = "1.7.17"

[[overlays]]
description = "Remove the obsolete goldmark-1.7.13.tar.gz source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(goldmark-1\.7\.13\.tar\.gz\) = [0-9a-f]+(?:\r?\n|$)'
