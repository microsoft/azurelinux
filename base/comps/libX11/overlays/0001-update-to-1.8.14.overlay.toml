# Fedora does not package libX11 1.8.14 on f43/f44 yet. Update to the upstream
# release for these CVE fixes:
# CVE-2026-88806, CVE-2026-94283, CVE-2026-94284, CVE-2026-94285
# Remove this overlay once the imported Fedora spec packages 1.8.14 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 1.8.14"
type = "spec-update-tag"
tag = "Version"
value = "1.8.14"

[[overlays]]
description = "Remove the obsolete libX11-1.8.13.tar.xz source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(libX11-1\.8\.13\.tar\.xz\) = [0-9a-f]+(?:\r?\n|$)'
