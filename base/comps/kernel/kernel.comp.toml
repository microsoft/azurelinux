[components.kernel]
# Azure Linux maintains the kernel as a local spec (migrated away from the
# azldev TOML-overlay-on-Fedora-upstream approach). The spec and all of its
# source files live alongside this file in base/comps/kernel/. Edit
# kernel.spec directly; AZL-specific changes are marked with "AZL:" comments.
spec = { type = "local", path = "kernel.spec" }

# The spec uses %{specrelease} (kextraversion.azl_pkgrelease.dist) which the
# auto-calculator cannot parse. Release is managed manually: bump azl_pkgrelease
# in kernel.spec when rebuilding without a version change. The
# %changelog is hand-curated inline in the spec.
release = { calculation = "manual" }

# --- Downloaded source tarballs (not vendored into the component dir) ---

