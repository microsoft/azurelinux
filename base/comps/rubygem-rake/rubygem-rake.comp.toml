[components.rubygem-rake]

[[components.rubygem-rake.overlays]]
description = "Restore correct Release"
type = "spec-set-tag"
tag = "Release"
value = "%{?preminorver:0.}%{baserelease}%{?preminorver:%{rpmminorver}}%{?dist}"
metadata.category = "azl-temp-workaround"
metadata.upstream-status = "inapplicable"

[[components.rubygem-rake.overlays]]
description = "Set correct baserelease"
type = "spec-search-replace"
regex = '%global\s+baserelease\s+101'
replacement = "%global	baserelease	102"
metadata.category = "azl-temp-workaround"
metadata.upstream-status = "inapplicable"
