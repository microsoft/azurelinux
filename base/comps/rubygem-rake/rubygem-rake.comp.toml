[components.rubygem-rake]
# Upstream Release: %{?preminorver:0.}%[%{baserelease} + %{azl_release}]%{?preminorver:%{rpmminorver}}%{?dist}
release = { calculation = "static", counter = { source = "spec-macro", directive = "global", name = "baserelease" } }

[components.rubygem-rake.build.defines]
# AZL-only release counter added to upstream's %{baserelease}. Bump for an AZL
# rebuild, since manual release calculation can't auto-bump the Release.
azl_release = "1"

[[components.rubygem-rake.overlays]]
description = "Fold azl_release into %{baserelease} so we can bump the Release independently of upstream (manual release calculation can't auto-bump)"
type = "spec-set-tag"
tag = "Release"
value = "%{?preminorver:0.}%[%{baserelease} + %{azl_release}]%{?preminorver:%{rpmminorver}}%{?dist}"
