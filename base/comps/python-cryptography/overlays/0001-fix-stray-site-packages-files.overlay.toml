[metadata]
category = "upstream-backport"
upstream-status = "upstreamed"
commits = [{ url = "https://github.com/pyca/cryptography/commit/43eb178ee3aae8d0060221118437b03c23570a41" }]

# cryptography 46.0.7 lists CHANGELOG.rst, CONTRIBUTING.rst, docs/ and tests/
# in [tool.maturin] include without format = "sdist", so maturin >= 1.12 puts
# them into the wheel and they end up in site-packages. Upstream fixed the
# include list after 46.0.7.
[[overlays]]
description = "Only include CHANGELOG.rst, CONTRIBUTING.rst, docs and tests in the sdist, not in the wheel"
type = "patch-add"
source = "../cryptography-fix-stray-site-packages-files.patch"
