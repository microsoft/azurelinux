# The upstream GDAL autotest tarball `gdalautotest-3.11.5.tar.gz` (Source1)
# ships a fixture that trips anti-malware scanning on the AZL RPM-signing
# pipeline, which rejects encrypted / unscannable payloads inside SRPMs:
#
#   - gcore/data/zero_5GB_sozip_of_sozip.zip
#       A SOZip-of-SOZip test fixture: a ZIP containing zero_5GB.bin.zip,
#       which wraps a sparse 5 GiB all-zero file. AV scanners flag the
#       nested archive (and the layered re-decompressions of the outer
#       .tar.gz wrapper) as a Trojan.
#
# The autotest tarball is extracted in %prep but our %check section is a
# no-op (exits 0; gcore tests were OOM-killing the build POD), so stripping
# this fixture is functionally inert.
#
# Archive overlays strip this scanner-flagged fixture from upstream Source1
# during source preparation, avoiding a separate modified-source tarball.
[components.gdal]

[[components.gdal.overlays]]
type = "file-remove"
file = "gcore/data/zero_5GB_sozip_of_sozip.zip"
archive = "gdalautotest-3.11.5.tar.gz"
description = "Remove large test fixture to reduce source size"

[[components.gdal.source-files]]
filename = "gdalautotest-3.11.5.tar.gz"
hash = "d60d672407f1821a85ce55f708df264d41af60f7863fbd275f369b6a95adc1882bfb9b9f6b8c5e6f773afb754238d3a0c4a9aec91d2c8cd9f6db8c41cf6a59d7"
hash-type = "SHA512"
origin = { type = "overlay" }
replace-upstream = true
replace-reason = "The gdalautotest source contains a nested archive that trips signing-pipeline scanning; the archive overlay removes this unused fixture."

[components.gdal.build]
# Azure Linux does not support MinGW cross-compilation.
without = ["mingw"]
check = { skip = true, skip_reason = "gcore tests are causing the build POD to be OOM killed." }
