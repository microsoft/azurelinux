[metadata]
category = "azl-compatibility"
upstream-status = "inapplicable"

# GDAL's Java bindings need compat's system trust-store integration at runtime.
# Remove this overlay once their required provider guarantees system trust
# integration across installs and upgrades without the compatibility package.
[[overlays]]
description = "Require Microsoft OpenJDK compatibility and system trust for gdal-java"
type = "spec-add-tag"
package = "java"
tag = "Requires"
value = "msopenjdk-25-fedora-compat"
