# Test sources track the upstream-commit in locks/<package>.lock, not branch heads.
# Dist-git plans may themselves discover tests from Fedora's shared test repositories.

[tests.tmt-systemd-upstream]
type = "tmt"
description = "Systemd package-owned upstream integration plan (no gating.yaml at the pinned revision)"
kind = "functional"
required-capabilities = ["machine-bootable"]
tmt.source = { git-url = "https://src.fedoraproject.org/rpms/systemd.git", ref = "bdd1b37e16bd4fe10fd1140d5e1c400cc9ddfb86" }
tmt.plan = "/plans/upstream"

