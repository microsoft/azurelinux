[components.shim-unsigned-aarch64]
release = { calculation = "manual" }
# Pin shim 16.1 to Fedora dist-git commit 4db14e5ed7d3bdb7fda97f62c93e612435f2cce9.
spec = { type = "upstream", upstream-distro = { name = "fedora", version = "43" }, upstream-commit = "4db14e5ed7d3bdb7fda97f62c93e612435f2cce9" }

# Fedora ships one shim package across multiple Fedora releases. Azure Linux
# historically signs and ships a distinct shim package for each major release,
# so retain the Azure Linux dist tag. Revisit this if the packaging model changes.
[[components.shim-unsigned-aarch64.overlays]]
description = "Set the Azure Linux 16.1 release with its distribution tag"
type = "spec-update-tag"
tag = "Release"
value = "2%{?dist}"

[[components.shim-unsigned-aarch64.overlays]]
description = "Add the Azure Linux shim changelog entries"
type = "spec-prepend-lines"
section = "%changelog"
lines = [
    "* Mon Aug 24 2026 Lynsey Rydberg <lyrydber@microsoft.com> - 16.1-2",
    "- Update shim-unsigned packages to 16.1",
    "- Enforce the grub,5 SBAT generation baseline",
    "- Remove obsolete %{version}-2 compatibility symlinks",
    "- Add Azure Linux SBAT provenance",
    "- Embed the Azure Linux vendor certificate",
    "",
]

[[components.shim-unsigned-aarch64.overlays]]
description = "Enforce the grub,5 SBAT generation baseline"
type = "spec-search-replace"
section = "%build"
regex = '^MAKEFLAGS\+="ENABLE_SHIM_HASH=true "$'
replacement = "MAKEFLAGS+=\"ENABLE_SHIM_HASH=true \"\nMAKEFLAGS+=\"SBAT_AUTOMATIC_DATE=2025021800 \""

[[components.shim-unsigned-aarch64.overlays]]
description = "Use the Fedora EVR in the shim.fedora SBAT record"
type = "file-search-replace"
file = "sbat.redhat.csv.in"
regex = "@@VERSION@@-@@RELEASE@@"
replacement = "@@UPSTREAM_VERSION_RELEASE@@"
metadata = { category = "azl-branding-policy", upstream-status = "inapplicable" }

[[components.shim-unsigned-aarch64.overlays]]
description = "Add the Azure Linux shim SBAT record"
type = "file-search-replace"
file = "sbat.redhat.csv.in"
regex = "\\n\\z"
replacement = "\nshim.azurelinux,1,Microsoft,shim,@@VERSION@@-@@RELEASE@@,https://github.com/microsoft/azurelinux/issues\n"
metadata = { category = "azl-branding-policy", upstream-status = "inapplicable" }

[[components.shim-unsigned-aarch64.overlays]]
description = "Define the upstream Fedora shim EVR for SBAT substitution"
type = "spec-prepend-lines"
lines = [
    "%global upstream_version_release 16.1-1",
    "",
]
metadata = { category = "azl-branding-policy", upstream-status = "inapplicable" }

[[components.shim-unsigned-aarch64.overlays]]
description = "Substitute the upstream Fedora shim EVR into SBAT"
type = "spec-search-replace"
section = "%prep"
regex = "^    -e 's/@@RELEASE@@/%{release}/g' \\\\$"
replacement = "    -e 's/@@RELEASE@@/%{release}/g' \\\n    -e 's/@@UPSTREAM_VERSION_RELEASE@@/%{upstream_version_release}/g' \\"
metadata = { category = "azl-branding-policy", upstream-status = "inapplicable" }

[[components.shim-unsigned-aarch64.overlays]]
description = "Rename the Azure Linux shim SBAT template"
type = "file-rename"
file = "sbat.redhat.csv.in"
replacement = "sbat.azurelinux.csv.in"
metadata = { category = "azl-branding-policy", upstream-status = "inapplicable" }

[[components.shim-unsigned-aarch64.overlays]]
description = "Use the renamed Azure Linux SBAT template as Source3"
type = "spec-search-replace"
regex = "sbat\\.redhat\\.csv\\.in"
replacement = "sbat.azurelinux.csv.in"
metadata = { category = "azl-branding-policy", upstream-status = "inapplicable" }

[[components.shim-unsigned-aarch64.overlays]]
description = "Stage the Azure Linux Secure Boot CA as the shim vendor certificate"
type = "file-add"
file = "azurelinux-ca-20230216.der"
source = "azurelinux-ca-20230216.der"
metadata = { category = "azl-security-compliance", upstream-status = "inapplicable" }

[[components.shim-unsigned-aarch64.overlays]]
description = "Use the Azure Linux Secure Boot CA as shim Source1"
type = "spec-search-replace"
regex = "fedora-ca-20200709\\.cer"
replacement = "azurelinux-ca-20230216.der"
metadata = { category = "azl-security-compliance", upstream-status = "inapplicable" }
