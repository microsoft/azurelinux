# SymCrypt is Microsoft's core cryptographic library, maintained here as a
# local spec ported from Azure Linux 3.0.
#
# The upstream SymCrypt and jitterentropy-library release tarballs are declared
# as `source-files` entries below. azldev tries the lookaside cache first (keyed
# by the component name, SymCrypt) and falls back to the `origin` URI only on a
# miss. The fallback matters: these tarballs are not published to the Azure
# Linux lookaside, so the origin GitHub release URLs are what actually resolve
# them.
#
# The build-environment-variables script (Source3) is a vendored local file in
# this directory, not a downloaded source. Regenerate it for a new release with
# ./generate-env-file.sh --release-tag v<version>.
#
# Release and changelog are managed by rpmautospec (release.calculation =
# "autorelease"): the Release integer is derived from this component's git
# history at render time, and the spec's %autochangelog generates the changelog
# from the same history. The inherited changelog entries are preserved verbatim
# in the `changelog` sidecar file and appended below the generated entries.
[components.SymCrypt]
spec = { type = "local", path = "SymCrypt.spec" }
release = { calculation = "autorelease" }

