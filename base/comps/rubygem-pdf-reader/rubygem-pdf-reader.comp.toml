# Patch the test helper to insert the AZL_STRIPPED_FIXTURES constant after
# `module ReaderSpecHelper` so tests for stripped fixtures skip gracefully
# instead of raising ArgumentError.
[[components.rubygem-pdf-reader.overlays]]
type = "file-search-replace"
file = "pdf-reader-2.4.2-spec.txz/support/reader_spec_helper.rb"
regex = 'module ReaderSpecHelper\n'
replacement = """module ReaderSpecHelper

  # AZL downstream: fixtures stripped from spec/data/ for package-
  # signing-scan compliance. pdf_spec_file() skips (rather than raises)
  # ONLY for entries in this set; any other missing fixture still raises.
  AZL_STRIPPED_FIXTURES = %w[
    broken_string.pdf
    clearscan-with-image-removed.pdf
    clearscan.pdf
    content_stream_as_array.pdf
    content_stream_missing_final_operator.pdf
    content_stream_refers_to_invalid_font.pdf
    difference_table2.pdf
    difference_table_encrypted.pdf
    encrypted_version1_revision2_128bit_rc4_blank_user_password.pdf
    encrypted_version1_revision2_128bit_rc4_no_doc_id.pdf
    encrypted_version1_revision2_40bit_rc4_user_pass_apples.pdf
    encrypted_version2_revision3_128bit_rc4_blank_user_pass.pdf
    encrypted_version2_revision3_128bit_rc4_user_pass_apples.pdf
    encrypted_version4_revision4_128bit_aes_user_pass_apples_enc_metadata.pdf
    encrypted_version4_revision4_128bit_aes_user_pass_apples_unenc_metadata.pdf
    encrypted_version4_revision4_128bit_rc4_user_pass_apples_enc_metadata.pdf
    encrypted_version4_revision4_128bit_rc4_user_pass_apples_unenc_metadata.pdf
    encrypted_version5_revision5_256bit_aes_user_pass_apples_enc_metadata.pdf
    encrypted_version5_revision5_256bit_aes_user_pass_apples_unenc_metadata.pdf
    encrypted_version5_revision6_256bit_aes_user_pass_apples_enc_metadata.pdf
    encrypted_version5_revision6_256bit_aes_user_pass_apples_unenc_metadata.pdf
    form_xobject_recursive.pdf
    hard_lock_under_osx.pdf
    indirect_mediabox.pdf
    invisible.pdf
    junk_prefix.pdf
    junk_prefix_1024.pdf
    kids-as-direct-objects.pdf
    mediabox_and_cropbox_are_references.pdf
    mediabox_missing.pdf
    one-byte-identity.pdf
    overlapping-chars-x-fake-bold.pdf
    overlapping-chars-xy-fake-bold.pdf
    pages_object_missing_type.pdf
    rotate-180.pdf
    rotate-then-undo.pdf
    screwey_xref_offsets.pdf
    standard_font_with_no_difference.pdf
    symbol.pdf
    times-with-control-character.pdf
    truetype-arial.pdf
    type1-arial.pdf
    type3_font.pdf
    type3_font_with_rare_font_matrix.pdf
    zapf.pdf
    zeroed_xref_entry.pdf
    zlib_stream_issue.pdf
  ].freeze
"""
description = "Insert AZL_STRIPPED_FIXTURES constant listing stripped PDF filenames"

# Insert an elsif branch before the existing else/raise so stripped fixtures
# get rspec `skip` instead of ArgumentError
[[components.rubygem-pdf-reader.overlays]]
type = "file-search-replace"
file = "pdf-reader-2.4.2-spec.txz/support/reader_spec_helper.rb"
regex = '    else\n      raise ArgumentError, "#{valid_filename} not found"'
replacement = '''    elsif AZL_STRIPPED_FIXTURES.include?("#{base}.pdf")
      skip "PDF fixture #{File.basename(valid_filename)} stripped for downstream scan compliance"
    else
      raise ArgumentError, "#{valid_filename} not found"'''
description = "Make pdf_spec_file() skip (not raise) for stripped fixtures; still raises for any other missing fixture"
