[metadata]
category = "azl-compatibility"
upstream-status = "inapplicable"

[[overlays]]
description = "Use the provider-neutral JRE directory for LDAP JDK"
type = "spec-search-replace"
regex = '^%define java_home %\{_jvmdir\}/jre-25-openjdk$'
replacement = "%define java_home %{_jvmdir}/jre"

[[overlays]]
description = "Build LDAP JDK with Microsoft OpenJDK"
type = "spec-search-replace"
regex = '^%define java_devel java-25-openjdk-devel$'
replacement = "%define java_devel msopenjdk-25"

[[overlays]]
description = "Run LDAP JDK with Microsoft OpenJDK"
type = "spec-search-replace"
regex = '^%define java_headless java-25-openjdk-headless$'
replacement = "%define java_headless msopenjdk-25"