[metadata]
category = "azl-release-management"
upstream-status = "inapplicable"

[[overlays]]
description = "Bump LDAP JDK release for the Microsoft OpenJDK 25 migration"
type = "spec-search-replace"
regex = '^%global\s+release_number 2$'
replacement = "%global           release_number 3"

[[overlays]]
description = "Record the LDAP JDK Microsoft OpenJDK 25 migration"
type = "spec-prepend-lines"
section = "%changelog"
lines = [
    "* Thu Sep 17 2026 Nan Liu <liunan@microsoft.com> - 5.6.0-3",
    "- Migrate to Microsoft OpenJDK 25",
    "",
]