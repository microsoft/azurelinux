# Fedora does not package erlang-ssl_verify_fun 1.1.9 on f43/f44 yet. Update to the upstream
# release for these CVE fixes:
# CVE-2026-117666
# Remove this overlay once the imported Fedora spec packages 1.1.9 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 1.1.9"
type = "spec-update-tag"
tag = "Version"
value = "1.1.9"

[[overlays]]
description = "Remove the obsolete ssl_verify_fun-1.1.7.tar.gz source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(ssl_verify_fun-1\.1\.7\.tar\.gz\) = [0-9a-f]+(?:\r?\n|$)'
