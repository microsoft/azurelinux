[components.grub2]

# Disable Xen module builds — not applicable to Azure Linux (Hyper-V/KVM).
# grub.macros enables with_xen_arch and with_xen_pvh_arch on x86_64 by default,
# producing grub2-xen-x64-modules and grub2-xen_pvh-i386-modules subpackages.
[[components.grub2.overlays]]
description = "Disable Xen module build (with_xen_arch) in grub.macros"
type = "file-search-replace"
file = "grub.macros"
regex = '%global with_xen_arch 1'
replacement = '%global with_xen_arch 0'

[[components.grub2.overlays]]
description = "Disable Xen PVH module build (with_xen_pvh_arch) in grub.macros"
type = "file-search-replace"
file = "grub.macros"
regex = '%global with_xen_pvh_arch 1'
replacement = '%global with_xen_pvh_arch 0'

# Re-disable os-prober by default (security). The Fedora grub2 package carries
# two downstream reverts -- Patch0002 and Patch0003 -- that re-enable os-prober
# by default. Automatic, silent execution of os-prober is a known attack vector,
# so Azure Linux restores upstream GRUB's secure default. Rather than dropping
# the Fedora reverts (which would shift line numbers and break the context of
# later patches in the 382-patch series -- the failure that got the previous
# attempt reverted), these two trailing patches are appended to the end of the
# grub.patches series and are exact git reverts of the Fedora reverts.
#
# NOTE: grub2's patch series lives in the %include'd grub.patches file (Source11),
# not as inline PatchNNNN: tags in the spec, so the patch-add overlay cannot see
# the existing 382 patches to number new ones correctly. Instead we stage the two
# files with file-add and append their Patch0383/Patch0384 entries to grub.patches
# directly; do_common_setup applies them last via `git am %{patches}`.
[[components.grub2.overlays]]
description = "Stage os-prober revert patch 0383 (revert of Fedora Patch0003)"
type = "file-add"
file = "0383-Revert-Revert-templates-Disable-the-os-prober-by-default.patch"
source = "0383-Revert-Revert-templates-Disable-the-os-prober-by-default.patch"

[[components.grub2.overlays]]
description = "Stage os-prober revert patch 0384 (revert of Fedora Patch0002), restoring GRUB_DISABLE_OS_PROBER=true"
type = "file-add"
file = "0384-Revert-Revert-templates-Properly-disable-the-os-prober-by-d.patch"
source = "0384-Revert-Revert-templates-Properly-disable-the-os-prober-by-d.patch"

[[components.grub2.overlays]]
description = "Append Patch0383/Patch0384 (os-prober reverts) to the end of the grub.patches series"
type = "file-search-replace"
file = "grub.patches"
regex = 'Patch0382: 0382-Set-correctly-the-memory-attributes-for-the-kernel-P\.patch'
replacement = '''Patch0382: 0382-Set-correctly-the-memory-attributes-for-the-kernel-P.patch
Patch0383: 0383-Revert-Revert-templates-Disable-the-os-prober-by-default.patch
Patch0384: 0384-Revert-Revert-templates-Properly-disable-the-os-prober-by-d.patch'''
