[components.cpio]

[[components.cpio.overlays]]
description = "Drop BR on 'rmt'. Mirroring Rawhide's https://src.fedoraproject.org/rpms/cpio/c/84d5a4fe965609681000fd3911b7246c2a6973fb?branch=rawhide. Required to remove the need for the `star` component (provider of `rmt`)."
type = "spec-search-replace"
regex = ',\s*rmt\b'
replacement = ''

[[components.cpio.overlays]]
description = "Drop the `rm -f $RPM_BUILD_ROOT%{_libexecdir}/rmt` line from %install. cpio's build tree no longer ships its own `rmt` helper under `_libexecdir`, so the deletion is a stale leftover. Mirrors the same Fedora rawhide commit (84d5a4fe) referenced by the BR-drop overlay above."
type = "spec-search-replace"
section = "%install"
regex = "rm -f \\$RPM_BUILD_ROOT%\\{_libexecdir\\}/rmt"
replacement = ""

# ---------------------------------------------------------------------------
# TEMPORARY — CI VALIDATION ONLY. REMOVE BEFORE MERGE.
# Intentionally fails the cpio build to validate that the ADO PR package-build
# pipeline turns the check red and dumps the per-component build logs. This is
# a deliberate failure, NOT a real change. Comment out this single overlay
# block to make cpio build green again (e.g. to validate a clean multi-package
# run alongside csnappy).
# ---------------------------------------------------------------------------
[[components.cpio.overlays]]
description = "TEMP CI-only: intentionally fail the build to validate the ADO PR failure flow (REMOVE before merge)"
type = "spec-prepend-lines"
section = "%build"
lines = [
    "echo 'INTENTIONAL CI FAILURE: validating ADO PR build-failure detection'",
    "exit 1",
]
