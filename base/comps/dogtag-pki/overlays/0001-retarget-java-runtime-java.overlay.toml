# AZL uses Microsoft OpenJDK 25 instead of Fedora OpenJDK 25. Retarget each
# %define line individually so we don't accidentally rewrite historical
# %changelog entries that mention these monikers (spec-search-replace
# cannot be scoped to the preamble alone).

[metadata]
category = "azl-compatibility"
upstream-status = "inapplicable"

# Dogtag needs compat's system trust-store integration at runtime. Remove these
# runtime overlays once its required provider guarantees system trust integration
# across installs and upgrades without the compatibility package.
[[overlays]]
description = "Require Microsoft OpenJDK compatibility and system trust through java_runtime"
type = "spec-search-replace"
regex = "^%define java_runtime java-(21|25)-openjdk$"
replacement = "%define java_runtime msopenjdk-25-fedora-compat"

[[overlays]]
description = "Require system trust integration for Dogtag's runtime JDK dependency"
type = "spec-search-replace"
regex = '^Requires:\s+%\{java_devel\}$'
replacement = 'Requires:         msopenjdk-25-fedora-compat'

[[overlays]]
description = "Retarget the Java 21 fallback Maven binding to OpenJDK 25"
type = "spec-search-replace"
regex = "^%define maven_local maven-local-openjdk21$"
replacement = "%define maven_local maven-local-openjdk25"
