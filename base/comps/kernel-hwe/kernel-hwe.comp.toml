[components.kernel-hwe]
# kernel-hwe reuses the maintained local kernel packaging while carrying an
# independent source, release, package namespace, and AZL config overrides.
spec = { type = "local", path = "../kernel/kernel.spec" }
release = { calculation = "manual" }

[[components.kernel-hwe.overlays]]
description = "Add the aarch64 HWE config overrides consumed by the shared kernel spec"
type = "file-add"
file = "6.18-hwe-aarch64-azl-override.config"
source = "6.18-hwe-aarch64-azl-override.config"

[[components.kernel-hwe.overlays]]
description = "Add the x86_64 HWE config overrides consumed by the shared kernel spec"
type = "file-add"
file = "6.18-hwe-x86_64-azl-override.config"
source = "6.18-hwe-x86_64-azl-override.config"

[components.kernel-hwe.build.defines]
package_name = "kernel-hwe"
source_package_name = "kernel"
config_package_name = "kernel"
azl_pkgrelease = "1"
kextraversion = "1"
specrpmversion = "6.18.43"
patchversion = "6.18"
kversion = "6"
patchlevel = "18"
kabiversion = "6.18.13"
kernel_source_archive = "kernel-6.18.43.1.tar.gz"
kernel_source_dir = "CBL-Mariner-Linux-Kernel-rolling-lts-azl4-hwe-6.18.43.1"
azl_config_prefix = "6.18"
azl_config_override_prefix = "6.18-hwe"
with_azl_config_overrides = "1"
nvidia_open_version = "610.57.04"
# Keep all ancillary outputs, but give every non-kernel RPM a distinct name so
# the standard and HWE source packages can coexist in the same repository.
perf_package_name = "perf-hwe"
python_perf_package_name = "python3-perf-hwe"
libperf_package_name = "libperf-hwe"
rtla_package_name = "rtla-hwe"
rv_package_name = "rv-hwe"
nvidia_kmod_name = "nvidia-open-hwe"
nvidia_kmod_matched_name = "kmod-nvidia-open-hwe-matched"

