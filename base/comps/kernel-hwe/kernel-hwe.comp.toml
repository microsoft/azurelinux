[components.kernel-hwe]
# kernel-hwe reuses the maintained local kernel packaging while tracking the
# rolling-lts/azl4-hwe source branch as an independently named package.
spec = { type = "local", path = "kernel-hwe.spec" }

# Keep release handling aligned with the source kernel spec.
release = { calculation = "manual" }

[components.kernel-hwe.build.defines]
# Select 6.18.43.1 and its GitHub archive extraction directory without
# diverging further from the current kernel spec.
specrpmversion = "6.18.43"
kernel_source_dir = "CBL-Mariner-Linux-Kernel-rolling-lts-azl4-hwe-6.18.43.1"

# Preserve the copied kernel source manifest entry while directing lookaside
# lookup to the original kernel namespace rather than the new component name.
[[components.kernel-hwe.source-files]]
filename = "linux-6.18.13.tar.xz"
hash = "a1d1b27391ed55ae2b17dd25841037d3399e4d87900eb098af45b5b6bcedc095626971d069ff7a9daf46b6379705f3b88076206ecac68600bd04a35e7872440b"
hash-type = "SHA512"
origin = { type = "download", uri = "https://src.fedoraproject.org/repo/pkgs/kernel/linux-6.18.13.tar.xz/sha512/a1d1b27391ed55ae2b17dd25841037d3399e4d87900eb098af45b5b6bcedc095626971d069ff7a9daf46b6379705f3b88076206ecac68600bd04a35e7872440b/linux-6.18.13.tar.xz" }
replace-upstream = true
replace-reason = "The copied local source manifest retains this kernel lookaside entry; use the original kernel namespace because kernel-hwe has no Fedora lookaside namespace."

# Azure Linux HWE kernel source tarball (rolling-lts/azl4-hwe).
[[components.kernel-hwe.source-files]]
filename = "kernel-6.18.43.1.tar.gz"
hash = "6941bcc7dc0b5e329b3a2bab967705e8c1eb1cb8ebe89a30d11c0db8dbb6c3ef68d6124c855f9912a27476335dd343c47b52209b252a36c2203842fc544b2b6d"
