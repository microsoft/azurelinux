# additional rpminspect configuration for this branch

---
inspections:
    upstream: off

badfuncs:
    ignore:
        - /usr/libexec/ksamples/*
        - /usr/libexec/kselftests/*

emptyrpm:
    expected_empty:
        - kernel-hwe
        - kernel-hwe-debug
        - kernel-hwe-debug-devel-matched
        - kernel-hwe-devel-matched
        - kernel-hwe-modules-extra-matched
        - kernel-hwe-rt
        - kernel-hwe-rt-debug
        - kernel-hwe-rt-debug-devel-matched
        - kernel-hwe-rt-devel-matched
        - kernel-hwe-rt-modules-extra-matched
        - kernel-hwe-64k
        - kernel-hwe-64k-debug
        - kernel-hwe-64k-debug-devel-matched
        - kernel-hwe-64k-devel-matched
        - kernel-hwe-64k-modules-extra-matched
        - kernel-hwe-rt-64k
        - kernel-hwe-rt-64k-debug
        - kernel-hwe-rt-64k-debug-devel-matched
        - kernel-hwe-rt-64k-devel-matched
        - kernel-hwe-rt-64k-modules-extra-matched

patches:
    ignore_list:
        - linux-kernel-test.patch
        - patch-6.18-redhat.patch

runpath:
    ignore:
        - /usr/libexec/kselftests/bpf/urandom_read
        - /usr/libexec/kselftests/bpf/no_alu32/urandom_read
        - /usr/libexec/kselftests/bpf/cpuv4/urandom_read
