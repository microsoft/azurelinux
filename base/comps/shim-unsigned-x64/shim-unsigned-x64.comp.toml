[components.shim-unsigned-x64]
spec = { type = "upstream", upstream-distro = { name = "fedora", version = "43" }, upstream-commit = "bacb81905ea6806b97b968527e5ca9b2e3f0f7b4" }

overlays = [
    # Workaround: add dist tag to the release to avoid NEVR conflicts
    # while we are still rebuilding all packages in new tags nightly.
    { type = "spec-update-tag", tag = "Release", value = "2%{?dist}" },

    # Workaround: create a compat symlink that does not include the dist tag.
    { type = "spec-append-lines", section = "%install", lines = ["ln -s %{version}-%{release} %{buildroot}%{_datadir}/shim/%{version}-2"] },
    { type = "spec-append-lines", section = "%files", lines = ["%{_datadir}/shim/%{version}-2"] },

    # Lock EFIDIR to "azurelinux" so the unsigned shim binaries embed the
    # correct ESP subdirectory regardless of the build chroot's
    # /etc/os-release. Upstream derives `efidir` from `ID=` in os-release;
    # in any chroot where that isn't yet `azurelinux` (Fedora bootstrap,
    # etc.) the binary bakes in `fedora` and end
    # users see /boot/efi/EFI/fedora/ instead of /boot/efi/EFI/azurelinux/.
    { description = "Lock efidir to 'azurelinux' so the unsigned shim binaries embed the correct ESP subdirectory regardless of the build chroot's /etc/os-release", type = "spec-search-replace", regex = '^%global efidir %\(eval echo \$\(grep .*\)\)$', replacement = '%global efidir azurelinux' },
]
