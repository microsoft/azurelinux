# Keep the distribution's intentional fdk-aac-free exclusion. Remove Fedora's
# decoder patch and its configure option together with the build dependency.
[metadata]
category = "azl-pruning"
upstream-status = "inapplicable"
bugs = [{ url = "https://github.com/microsoft/azurelinux/pull/17331" }]

[[overlays]]
description = "Remove explicit application of the excluded Fedora FDK-AAC patch"
type = "spec-search-replace"
section = "%prep"
regex = '^%patch -P401 -p1 -b \.1667096$'

[[overlays]]
description = "Remove Fedora's system FDK-AAC integration because Azure Linux excludes fdk-aac-free"
type = "patch-remove"
file = "mozilla-1667096.patch"

[[overlays]]
description = "Remove the system FDK-AAC option introduced by the excluded Fedora patch"
type = "file-search-replace"
file = "firefox-mozconfig"
regex = '(?m)^ac_add_options --with-system-fdk-aac\r?\n'

[[overlays]]
description = "Remove the build dependency for the excluded FDK-AAC decoder"
type = "spec-remove-tag"
tag = "BuildRequires"
value = "fdk-aac-free-devel"
