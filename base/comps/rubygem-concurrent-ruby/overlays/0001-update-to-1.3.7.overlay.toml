# Fedora does not package rubygem-concurrent-ruby 1.3.7 on f43/f44 yet. Update to the upstream
# release for these CVE fixes:
# CVE-2026-54904, CVE-2026-54905, CVE-2026-54906
# Remove this overlay once the imported Fedora spec packages 1.3.7 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 1.3.7"
type = "spec-update-tag"
tag = "Version"
value = "1.3.7"

[[overlays]]
description = "Remove the obsolete concurrent-ruby-1.3.5-specs.tar.gz source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(concurrent-ruby-1\.3\.5-specs\.tar\.gz\) = [0-9a-f]+(?:\r?\n|$)'

[[overlays]]
description = "Remove the obsolete concurrent-ruby-1.3.5.gem source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(concurrent-ruby-1\.3\.5\.gem\) = [0-9a-f]+(?:\r?\n|$)'

[[overlays]]
description = "Take the test suite from the upstream v1.3.7 tag archive instead of a generated spec/ tarball"
type = "spec-update-tag"
tag = "Source1"
value = "https://github.com/ruby-concurrency/concurrent-ruby/archive/v%{version}/%{gem_name}-%{version}.tar.gz"

# The tag archive unpacks to the same %{gem_name}-%{version}/ directory as the gem, so it can't
# be unpacked by %setup -b 1. No structured overlay edits %setup options, hence the anchored
# whole-line replacement.
[[overlays]]
description = "Stop unpacking Source1 with %setup"
type = "spec-search-replace"
section = "%prep"
regex = '^%setup -q -n %\{gem_name\}-%\{version\} -b 1$'
replacement = "%setup -q -n %{gem_name}-%{version}"

[[overlays]]
description = "Extract only spec/ from the tag archive to %{builddir}/spec, where %check expects it"
type = "spec-append-lines"
section = "%prep"
lines = [
  "# Test suite from the upstream tag archive",
  "tar -xzf %{SOURCE1} -C %{builddir} --strip-components=1 %{gem_name}-%{version}/spec",
  "",
]
