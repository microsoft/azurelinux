# Fedora does not package rubygem-concurrent-ruby 1.3.7 on f43/f44 yet. Update to the upstream
# release for these CVE fixes:
# CVE-2026-54904, CVE-2026-54905, CVE-2026-54906
# Remove this overlay once the imported Fedora spec packages 1.3.7 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 1.3.7"
type = "spec-update-tag"
tag = "Version"
value = "1.3.7"

[[overlays]]
description = "Remove the obsolete concurrent-ruby-1.3.5-specs.tar.gz source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(concurrent-ruby-1\.3\.5-specs\.tar\.gz\) = [0-9a-f]+(?:\r?\n|$)'

[[overlays]]
description = "Remove the obsolete concurrent-ruby-1.3.5.gem source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(concurrent-ruby-1\.3\.5\.gem\) = [0-9a-f]+(?:\r?\n|$)'
