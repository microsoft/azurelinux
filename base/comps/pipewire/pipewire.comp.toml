[components.pipewire]
# Upstream Release: %[%{baserelease} + %{azl_release}]%{?snapdate:.%{snapdate}git%{shortcommit}}%{?dist}
release = { calculation = "static", counter = { source = "spec-macro", directive = "global", name = "baserelease" } }
build.without = ["v4l2", "roc"]

[components.pipewire.build.defines]
# AZL-only release counter. Added to upstream's %{baserelease} so the final
# Release tag is a single number (Fedora-style schema) that bumps independently
# of upstream. Increment when shipping new AZL-only changes on top of the
# pinned upstream commit.
#   1 - 5d461a2449 feat: introduce deterministic commit resolution via Azure Linux lock file
#   2 - introduce azl_release for pipewire
#   3 - disable opus codec support
#   4 - drop webrtc-audio-processing BR
#   5 - disable v4l2 support
#   6 - disable roc support
#   7 - drop AAC bluetooth codec
azl_release = "7"

