[components.pipewire]
build.without = ["v4l2", "roc"]

[[components.pipewire.overlays]]
description = "Restore correct Release"
type = "spec-set-tag"
tag = "Release"
value = "%{baserelease}%{?snapdate:.%{snapdate}git%{shortcommit}}%{?dist}"
metadata.category = "azl-temp-workaround"
metadata.upstream-status = "inapplicable"

[[components.pipewire.overlays]]
description = "Set correct baserelease"
type = "spec-search-replace"
regex = "%global baserelease 1"
replacement = "%global baserelease 8"
metadata.category = "azl-temp-workaround"
metadata.upstream-status = "inapplicable"
