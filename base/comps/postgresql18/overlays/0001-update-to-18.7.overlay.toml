# Fedora does not package PostgreSQL 18.7 on f43/f44 yet (both are on 18.6). Update to
# the upstream 18.7 release, and the bundled previous-major server used by the
# -upgrade subpackage from 17.11 to 17.12, for the CVE fixes in the
# PostgreSQL 18.7 release. Remove this overlay once the imported Fedora spec
# packages 18.7 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 18.7"
type = "spec-update-tag"
tag = "Version"
value = "18.7"

[[overlays]]
description = "Update the bundled previous-major release to 17.12"
type = "spec-search-replace"
regex = '^%global prevversion %\{prevmajorversion\}\.11$'
replacement = "%global prevversion %{prevmajorversion}.12"

[[overlays]]
description = "Remove the obsolete postgresql-18.6.tar.bz2 source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(postgresql-18\.6\.tar\.bz2\) = [0-9a-f]+(?:\r?\n|$)'

[[overlays]]
description = "Remove the obsolete postgresql-17.11.tar.bz2 source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(postgresql-17\.11\.tar\.bz2\) = [0-9a-f]+(?:\r?\n|$)'

[[overlays]]
description = "Remove the obsolete postgresql-18.6.tar.bz2.sha256 source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(postgresql-18\.6\.tar\.bz2\.sha256\) = [0-9a-f]+(?:\r?\n|$)'

[[overlays]]
description = "Remove the obsolete postgresql-17.11.tar.bz2.sha256 source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(postgresql-17\.11\.tar\.bz2\.sha256\) = [0-9a-f]+(?:\r?\n|$)'
