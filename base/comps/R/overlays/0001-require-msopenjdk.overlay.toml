[metadata]
category = "azl-compatibility"
upstream-status = "inapplicable"

[[overlays]]
description = "Build R Java support with Microsoft OpenJDK"
type = "spec-search-replace"
regex = '^BuildRequires:  java-devel$'
replacement = "BuildRequires:  msopenjdk-25"

[[overlays]]
description = "Run R Java support with Microsoft OpenJDK"
type = "spec-search-replace"
regex = '^Requires:       java-headless$'
replacement = "Requires:       msopenjdk-25"