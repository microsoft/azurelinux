[metadata]
category = "azl-compatibility"
upstream-status = "inapplicable"

[[overlays]]
description = "Point the existing XMvn OpenJDK 25 compatibility toolchain at Microsoft OpenJDK 25"
type = "file-search-replace"
file = "toolchains-openjdk25.xml"
regex = '<jdkHome>/usr/lib/jvm/java-25-openjdk</jdkHome>'
replacement = '<jdkHome>/usr/lib/jvm/msopenjdk-25</jdkHome>'

[[overlays]]
description = "Require Microsoft OpenJDK 25 from the existing XMvn OpenJDK 25 compatibility toolchain"
type = "spec-search-replace"
section = "%install"
regex = '^%jp_binding --verbose --base-pkg xmvn-minimal --binding-pkg xmvn-toolchain-openjdk25 .* --requires java-25-openjdk-devel$'
replacement = '%jp_binding --verbose --base-pkg xmvn-minimal --binding-pkg xmvn-toolchain-openjdk25 --variant openjdk25 --ghost xmvn-toolchains.xml --target %{_datadir}/%{name}/conf/toolchains-openjdk25.xml --requires msopenjdk-25'