[metadata]
category = "azl-security-compliance"
upstream-status = "inapplicable"

[[overlays]]
description = "Microsoft build of Go's default systemcrypto backend dlopens libcrypto.so.3 at runtime (provided by openssl-libs, not the openssl CLI); auto-dependency generation is disabled, so require openssl-libs explicitly"
type = "spec-add-tag"
tag = "Requires"
value = "openssl-libs"

[[overlays]]
description = "Require a registered FIPS provider for the OpenSSL crypto backend"
type = "spec-add-tag"
tag = "Requires"
value = "openssl(fips-provider)"
