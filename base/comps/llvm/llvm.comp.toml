[components.llvm]

# Workaround: Disable MLIR until python-nanobind (and its dep robin-map)
# are imported into Azure Linux. MLIR is gated on %{with mlir} in the
# upstream spec and pulls in python3-nanobind-devel which doesn't exist yet.
# Workaround: OpenMP tests fail in systemd-nspawn mock (95% failure rate)
# due to missing /proc/sys/kernel tunables and cgroup support for threads/forks.
build.without = ["mlir", "check"]

[[components.llvm.overlays]]
description = "Use the Azure Linux GCC toolchain triple in clang's default config so clang can find gcc runtime files in stage2 builds"
type = "spec-search-replace"
regex = '%global cfg_file_content --gcc-triple=%{_target_cpu}-redhat-linux'
replacement = '%global cfg_file_content --gcc-triple=%{_target_cpu}-%{_vendor}-linux'

# Strip embedded LLVM-bitcode / LTO companion sections from every
# `libLLVM*.a` archive shipped by the `llvm-static` sub-package.
#
# Background
# ----------
# The LLVM build uses clang with Thin-LTO and FatLTO objects, which
# leaves a large `.llvmbc` (embedded bitcode), `.llvmcmd` (cc1
# command-line companion), `.llvm.lto` (FatLTO embedding) section --
# and, defensively, `.gnu.lto_*` / `.gnu.debuglto_*` sections in case
# any member ever happens to have been compiled with gcc `-flto` --
# inside each `.o` member of every `libLLVM*.a` archive. Those
# sections are only useful for *re-linking* with LTO; the native
# linker ignores them when a consumer links a static archive into a
# regular (non-LTO) build. They typically double or triple the
# compressed RPM-payload size of `llvm-static`, which makes the
# RPM exceed the decompression budget of the automated package-
# signing pipeline.
#
# Stripping them with `objcopy --remove-section` preserves every
# linker-visible bit (`.text`, `.data`, `.bss`, `.symtab`,
# `.strtab`, relocations, exported symbols) -- `nm` output is
# unchanged before / after -- but materially shrinks the resulting
# RPM. Native consumers (e.g. `spirv-llvm-translator`) keep linking
# normally; only consumers who explicitly drive `clang -flto` across
# the LLVM static libraries would silently fall back to native-only
# linking. There are no such consumers in Azure Linux today.
#
# Path-glob rationale
# -------------------
# The default (non-compat) build runs
# `move_and_replace_with_symlinks %{buildroot}%{install_libdir} %{buildroot}%{_libdir}`
# in %install, after which the real `libLLVM*.a` files live under
# `%{buildroot}%{_libdir}/` (i.e. `/usr/lib64/`) and the
# `%{install_libdir}` paths are symlinks back to them. Targeting
# `%{buildroot}%{_libdir}/` is therefore correct for the default
# layout. For the compat build the archives stay under
# `%{install_libdir}`; the loop globs both paths and skips any
# non-file entries (i.e. dangling symlinks) so the overlay is
# layout-agnostic.
#
# `objcopy` from binutils iterates over `ar` archive members
# automatically, so a single invocation per archive is enough.
[[components.llvm.overlays]]
description = "Strip embedded LLVM bitcode / LTO companion sections (.llvmbc, .llvmcmd, .llvm.lto, .gnu.lto_*, .gnu.debuglto_*) from every libLLVM*.a archive member at %install time. Shrinks the llvm-static RPM payload by 30-60% so it fits within downstream decompression budgets; preserves every linker-visible symbol, relocation, and native section, so `nm` output and native-link behaviour are unchanged."
type = "spec-append-lines"
section = "%install"
lines = [
    "",
    "# Strip LLVM bitcode + LTO companion sections from libLLVM*.a archive",
    "# members. brp-strip-static-archive (run elsewhere via",
    "# `%undefine _preserve_static_debuginfo`) only strips DWARF (-g);",
    "# brp-strip-lto walks ELF files, not .a archives. Without this,",
    "# FatLTO leaves bitcode in every member and the resulting archives",
    "# are 2-3x larger than necessary, which inflates the llvm-static RPM",
    "# payload past downstream decompression budgets.",
    "#",
    "# Glob both %{_libdir} (real archives after move_and_replace_with_symlinks)",
    "# and %{install_libdir} (real archives in compat builds; symlinks otherwise).",
    "# `[ -f \"$_archive\" ] || continue` skips non-regular files (symlinks).",
    "# `objcopy` from binutils iterates `ar` archive members automatically.",
    "for _archive in %{buildroot}%{_libdir}/libLLVM*.a \\",
    "                %{buildroot}%{install_libdir}/libLLVM*.a; do",
    "    [ -f \"$_archive\" ] || continue",
    "    %{__objcopy} \\",
    "        --remove-section=.llvmbc \\",
    "        --remove-section=.llvmcmd \\",
    "        --remove-section=.llvm.lto \\",
    "        --remove-section='.gnu.lto_*' \\",
    "        --remove-section='.gnu.debuglto_*' \\",
    "        \"$_archive\" 2>/dev/null || :",
    "done",
]
