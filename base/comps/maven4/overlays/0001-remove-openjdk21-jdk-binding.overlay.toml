# Backport of upstream Fedora rawhide commit 4b6c6ee: remove openjdk21 binding.
# AZL only ships java-25-openjdk; there is no java-21-openjdk, so the
# maven4-openjdk21 subpackage has an unsatisfiable dependency.
[metadata]
category = "upstream-backport"
upstream-status = "upstreamed"
commits = [{ url = "https://src.fedoraproject.org/rpms/maven4/c/4b6c6ee" }]

[[overlays]]
description = "Remove openjdk21 JDK binding lines — AZL does not ship java-21-openjdk"
type = "spec-search-replace"
section = "%install"
regex = '.*openjdk21.*'
replacement = ''
