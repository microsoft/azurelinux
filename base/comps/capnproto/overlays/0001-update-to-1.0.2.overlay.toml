# Fedora f43 packages capnproto 1.0.1 and f44 jumps to 1.3.0. Update to the
# upstream 1.0.2 bugfix release on the same f43 spec for this CVE fix:
# CVE-2023-48230
# Remove this overlay once the imported Fedora spec packages 1.0.2 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 1.0.2"
type = "spec-update-tag"
tag = "Version"
value = "1.0.2"

[[overlays]]
description = "Remove the obsolete 1.0.1 source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(capnproto-c\+\+-1\.0\.1\.tar\.gz\) = [0-9a-f]+(?:\r?\n|$)'
