[components.'rust-digest0.10']
# Version-suffixed compat package providing the OLDER digest 0.10.7, pinned
# at the commit the default rust-digest previously resolved to (via the
# distro snapshot), to serve its ~30 existing dynamically-generated consumers
# (rust-blake2, rust-rsa, rust-sha3, rust-ripemd, rust-sm3, rust-uucore,
# etc.) which require digest < 0.11.0. The default rust-digest is now pinned
# to Fedora f43 HEAD (0.11.3) to satisfy uv's crate-alignment cascade.
spec = { type = "upstream", upstream-distro = { name = "fedora", version = "43" }, upstream-name = "rust-digest", upstream-commit = "47427be5cbcffc742019086715f7ec4db281eaf0" }

[[components.'rust-digest0.10'.overlays]]
description = "Rename package to rust-digest0.10 so it can coexist with the newer default rust-digest"
type = "spec-set-tag"
tag = "Name"
value = "rust-digest0.10"
