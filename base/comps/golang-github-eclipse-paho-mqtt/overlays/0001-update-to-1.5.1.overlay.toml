# Fedora does not package golang-github-eclipse-paho-mqtt 1.5.1 on f43/f44 yet. Update to the upstream
# release for these CVE fixes:
# CVE-2025-10543
# Remove this overlay once the imported Fedora spec packages 1.5.1 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 1.5.1"
type = "spec-update-tag"
tag = "Version"
value = "1.5.1"

[[overlays]]
description = "Remove the obsolete paho.mqtt.golang-1.5.0.tar.gz source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(paho\.mqtt\.golang-1\.5\.0\.tar\.gz\) = [0-9a-f]+(?:\r?\n|$)'
