# CMake gates the unshipped alffplay example on find_package(FFmpeg), so removing
# this dependency skips that example rather than a shipped subpackage.
[metadata]
category = "azl-pruning"
upstream-status = "needs-upstream-hook"

[[overlays]]
description = "Drop BuildRequires on pkgconfig(libavcodec) — only used by uninstalled alffplay example"
type = "spec-remove-tag"
tag = "BuildRequires"
value = "pkgconfig(libavcodec)"
