# AZL uses Microsoft OpenJDK 25 instead of Fedora OpenJDK 25. Retarget each %define
# line individually so we don't accidentally rewrite historical
# %changelog entries (spec-search-replace cannot be scoped to the
# preamble alone).

[metadata]
category = "azl-pruning"
upstream-status = "upstreamable"
[[overlays]]
description = "Retarget java_devel to Microsoft OpenJDK 25"
type = "spec-search-replace"
regex = "^%define java_devel java-(21|25)-openjdk-devel$"
replacement = "%define java_devel msopenjdk-25"

[[overlays]]
description = "Retarget java_headless to Microsoft OpenJDK 25"
type = "spec-search-replace"
regex = "^%define java_headless java-(21|25)-openjdk-headless$"
replacement = "%define java_headless msopenjdk-25"

[[overlays]]
description = "Retarget java_home to Microsoft OpenJDK 25"
type = "spec-search-replace"
regex = "^%define java_home %\\{_jvmdir\\}/jre-(21|25)-openjdk$"
replacement = "%define java_home %{_jvmdir}/msopenjdk-25"
