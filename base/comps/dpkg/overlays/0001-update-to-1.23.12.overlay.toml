# Fedora packages dpkg 1.23.11 on every branch. Update to the upstream
# release for this CVE fix:
# CVE-2026-91094
# Remove this overlay once the imported Fedora spec packages 1.23.12 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 1.23.12"
type = "spec-update-tag"
tag = "Version"
value = "1.23.12"

[[overlays]]
description = "Remove the obsolete 1.23.11 source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(dpkg_1\.23\.11\.tar\.xz\) = [0-9a-f]+(?:\r?\n|$)'
