# Components with %check failures during initial distro bringup.
# These should be investigated and re-enabled individually over time.
[component-groups.check-skip-initial-failures]
description = "Components with check failures during initial distro bringup"
components = []

[component-groups.check-skip-initial-failures.default-component-config.build]
check = { skip = true, skip_reason = "Disabling checks for initial set of failures." }
