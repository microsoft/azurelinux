# Fedora f43, f44 and rawhide all package plexus-utils4 4.0.2. Update to the
# upstream 4.0.3 patch release on the same f43 spec for this CVE fix:
# CVE-2025-67030
# Remove this overlay once the imported Fedora spec packages 4.0.3 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 4.0.3"
type = "spec-update-tag"
tag = "Version"
value = "4.0.3"

[[overlays]]
description = "Remove the obsolete 4.0.2 source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(plexus-utils-4\.0\.2\.tar\.gz\) = [0-9a-f]+(?:\r?\n|$)'
