# Keep coreutils pinned until all utility providers are available.
# Utility consumers now use their generated Cargo requirements.

[component-groups.rust-uucore-version-pin]
description = "Retain coreutils bootstrap guards until utility providers are available"
components = ["rust-coreutils"]

[[component-groups.rust-uucore-version-pin.default-component-config.overlays]]
description = "Pin uucore to 0.0.27 to prevent version skew with Fedora f43-updates repo"
type = "spec-insert-tag"
tag = "BuildRequires"
value = "rust-uucore-devel = 0.0.27"

[[component-groups.rust-uucore-version-pin.default-component-config.overlays]]
description = "Pin uucore_procs to 0.0.27 to match pinned uucore version — the 0.7.0 proc macros generate code calling 0.7.0-only APIs"
type = "spec-insert-tag"
tag = "BuildRequires"
value = "rust-uucore_procs-devel = 0.0.27"

[[component-groups.rust-uucore-version-pin.default-component-config.overlays]]
description = "Block uucore > 0.0.27 from being pulled via dynamic BuildRequires from %cargo_generate_buildrequires"
type = "spec-insert-tag"
tag = "BuildConflicts"
value = "rust-uucore-devel > 0.0.27"

[[component-groups.rust-uucore-version-pin.default-component-config.overlays]]
description = "Block uucore_procs > 0.0.27 to match pinned uucore version"
type = "spec-insert-tag"
tag = "BuildConflicts"
value = "rust-uucore_procs-devel > 0.0.27"
