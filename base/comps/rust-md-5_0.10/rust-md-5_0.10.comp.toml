[components.'rust-md-5_0.10']
# Version-suffixed compat package providing the OLDER md-5 0.10.6, pinned at
# the commit the default rust-md-5 previously resolved to (via the distro
# snapshot), to serve its existing dynamically-generated consumers (rust-uucore,
# rust-uuid, rust-lopdf, rust-openssh-keys, rust-sequoia-openpgp) which
# require md-5 < 0.11.0. The default rust-md-5 is now pinned to Fedora f43
# HEAD (0.11.0) to satisfy uv's crate-alignment cascade. Distinct from the
# pre-existing rust-md-5_0.9 compat package, which serves an even older
# md-5 0.9 range.
spec = { type = "upstream", upstream-distro = { name = "fedora", version = "43" }, upstream-name = "rust-md-5", upstream-commit = "18f1a928b23e16c241f15574984d0e4fe2041681" }

[[components.'rust-md-5_0.10'.overlays]]
description = "Rename package to rust-md-5_0.10 so it can coexist with the newer default rust-md-5"
type = "spec-set-tag"
tag = "Name"
value = "rust-md-5_0.10"
