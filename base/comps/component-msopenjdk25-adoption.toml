[component-groups.msopenjdk25-headless-consumers]
description = "Components that require Microsoft OpenJDK 25 system trust integration at runtime"
components = [
    "ant-contrib",
    "antlr4-project",
    "bsh",
    "libwebp",
    "opencv",
    "openmpi",
    "sphinx",
    "texlive-base",
]

# These runtimes need compat's system trust-store integration, not just a JVM.
# Remove this overlay once their required provider guarantees system trust
# integration across installs and upgrades without the compatibility package.
[[component-groups.msopenjdk25-headless-consumers.default-component-config.overlays]]
description = "Require Microsoft OpenJDK compatibility and system trust for headless Java runtimes"
type = "spec-search-replace"
regex = '^Requires:\s+(java|java-25)-headless$'
replacement = 'Requires: msopenjdk-25-fedora-compat'

[component-groups.msopenjdk25-headless-consumers.default-component-config.overlays.metadata]
category = "azl-compatibility"
upstream-status = "inapplicable"

[component-groups.msopenjdk25-generic-jvm-runtime-consumers]
description = "Components that require compatibility-owned JVM paths and system trust at runtime"
components = [
    "R",
    "byteman",
    "octave",
    "systemtap",
    "tomcat",
]

# Removing Fedora OpenJDK does not make the provider integrate system trust.
# Keep compat required until the provider guarantees both the runtime paths
# and system trust integration across installs and upgrades.
[[component-groups.msopenjdk25-generic-jvm-runtime-consumers.default-component-config.overlays]]
description = "Require Microsoft OpenJDK compatibility paths and system trust at runtime"
type = "spec-search-replace"
regex = '^Requires:\s+(java(-25)?-headless(\s+>=\s+1:1\.8)?|java-devel|\(java-25-headless\s+or\s+java-25\))$'
replacement = 'Requires: msopenjdk-25-fedora-compat'

[component-groups.msopenjdk25-generic-jvm-runtime-consumers.default-component-config.overlays.metadata]
category = "azl-compatibility"
upstream-status = "inapplicable"

[component-groups.msopenjdk25-java-define-consumers]
description = "Components whose Java dependency macros must resolve to Microsoft OpenJDK 25"
components = [
    "dogtag-pki",
    "jss",
    "ldapjdk",
]

# These specs pin their development dependency to a versioned Fedora OpenJDK
# package, which can select Fedora OpenJDK instead of Microsoft OpenJDK 25.
# Remove this overlay once the macro names a capability provided by
# msopenjdk-25 and no competing Fedora OpenJDK package can satisfy it.
[[component-groups.msopenjdk25-java-define-consumers.default-component-config.overlays]]
description = "Use Microsoft OpenJDK 25 for Java development dependency macros"
type = "spec-search-replace"
regex = '^%define java_devel java-(21|25)-openjdk-devel$'
replacement = '%define java_devel msopenjdk-25'

[component-groups.msopenjdk25-java-define-consumers.default-component-config.overlays.metadata]
category = "azl-compatibility"
upstream-status = "inapplicable"

# These runtime macros must select compat so Java uses the system trust store.
# Remove this overlay once their required provider guarantees system trust
# integration across installs and upgrades without the compatibility package.
[[component-groups.msopenjdk25-java-define-consumers.default-component-config.overlays]]
description = "Require Microsoft OpenJDK compatibility and system trust through headless Java macros"
type = "spec-search-replace"
regex = '^%define java_headless java-(21|25)-openjdk-headless$'
replacement = '%define java_headless msopenjdk-25-fedora-compat'

[component-groups.msopenjdk25-java-define-consumers.default-component-config.overlays.metadata]
category = "azl-compatibility"
upstream-status = "inapplicable"

# These specs set JAVA_HOME to a versioned Fedora OpenJDK directory that is not
# provided by the required msopenjdk-25 package.
# Remove this overlay once they derive JAVA_HOME from the selected Java provider,
# or once their required Microsoft package guarantees the exact path they use.
[[component-groups.msopenjdk25-java-define-consumers.default-component-config.overlays]]
description = "Use Microsoft OpenJDK 25 for Java home macros"
type = "spec-search-replace"
regex = '^%define java_home %\{_jvmdir\}/jre-(21|25)-openjdk$'
replacement = '%define java_home %{_jvmdir}/msopenjdk-25'

[component-groups.msopenjdk25-java-define-consumers.default-component-config.overlays.metadata]
category = "azl-compatibility"
upstream-status = "inapplicable"

[component-groups.msopenjdk25-devel-consumers]
description = "Components that need compatibility-owned JVM paths while building"
components = [
    "R",
    "brltty",
    "graphviz",
    "libwebp",
    "subversion",
    "systemtap",
    "vtk",
]

# Generic development requirements can select msopenjdk-25, which does not own
# the Fedora-compatible JVM alternatives these builds reference directly.
[[component-groups.msopenjdk25-devel-consumers.default-component-config.overlays]]
description = "Require Microsoft OpenJDK compatibility paths while building"
type = "spec-search-replace"
regex = '^BuildRequires:\s+java-devel$'
replacement = 'BuildRequires: msopenjdk-25-fedora-compat'

[component-groups.msopenjdk25-devel-consumers.default-component-config.overlays.metadata]
category = "azl-compatibility"
upstream-status = "inapplicable"

[component-groups.msopenjdk25-maven-binding-consumers]
description = "Maven bindings that require compatibility-owned JVM paths and system trust"
components = [
    "maven",
    "maven4",
]

# Keep compat required until the provider guarantees the binding's JVM paths
# and system trust integration across installs and upgrades. Removing Fedora
# OpenJDK from the repository does not satisfy these requirements.
[[component-groups.msopenjdk25-maven-binding-consumers.default-component-config.overlays]]
description = "Require Microsoft OpenJDK compatibility paths and system trust for Maven bindings"
type = "spec-search-replace"
section = "%install"
regex = '^%jp_binding --verbose --variant openjdk25 --ghost maven%\{\?maven_version_suffix\}\.conf --target %\{_javaconfdir\}/maven%\{\?maven_version_suffix\}-openjdk25\.conf --provides %\{name\}-jdk-binding --requires java-25-openjdk-headless --recommends java-25-openjdk-devel$'
replacement = '%jp_binding --verbose --variant openjdk25 --ghost maven%{?maven_version_suffix}.conf --target %{_javaconfdir}/maven%{?maven_version_suffix}-openjdk25.conf --provides %{name}-jdk-binding --requires msopenjdk-25-fedora-compat'

[component-groups.msopenjdk25-maven-binding-consumers.default-component-config.overlays.metadata]
category = "azl-compatibility"
upstream-status = "inapplicable"

[component-groups.msopenjdk25-xmvn-toolchain-consumers]
description = "XMvn toolchain bindings backed by the Microsoft OpenJDK compatibility package"
components = [
    "xmvn",
    "xmvn5",
]

# The OpenJDK 25 toolchain bindings need compat's JVM layout and system trust.
# Remove this overlay once msopenjdk-25 guarantees both across installs and
# upgrades and provides the `java-25-openjdk-devel` capability directly.
[[component-groups.msopenjdk25-xmvn-toolchain-consumers.default-component-config.overlays]]
description = "Back the XMvn OpenJDK 25 toolchain with the Microsoft Fedora compatibility package"
type = "spec-search-replace"
section = "%install"
regex = '--requires java-25-openjdk-devel$'
replacement = '--requires msopenjdk-25-fedora-compat'

[component-groups.msopenjdk25-xmvn-toolchain-consumers.default-component-config.overlays.metadata]
category = "azl-compatibility"
upstream-status = "inapplicable"

[component-groups.msopenjdk25-explicit-runtime-consumers]
description = "Components that retain Fedora JVM launcher paths at runtime"
components = [
    "ecj",
    "xml-commons-resolver",
]

# XMvn launchers retain Fedora JVM paths but do not require the package that
# owns those alternatives. Remove this overlay once msopenjdk-25 provides the
# required headless Java capabilities, owns the JVM alternatives used by these
# launchers, and guarantees system trust integration across installs and upgrades.
[[component-groups.msopenjdk25-explicit-runtime-consumers.default-component-config.overlays]]
description = "Require the Microsoft OpenJDK compatibility paths at runtime"
type = "spec-insert-tag"
tag = "Requires"
value = "msopenjdk-25-fedora-compat"

[component-groups.msopenjdk25-explicit-runtime-consumers.default-component-config.overlays.metadata]
category = "azl-compatibility"
upstream-status = "inapplicable"
