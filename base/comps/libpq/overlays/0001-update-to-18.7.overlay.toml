# Remove this overlay once the imported Fedora spec packages 18.7 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 18.7"
type = "spec-update-tag"
tag = "Version"
value = "%{majorversion}.7"

[[overlays]]
description = "Drop the unused beta version macro"
type = "spec-search-replace"
regex = '^%global betaversion 18beta1$'
replacement = ""

[[overlays]]
description = "Download the release tarball instead of the beta"
type = "spec-update-tag"
tag = "Source0"
value = "https://ftp.postgresql.org/pub/source/v%{version}/postgresql-%{version}.tar.bz2"

[[overlays]]
description = "Download the release tarball checksum instead of the beta one"
type = "spec-update-tag"
tag = "Source1"
value = "https://ftp.postgresql.org/pub/source/v%{version}/postgresql-%{version}.tar.bz2.sha256"

[[overlays]]
description = "Unpack the release tarball"
type = "spec-search-replace"
section = "%prep"
regex = '^%autosetup -n postgresql-%\{betaversion\} -p1$'
replacement = "%autosetup -n postgresql-%{version} -p1"

[[overlays]]
description = "Remove the obsolete postgresql-18beta1.tar.bz2 source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(postgresql-18beta1\.tar\.bz2\) = [0-9a-f]+(?:\r?\n|$)'

[[overlays]]
description = "Remove the obsolete postgresql-18beta1.tar.bz2.sha256 source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(postgresql-18beta1\.tar\.bz2\.sha256\) = [0-9a-f]+(?:\r?\n|$)'
