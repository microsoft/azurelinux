[metadata]
category = "azl-compatibility"
upstream-status = "needs-upstream-hook"

[[overlays]]
description = "Discover compiler-rt's installed runtime directory so Rust works with both Stage 1 and native Stage 2 LLVM layouts"
type = "spec-prepend-lines"
section = "%build"
lines = ['%define compiler_rt_libdir $(dirname "$(find %{clang_lib} -type f -name libclang_rt.profile.a -print -quit)")']

[[overlays]]
description = "Use Clang's discovered compiler-rt directory for Rust profiler_builtins"
type = "spec-search-replace"
section = "%build"
regex = '%define profiler %{clang_lib}/%{_arch}-redhat-linux-gnu/libclang_rt.profile.a'
replacement = '%define profiler %{compiler_rt_libdir}/libclang_rt.profile.a'

[[overlays]]
description = "Use Clang's discovered compiler-rt directory for Rust optimized compiler builtins"
type = "spec-search-replace"
section = "%build"
regex = '%define optimized_builtins %{clang_lib}/%{_arch}-redhat-linux-gnu/libclang_rt.builtins.a'
replacement = '%define optimized_builtins %{compiler_rt_libdir}/libclang_rt.builtins.a'
