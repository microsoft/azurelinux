[components.rust]
tests.tests = [{ name = "tmt-rust-all" }]
# Fedora repo does not host 1.93, which the spec gets pinned to. Fetch
# spec from a more recent commit to pickup version - 1.94.1.
spec = { type = "upstream", upstream-distro = { name = "fedora", version = "43"}, upstream-commit = "b431103e3e71d30dda680c95d2f5d4fe50003436" }

# Brand rustc's --version string as "Azure Linux" instead of "Fedora".
[[components.rust.overlays]]
description = "Brand rustc release-description with %{dist_name} instead of Fedora/Red Hat"
type = "spec-search-replace"
regex = '^  --release-description="%\{\?fedora:Fedora \}%\{\?rhel:Red Hat \}%\{version\}-%\{release\}"$'
replacement = '  --release-description="%{dist_name} %{version}-%{release}"'

[components.rust.overlays.metadata]
category = "azl-branding-policy"
upstream-status = "inapplicable"
