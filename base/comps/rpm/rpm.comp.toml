[components.rpm]
# Upstream Release: %{?snapver:0.%{snapver}.}%{baserelease}%{?dist}
release = { calculation = "static", counter = { source = "spec-macro", directive = "global", name = "baserelease" } }

# Update vendor macro.
[[components.rpm.overlays]]
description = "Customize RPM vendor"
type = "spec-search-replace"
regex = "RPM_VENDOR=redhat"
replacement = "RPM_VENDOR=azurelinux"

