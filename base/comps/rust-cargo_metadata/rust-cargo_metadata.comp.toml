[components.rust-cargo_metadata]
# Pin to the f43 commit that skips the brittle `error1` selftest, which
# exact-matches Cargo's stderr and fails against the newer Cargo toolchain.
# TODO: Drop this override once the default Fedora 43 snapshot
# in distro/azurelinux.distro.toml advances past this commit.
spec = { type = "upstream", upstream-name = "rust-cargo_metadata", upstream-distro = { name = "fedora", version = "43" }, upstream-commit = "c0909bdc87d5decb511db8b3c7a702a3de683353" }
