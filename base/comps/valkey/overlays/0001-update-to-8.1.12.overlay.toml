# Fedora f43 ships valkey 8.1.11 and f44 moved to 9.0. Update the f43 spec to the upstream
# 8.1.12 patch release for this CVE fix:
# CVE-2026-130822
# Remove this overlay once the imported Fedora spec packages 8.1.12 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 8.1.12"
type = "spec-update-tag"
tag = "Version"
value = "8.1.12"

[[overlays]]
description = "Remove the obsolete valkey-8.1.11.tar.gz source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(valkey-8\.1\.11\.tar\.gz\) = [0-9a-f]+(?:\r?\n|$)'
