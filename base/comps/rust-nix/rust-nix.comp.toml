[components.rust-nix]
# Pin past the distro default snapshot (2026-02-24, nix 0.31.1) to Fedora f43
# HEAD, which carries nix 0.31.3. uv 0.10.12 requires
# crate(nix/default) >= 0.31.2, < 0.32.0, which 0.31.1 does not satisfy.
spec = { type = "upstream", upstream-distro = { name = "fedora", version = "43" }, upstream-commit = "a5123770ff162c11cef0401690de0e3faa668a6e" }

# Azure Linux kernels use 4-part versions (e.g. 6.6.121.1-1.azl3) which the
# semver crate in test helpers cannot parse.  Patch the require_kernel_version!
# macro to handle this by truncating to 3 numeric components.
[[components.rust-nix.overlays]]
description = "Add patch file to handle 4-part kernel versions in the require_kernel_version test macro"
type = "file-add"
file = "fix-4part-kernel-version.patch"
source = "fix-4part-kernel-version.patch"

[[components.rust-nix.overlays]]
description = "Register the 4-part kernel version fix patch in the spec"
type = "spec-insert-tag"
tag = "Patch9999"
value = "fix-4part-kernel-version.patch"

# inotify tests fail with ENOSPC in containerized/mock build environments due
# to exhausted inotify instance limits.
[[components.rust-nix.overlays]]
description = "Skip inotify tests that fail in containerized build environments (ENOSPC on inotify_init)"
type = "spec-search-replace"
section = "%check"
regex = "--skip 'src/sys/socket/mod.rs'"
replacement = "--skip sys::test_inotify\n    --skip 'src/sys/socket/mod.rs'"

# test_af_alg_aead fails with "bind failed: ENOENT" in containerized/mock
# build environments. ENOENT from an AF_ALG bind() specifically means the
# named transform (gcm(aes)) is not registered/loadable in the build
# kernel's crypto API, not that the AF_ALG address family itself is
# unsupported (that would fail earlier, at socket(), with EAFNOSUPPORT).
# Same class of issue as the existing test_af_alg_cipher skip above
# (host-kernel-dependent, not a regression from the 0.31.1->0.31.3 bump).
[[components.rust-nix.overlays]]
description = "Skip AF_ALG aead test that fails in containerized build environments (ENOENT on AF_ALG bind)"
type = "spec-search-replace"
section = "%check"
regex = "--skip sys::test_socket::test_af_alg_cipher"
replacement = "--skip sys::test_socket::test_af_alg_cipher\n    --skip sys::test_socket::test_af_alg_aead"
