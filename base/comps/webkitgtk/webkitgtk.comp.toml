# AZL does not ship libavif — disable avif support in WebKitGTK.
# No bcond exists; remove the BR and pass -DUSE_AVIF=OFF to cmake.
# WebKitGTK has two cmake builds (GTK4 + GTK3); the flag applies globally.

# gstreamer1-plugins-bad-free is not shipped in AZL.  WebKitGTK only
# soft-recommends it for optional codec support; removing the Recommends
# prevents package managers from trying to pull in a non-existent package.
# Remove the Fedora BuildRequires on pkgconfig(gstreamer-plugins-bad-1.0)
# and patch the shared GStreamer checks to require MPEG-TS only when
# USE_GSTREAMER_MPEGTS is enabled (OFF by default). Its unstable helper API
# is not needed for core rendering, video playback, WebAudio, or MSE.
# WebRTC remains disabled by the GTK port's upstream defaults.

[components.webkitgtk]
# Pin beyond the distro snapshot to Fedora 43's latest stable release (2.54.2).
# https://bodhi.fedoraproject.org/updates/FEDORA-2026-8222d28aa0
spec = { type = "upstream", upstream-commit = "bfb70d5db5c40dec0b1963dfcab28ba4e58e97ef" }
