[metadata]
category = "azl-pruning"
upstream-status = "needs-upstream-hook"

[[overlays]]
description = "Remove gstreamer-plugins-bad-1.0 BuildRequires (not shipped in AZL; the MPEG-TS dependency is patched to follow USE_GSTREAMER_MPEGTS, disabled by default)"
type = "spec-remove-tag"
tag = "BuildRequires"
value = "pkgconfig(gstreamer-plugins-bad-1.0)"

[[overlays]]
description = "Disable avif support in WebKitGTK cmake builds (libavif not available in AZL)"
type = "spec-search-replace"
section = "%build"
regex = "%cmake \\\\"
replacement = "%cmake \\\n  -DUSE_AVIF=OFF \\"
