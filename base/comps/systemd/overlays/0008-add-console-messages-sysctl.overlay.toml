# Azure Linux images boot with `console=ttyS0` on an emulated serial console,
# where every console write is slow. The kernel default console loglevel of 7
# sends ~630 kernel messages per boot to that console.
#
# Ship the same sysctl Azure Linux 3.0 provided (systemd-udev owned
# /usr/lib/sysctl.d/10-console-messages.conf) so that, once applied, only
# error-level and more severe messages reach the console. Full verbosity is
# still recorded in the journal and dmesg.
#
# This restores parity with 3.0; it does not measurably shorten boot. The
# sysctl applies only when systemd-sysctl runs, after the kernel has written
# most of its boot messages. The boot-time fix is `loglevel=4` on the kernel
# command line, which belongs in the image definition.

[metadata]
category = "azl-platform-adaptation"
upstream-status = "inapplicable"

[[overlays]]
description = "Add 10-console-messages.conf sysctl source (lowers kernel console loglevel)"
type = "file-add"
file = "10-console-messages.conf"
source = "../10-console-messages.conf"

[[overlays]]
description = "Register 10-console-messages.conf as a Source tag"
type = "spec-insert-tag"
tag = "Source27"
value = "10-console-messages.conf"

[[overlays]]
description = "Install 10-console-messages.conf into /usr/lib/sysctl.d"
type = "spec-search-replace"
regex = 'install -Dm0644 -t %\{buildroot\}%\{_prefix\}/lib/sysctl\.d/ %\{SOURCE17\}'
replacement = '''install -Dm0644 -t %{buildroot}%{_prefix}/lib/sysctl.d/ %{SOURCE17}

# Lower the default kernel console loglevel; Azure serial consoles are slow.
install -Dm0644 -t %{buildroot}%{_prefix}/lib/sysctl.d/ %{SOURCE27}'''
