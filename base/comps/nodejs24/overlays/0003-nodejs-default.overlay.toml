[metadata]
category = "azl-compatibility"
upstream-status = "needs-upstream-hook"

[[overlays]]
description = "Select the default stream and its binary package names using the nodejs22 mechanism"
type = "spec-prepend-lines"
lines = [
    '%{!?nodejs_default:%global nodejs_default 24}',
    '%if 0%{?nodejs_default}',
    '%global pkgname nodejs',
    '%define unversioned_obsoletes_of_nodejsXX_if_default() %{expand:\',
    'Obsoletes: nodejs%{node_version_major}%{?1:-%{1}} <= %{node_evr}\',
    'Provides: nodejs%{node_version_major}%{?1:-%{1}} = %{node_evr}\',
    '}',
    '%else',
    '%global pkgname nodejs24',
    '%define unversioned_obsoletes_of_nodejsXX_if_default() %{nil}',
    '%endif',
]

[[overlays]]
description = "Keep the nodejs24 source package while shipping nodejs as the default runtime"
type = "spec-search-replace"
regex = '^BuildRequires:\s+chrpath$'
replacement = '''
%if 0%{?nodejs_default}
%package -n %{pkgname}
Summary: JavaScript runtime
%endif
%unversioned_obsoletes_of_nodejsXX_if_default
BuildRequires: chrpath'''

[[overlays]]
description = "Resolve the runtime library dependency against the selected binary package name"
type = "spec-search-replace"
regex = '^Requires:\s+%\{name\}-libs%\{\?_isa\}\s+= %\{node_evr\}$'
replacement = 'Requires: %{pkgname}-libs%{?_isa} = %{node_evr}'

[[overlays]]
description = "Recommend documentation for the selected binary package name"
type = "spec-search-replace"
regex = '^Recommends:\s+%\{name\}-docs\s+= %\{node_evr\}$'
replacement = 'Recommends: %{pkgname}-docs = %{node_evr}'

[[overlays]]
description = "Recommend locale data for the selected binary package name"
type = "spec-search-replace"
regex = '^Recommends:\s+%\{name\}-full-i18n%\{\?_isa\}\s+= %\{node_evr\}$'
replacement = 'Recommends: %{pkgname}-full-i18n%{?_isa} = %{node_evr}'

[[overlays]]
description = "Recommend npm for the selected binary package name"
type = "spec-search-replace"
regex = '^Recommends:\s+%\{name\}-npm\s+>= %\{npm_evr\}$'
replacement = 'Recommends: %{pkgname}-npm >= %{npm_evr}'

[[overlays]]
description = "Resolve the V8 development dependency against the selected development package"
type = "spec-search-replace"
section = "%package"
package = "v8-%{v8_version_major}.%{v8_version_minor}-devel"
regex = '^Requires:\s+nodejs%\{node_version_major\}-devel%\{\?_isa\}\s+= %\{node_evr\}$'
replacement = 'Requires: %{pkgname}-devel%{?_isa} = %{node_evr}'

[[overlays]]
description = "Resolve the V8 library dependency against the selected library package"
type = "spec-search-replace"
section = "%package"
package = "v8-%{v8_version_major}.%{v8_version_minor}-devel"
regex = '^Requires:\s+nodejs%\{node_version_major\}-libs%\{\?_isa\}\s+= %\{node_evr\}$'
replacement = 'Requires: %{pkgname}-libs%{?_isa} = %{node_evr}'

[[overlays]]
description = "Replace retired V8 development headers alongside the Node.js runtime"
type = "spec-append-lines"
section = "%package"
package = "v8-%{v8_version_major}.%{v8_version_minor}-devel"
lines = ['Obsoletes: v8-12.4-devel < %{v8_evr}']

# Package section headers cannot be renamed by azldev overlays. Recreate only
# the sections that need the default-stream package name, retaining upstream content.
[[overlays]]
description = "Replace the development package sections with default-stream-aware sections"
type = "spec-remove-subpackage"
package = "devel"

[[overlays]]
description = "Replace the library package sections with default-stream-aware sections"
type = "spec-remove-subpackage"
package = "libs"

[[overlays]]
description = "Replace the locale package sections with default-stream-aware sections"
type = "spec-remove-subpackage"
package = "full-i18n"

[[overlays]]
description = "Replace the documentation package sections with default-stream-aware sections"
type = "spec-remove-subpackage"
package = "docs"

[[overlays]]
description = "Replace the npm package sections with default-stream-aware sections"
type = "spec-remove-subpackage"
package = "npm"

[[overlays]]
description = "Replace the runtime file manifest with one using the selected binary package name"
type = "spec-remove-section"
section = "%files"

[[overlays]]
description = "Port nodejs22 default-stream package naming and versioned aliases without changing upstream dependencies"
type = "spec-append-lines"
section = "%description"
lines = ['''
%if 0%{?nodejs_default}
%description -n %{pkgname}
Node.js is a platform built on Chrome's JavaScript runtime
for easily building fast, scalable network applications.
Node.js uses an event-driven, non-blocking I/O model that
makes it lightweight and efficient, perfect for data-intensive
real-time applications that run across distributed devices.
%endif

%package -n %{pkgname}-devel
Summary:        JavaScript runtime – development headers
Requires:       %{pkgname}%{?_isa} = %{node_evr}
Requires:       %{pkgname}-libs%{?_isa} = %{node_evr}
Requires:       nodejs-packaging
Requires:       openssl-devel%{?_isa}
%{!?with_bundled_brotli:Requires: brotli-devel%{?_isa}}
%{!?with_bundled_libuv:Requires: libuv-devel%{?_isa}}
%{!?with_bundled_zlib:Requires: zlib-devel%{?_isa}}
Provides:       nodejs-devel = %{node_evr}
Provides:       alternative-for(nodejs-devel) = %{node_evr}
Conflicts:      alternative-for(nodejs-devel)
Conflicts:      nodejs-devel-pkg
%unversioned_obsoletes_of_nodejsXX_if_default devel

%description -n %{pkgname}-devel
Development headers for the Node.js JavaScript runtime.

%package -n %{pkgname}-libs
Summary:        Node.js and v8 libraries
Provides:       v8 = %{v8_evr}
Provides:       v8%{?_isa} = %{v8_evr}
Obsoletes:      v8 < 1:6.7.17-10
Provides:       libv8.so.%{v8_version_major}%{?_so_arch_suffix} = %{v8_epoch}:%{v8_version}
Provides:       libv8_libbase.so.%{v8_version_major}%{?_so_arch_suffix} = %{v8_epoch}:%{v8_version}
Provides:       libv8_libplatform.so.%{v8_version_major}%{?_so_arch_suffix} = %{v8_epoch}:%{v8_version}
%unversioned_obsoletes_of_nodejsXX_if_default libs

%description -n %{pkgname}-libs
Libraries to support Node.js and provide stable v8 interfaces.

%package -n %{pkgname}-full-i18n
Summary:        Non-English locale data for Node.js
Requires:       %{pkgname}%{?_isa} = %{node_evr}
%unversioned_obsoletes_of_nodejsXX_if_default full-i18n

%description -n %{pkgname}-full-i18n
Optional data files to provide full ICU support for Node.js.
Remove this package to save space if non-English locales are not needed.

%package -n %{pkgname}-docs
Summary:        Node.js API documentation
BuildArch:      noarch
Requires(meta): %{pkgname} = %{node_evr}
%unversioned_obsoletes_of_nodejsXX_if_default docs

%description -n %{pkgname}-docs
The API documentation for the Node.js JavaScript runtime.

%package -n %{pkgname}-npm
Summary:        Node.js Package Manager
Epoch:          %{npm_epoch}
Version:        %{npm_version}
Release:        %{npm_release}
BuildArch:      noarch
Requires:       %{pkgname} = %{node_evr}
Recommends:     %{pkgname}-docs = %{node_evr}
Provides:       npm(npm) = %{npm_version}
%if 0%{?nodejs_default}
Provides:       npm = %{npm_evr}
Obsoletes:      npm < 1:9
Obsoletes:      nodejs%{node_version_major}-npm <= %{npm_evr}
Provides:       nodejs%{node_version_major}-npm = %{npm_evr}
%endif

%description -n %{pkgname}-npm
npm is a package manager for node.js. You can use it to install and publish
your node programs. It manages dependencies and does other cool stuff.
''']

[[overlays]]
description = "Restore default commands, manual pages, and system npm configuration only for the default stream"
type = "spec-append-lines"
section = "%install"
lines = ['''
%if 0%{?nodejs_default}
for bin in node npm npx; do
    ln -srf "%{buildroot}%{_bindir}/${bin}-%{node_version_major}" "%{buildroot}%{_bindir}/${bin}"
done
for section in 1 5 7; do
    mkdir -p "%{buildroot}%{_mandir}/man${section}"
    for manpage in "${VERSIONED_MANDIR}/man${section}/"*; do
        ln -srf "${manpage}" "%{buildroot}%{_mandir}/man${section}/"
    done
done
mkdir -p "%{buildroot}%{nodejs_common_sitelib}" "%{buildroot}%{_sysconfdir}"
mkconfig <%{SOURCE5} >"%{buildroot}%{_sysconfdir}/npmrc"
%endif
''']

[[overlays]]
description = "Keep upstream file ownership while assigning default commands and npm configuration to their unversioned packages"
type = "spec-append-lines"
section = "%files"
package = "v8-%{v8_version_major}.%{v8_version_minor}-devel"
lines = ['''
%files -n %{pkgname}
%doc        README.md CHANGELOG.md GOVERNANCE.md onboarding.md
%license    LICENSE
%dir        %{nodejs_datadir}/
%dir        %{nodejs_datadir}/man/
%dir        %{nodejs_datadir}/man/man1/
%dir        %{nodejs_private_sitelib}/
%{_bindir}/node-%{node_version_major}
%{nodejs_datadir}/man/man1/node.1*
%{_mandir}/man1/node-%{node_version_major}.1*
%if 0%{?nodejs_default}
%dir        %{nodejs_common_sitelib}/
%{_bindir}/node
%{_mandir}/man1/node.1*
%endif

%files -n %{pkgname}-libs
%license    LICENSE
%{_libdir}/libnode.so.%{node_soversion}
%{_libdir}/libv8.so.%{v8_version_major}.%{v8_version_minor}
%{_libdir}/libv8_libbase.so.%{v8_version_major}.%{v8_version_minor}
%{_libdir}/libv8_libplatform.so.%{v8_version_major}.%{v8_version_minor}

%files -n %{pkgname}-devel
%license    LICENSE
%dir        %{nodejs_datadir}/
%{_includedir}/node/
%{_libdir}/libnode.so
%{_libdir}/pkgconfig/nodejs-%{node_version_major}.pc
%{_pkgdocdir}/gdbinit
%{_pkgdocdir}/lldb_commands.py
%{_rpmconfigdir}/fileattrs/nodejs%{node_version_major}_abi.attr
%{_rpmconfigdir}/nodejs%{node_version_major}_abi.req
%{nodejs_datadir}/common.gypi

%files -n %{pkgname}-full-i18n
%doc        full-icu/icu4c-%{icu_version_major}.%{icu_version_minor}-data-bin-?-README.md
%license    full-icu/LICENSE
%dir        %{nodejs_datadir}/
%{nodejs_datadir}/icudata/

%files -n %{pkgname}-npm
%doc        deps/npm/README.md
%license    deps/npm/LICENSE
%dir        %{nodejs_datadir}/
%dir        %{nodejs_private_sitelib}/
%{_bindir}/npm-%{node_version_major}
%{_bindir}/npx-%{node_version_major}
%if 0%{?nodejs_default}
%{_bindir}/npm
%{_bindir}/npx
%{_mandir}/man[157]/*
%exclude    %{_mandir}/man1/node*.1*
%config(noreplace) %{_sysconfdir}/npmrc
%ghost      %{_sysconfdir}/npmignore
%else
%{_mandir}/man1/npm-%{node_version_major}.1*
%{_mandir}/man1/npx-%{node_version_major}.1*
%endif
%{nodejs_datadir}/man
%{nodejs_private_sitelib}/npm/
%exclude    %{nodejs_datadir}/man/man1/node*.1*

%files -n %{pkgname}-docs
%doc        doc/README.md
%license    LICENSE
%dir        %{_pkgdocdir}
%{_pkgdocdir}/html/
%{_pkgdocdir}/npm/
''']
