[components.containerd]
# Pin Fedora 44's last 2.3 release and preserve its upstream packaging.
# https://src.fedoraproject.org/rpms/containerd/c/91251c9edc1f8e49c11f9a4ccb872502a933afb7
spec = { type = "upstream", upstream-distro = { name = "fedora", version = "44" }, upstream-commit = "91251c9edc1f8e49c11f9a4ccb872502a933afb7" }

[components.containerd.go-vendor]
# Regenerate bundled dependencies from the prepared sources instead of reusing
# Fedora's vendor payload. Keep upstream's reviewed go-vendor-tools settings.
enabled = true
