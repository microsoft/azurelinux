# Fedora does not package libass 0.17.5 on f43/f44 yet. Update to the upstream
# release for these CVE fixes:
# CVE-2026-61627
# Remove this overlay once the imported Fedora spec packages 0.17.5 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 0.17.5"
type = "spec-update-tag"
tag = "Version"
value = "0.17.5"

[[overlays]]
description = "Remove the obsolete libass-0.17.3.tar.xz source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(libass-0\.17\.3\.tar\.xz\) = [0-9a-f]+(?:\r?\n|$)'
