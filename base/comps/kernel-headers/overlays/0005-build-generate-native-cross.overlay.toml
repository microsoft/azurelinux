# Build: generate native + cross headers from Azure Linux kernel source.
# Uses make headers_install which produces properly sanitized userspace headers.
# Detects native arch and cross-compiles for the other (x86_64 <-> arm64).
#
# Category azl-platform-adaptation: this is genuinely architecture-specific --
# it detects the native kernel arch and cross-generates headers for the other
# (x86_64 <-> arm64), installing cross headers under an arch-specific includedir.
# upstream-status inapplicable: permanent AZL-only build logic replacing Fedora's
# pre-built-headers install path; not upstreamable.

[[overlays]]
description = "Generate native and cross-arch userspace headers via make headers_install from the AZL kernel source"
type = "spec-append-lines"
section = "%build"
lines = ["make mrproper\nmake headers_install INSTALL_HDR_PATH=headers-native\n\n# Determine native kernel arch and cross-compile for the other\nnative_karch=$(uname -m | sed 's/x86_64/x86/;s/aarch64/arm64/')\nfor cross_arch in arm64 x86; do\n    [ \"$cross_arch\" = \"$native_karch\" ] && continue\n    make ARCH=$cross_arch headers_install INSTALL_HDR_PATH=headers-$cross_arch\ndone"]

# Install: copy headers_install output into RPM buildroot, replacing Fedora's copy logic.
# The exit 0 at the end short-circuits the original Fedora install logic.
[[overlays]]
description = "Install the generated native and cross-arch headers into the buildroot, replacing Fedora's copy logic"
type = "spec-prepend-lines"
section = "%install"
lines = ["native_karch=$(uname -m | sed 's/x86_64/x86/;s/aarch64/arm64/')\n\nmkdir -p $RPM_BUILD_ROOT%{_includedir}\ncp -rv headers-native/include/* $RPM_BUILD_ROOT%{_includedir}\n\nfor cross_arch in arm64 x86; do\n    [ \"$cross_arch\" = \"$native_karch\" ] && continue\n    cross_arch_includedir=$RPM_BUILD_ROOT%{_prefix}/${cross_arch}-linux-gnu/include\n    mkdir -p $cross_arch_includedir\n    cp -rv headers-$cross_arch/include/* $cross_arch_includedir\ndone\n\nexit 0"]
