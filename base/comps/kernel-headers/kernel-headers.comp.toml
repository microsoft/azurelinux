[components.kernel-headers]
# Kernel-headers using Fedora spec with overlays for Azure Linux 6.18.
# Fedora's spec expects a pre-built headers tarball. These overlays adapt it to
# use Azure Linux kernel source and generate headers during build.
spec = { type = "upstream" }

# The spec uses Release: %{specrelease}, which the auto-calculator cannot parse.
# Overlay 0002 defines %azl_pkgrelease in the spec and rewrites specrelease to
# %{kextraversion}.%{azl_pkgrelease}%{?dist}, so the counter targets that spec
# macro: the define in the overlay stays the base value and the rendered counter
# is that base plus the synthetic commit count.
release = { calculation = "static", counter = { source = "spec-macro", directive = "define", name = "azl_pkgrelease" } }

# Version updates: Fedora -> Azure Linux 6.18.31.1
# Uses 3-part version (6.18.31) + kextraversion (1) scheme matching kernel.
[components.kernel-headers.build.defines]
# 4th version component from the AZL kernel source (6.18.31.1).
kextraversion = "1"

