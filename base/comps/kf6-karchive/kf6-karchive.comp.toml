# The upstream KDE `karchive-6.23.0.tar.xz` ships several autotest fixtures
# that trip anti-malware scanning on the AZL RPM-signing pipeline, which
# rejects encrypted / unscannable payloads inside SRPMs:
#
#   - autotests/data/password_protected.7z
#       Deliberately password-protected 7-Zip archive.
#   - autotests/data/zip64_extra_zip64_size_first.zip.gz
#       Gzipped ZIP64 edge-case fixture; the scanner decompresses the .gz
#       wrapper and the inner .zip trips its detector.
#
# karchive's autotests are not built or run in our spec (no %check, and
# upstream's CMake gates them on BUILD_TESTING=ON, which we don't set), so
# stripping these test fixtures is functionally inert.
#
# Archive overlays strip these scanner-flagged fixtures from upstream Source0
# during source preparation, avoiding a separate modified-source tarball.
[components.kf6-karchive]

[[components.kf6-karchive.overlays]]
type = "file-remove"
file = "autotests/data/password_protected.7z"
archive = "karchive-6.23.0.tar.xz"
description = "Remove password-protected 7-Zip test fixture flagged by AZL signing-pipeline AV scanner"

[[components.kf6-karchive.overlays]]
type = "file-remove"
file = "autotests/data/zip64_extra_zip64_size_first.zip.gz"
archive = "karchive-6.23.0.tar.xz"
description = "Remove ZIP64 edge-case test fixture flagged by AZL signing-pipeline AV scanner"

[[components.kf6-karchive.source-files]]
filename = "karchive-6.23.0.tar.xz"
hash = "a880069c33572d8c0f86bd535ce591eb8bb66a416ec992f7f8964935dd480bfa1c9a15f7ebf16bc7d0dde7afdeb2f68a5ea739ce820887cc855ad731c3c7df3f"
hash-type = "SHA512"
origin = { type = "overlay" }
replace-upstream = true
replace-reason = "Upstream autotest fixtures trigger signing-pipeline scanning and are not built or run; archive overlays remove them before SRPM creation."
