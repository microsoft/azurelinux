# Fedora does not package patch 2.8.1 on f43/f44 yet. Update to the upstream
# release for these CVE fixes:
# CVE-2026-115207, CVE-2026-56288, CVE-2026-56289
# Remove this overlay once the imported Fedora spec packages 2.8.1 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 2.8.1"
type = "spec-update-tag"
tag = "Version"
value = "2.8.1"

[[overlays]]
description = "Remove the obsolete patch-2.8.tar.xz source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(patch-2\.8\.tar\.xz\) = [0-9a-f]+(?:\r?\n|$)'
