[metadata]
category = "azl-compatibility"
upstream-status = "inapplicable"

[[overlays]]
description = "Bind XMvn 5's OpenJDK 25 toolchain to Microsoft OpenJDK"
type = "spec-search-replace"
section = "%install"
regex = '^%jp_binding --verbose --base-pkg %\{name\}-minimal --binding-pkg %\{name\}-toolchain-openjdk25 --variant openjdk25 --ghost %\{name\}-toolchains\.xml --target %\{_datadir\}/%\{name\}/conf/toolchains-openjdk25\.xml --requires java-25-openjdk-devel$'
replacement = "%jp_binding --verbose --base-pkg %{name}-minimal --binding-pkg %{name}-toolchain-openjdk25 --variant openjdk25 --ghost %{name}-toolchains.xml --target %{_datadir}/%{name}/conf/toolchains-openjdk25.xml --requires msopenjdk-25"