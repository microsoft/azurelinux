[components.'rust-hmac0.12']
# Version-suffixed compat package providing the OLDER hmac 0.12.1, pinned at
# the commit the default rust-hmac previously resolved to (via the distro
# snapshot), to serve its existing dynamically-generated consumers (rust-hkdf,
# rust-pbkdf2 default, rust-cookie, rust-rfc6979, rust-async-session,
# rust-libsystemd, rust-reqsign-core) which require hmac < 0.13.0. The
# default rust-hmac is now pinned to Fedora f43 HEAD (0.13.0) to satisfy
# uv's crate-alignment cascade. Distinct from the pre-existing
# rust-hmac0.11 compat package, which serves an even older hmac 0.11 range.
spec = { type = "upstream", upstream-distro = { name = "fedora", version = "43" }, upstream-name = "rust-hmac", upstream-commit = "e1dbb2c54c7d0f39dbcf6aae5eced17b4851dff8" }

[[components.'rust-hmac0.12'.overlays]]
description = "Rename package to rust-hmac0.12 so it can coexist with the newer default rust-hmac"
type = "spec-set-tag"
tag = "Name"
value = "rust-hmac0.12"
