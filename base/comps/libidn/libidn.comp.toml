[components.libidn]

[[components.libidn.overlays]]
description = "Use the OpenJDK 25 javapackages-local provider"
type = "spec-search-replace"
section = "%package"
package = "java"
regex = '^BuildRequires:\s+javapackages-local$'
replacement = "BuildRequires: javapackages-local-openjdk25"

