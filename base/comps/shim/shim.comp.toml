[components.shim]
spec = { type = "upstream", upstream-distro = { name = "fedora", version = "43" }, upstream-commit = "7b08c421ed4dbca88af0cbaabb73332d08944c86" }

overlays = [
  # TEMPORARILY force dist tag to be present in release to avoid NEVR conflicts
  { type = "spec-search-replace", regex = '%global dist.*', replacement = "" },

  # TEMPORARILY remove release from the dependency on the shim unsigned packages
  { type = "spec-search-replace", regex = '^BuildRequires:.*unsignedx64.*$', replacement = "BuildRequires: %{unsignedx64} = 15.8" },
  { type = "spec-search-replace", regex = '^BuildRequires:.*unsignedia32.*$', replacement = "BuildRequires: %{unsignedia32} = 15.8" },
  { type = "spec-search-replace", regex = '^BuildRequires:.*unsignedaa64.*$', replacement = "BuildRequires: %{unsignedaa64} = 15.8" },

  # TEMPORARILY use the unsigned shim binaries from our shim-unsigned-ARCH packages
  { type = "spec-append-lines", section = "%prep", lines = [
    "test -e %{shimdirx64}/$(basename %{shimefix64}) && cp -vf %{shimdirx64}/$(basename %{shimefix64}) %{shimefix64} ||:",
    "test -e %{shimdiria32}/$(basename %{shimefiia32}) && cp -vf %{shimdiria32}/$(basename %{shimefiia32}) %{shimefiia32} ||:",
    "test -e %{shimdiraa64}/$(basename %{shimefiaa64}) && cp -vf %{shimdiraa64}/$(basename %{shimefiaa64}) %{shimefiaa64} ||:",
  ] },

  # Set the firmware boot-entry label to "AzureLinux".
  # The BOOT*.CSV files (UTF-16LE) are consumed by fallback.efi to register
  # a UEFI boot entry; the second field is the label shown in `efibootmgr -v`
  # and most firmware boot menus. Rewriting the installed copy in %install
  # avoids carrying binary CSV blobs in the comp directory and keeps the
  # upstream Fedora sources untouched.
  #
  # Anchor on the `find ... brp_mangle` line because it sits inside the real
  # %install body but before the `%define_files` macros (which expand to
  # %files sections). spec-append-lines for %install would land *after*
  # those expansions, putting our shell loop inside %files.
  { description = "Set BOOT*.CSV boot-entry label to 'AzureLinux' so the firmware menu matches the distro", type = "spec-search-replace", section = "%install", regex = '^\( cd \$RPM_BUILD_ROOT ; find \.%\{efi_esp_root\} -type f \) \\$', replacement = '''# Rewrite installed BOOT*.CSV (UTF-16LE) to label the boot entry as AzureLinux.
for csv in $RPM_BUILD_ROOT%{efi_esp_dir}/BOOT*.CSV; do
  [ -f "$csv" ] || continue
  shim_name=$(basename "$csv" .CSV | sed -e 's/^BOOT/shim/' | tr '[:upper:]' '[:lower:]')
  printf '\xff\xfe' > "$csv"
  printf '%s.efi,AzureLinux,,This is the boot entry for AzureLinux\n' "$shim_name" | iconv -f UTF-8 -t UTF-16LE >> "$csv"
done

( cd $RPM_BUILD_ROOT ; find .%{efi_esp_root} -type f ) \''' },
]
