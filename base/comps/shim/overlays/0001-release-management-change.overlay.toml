# TEMPORARILY force dist tag to be present in release to avoid NEVR conflicts

[metadata]
category = "azl-temp-workaround"
upstream-status = "inapplicable"

[[overlays]]
description = "Remove the spec's %global dist override so the dist tag stays in Release (avoids NEVR conflicts)"
type = "spec-search-replace"
regex = "%global dist.*"
replacement = ""

# Drop the upstream release-qualified dependency; Azure Linux release numbers differ.
[[overlays]]
description = "Require the x64 unsigned-shim 16.1 package without constraining its Azure Linux release"
type = "spec-search-replace"
regex = "^BuildRequires:.*unsignedx64.*$"
replacement = "BuildRequires: %{unsignedx64} = 16.1"

[[overlays]]
description = "Require the aarch64 unsigned-shim 16.1 package without constraining its Azure Linux release"
type = "spec-search-replace"
regex = "^BuildRequires:.*unsignedaa64.*$"
replacement = "BuildRequires: %{unsignedaa64} = 16.1"
