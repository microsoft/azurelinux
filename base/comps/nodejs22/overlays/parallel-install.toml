[metadata]
category = "upstream-backport"
upstream-status = "upstreamed"
commits = [
    { url = "https://src.fedoraproject.org/rpms/nodejs22/c/667ac09e1cebfb11d617f4728d3186ef90d0d686" },
    { url = "https://src.fedoraproject.org/rpms/nodejs24/c/f7f29396d8a65b4ba4d9cdfeced87dcc1828bc9b" },
]

[[overlays]]
description = "Use versioned RPM names even for the formerly default Node.js stream"
type = "spec-search-replace"
regex = '^%global nodejs_default %\{nodejs_pkg_major\}$'
replacement = '%global nodejs_default 0'

[[overlays]]
description = "Reverse the old default-stream aliases so versioned packages replace unversioned RPMs"
type = "spec-search-replace"
regex = '^%define unversioned_obsoletes_of_nodejsXX_if_default\(\) %\{nil\}$'
replacement = '''%define unversioned_obsoletes_of_nodejsXX_if_default() %{expand:\
Obsoletes: nodejs%{?1:-%{1}} < 1:22.22.0-4%{?dist}\
Provides: nodejs%{?1:-%{1}} = %{nodejs_envr}\
}'''

[[overlays]]
description = "Guarantee an unversioned node command while preferring this stream's bin package"
type = "spec-search-replace"
regex = '^Requires: ca-certificates$'
replacement = '''Requires: ca-certificates
Requires: %{_bindir}/node
Recommends: %{pkgname}-bin = %{nodejs_envr}'''

[[overlays]]
description = "Preserve npm upgrades and guarantee its unversioned command through an npm-bin package"
type = "spec-append-lines"
section = "%package"
package = "%{pkgname}-npm"
lines = ['''Requires: %{_bindir}/npm
Recommends: %{pkgname}-npm-bin = %{npm_envr}
Obsoletes: nodejs-npm < 1:10.9.4-1.22.22.0.4%{?dist}
Provides: nodejs-npm = %{npm_envr}
Provides: npm = %{npm_envr}''']

[[overlays]]
description = "Split default node and npm commands into Fedora's mutually exclusive stream selectors"
type = "spec-append-lines"
section = "%description"
package = "%{pkgname}-docs"
lines = ['''%package bin
Summary: Node.js JavaScript runtime - unversioned symlinks
BuildArch: noarch
Requires: %{name} = %{nodejs_envr}
Provides: alternative-for(nodejs-bin) = %{nodejs_envr}
Conflicts: alternative-for(nodejs-bin)

%description bin
Binary symlinks for Node.js JavaScript runtime.

%package npm-bin
Summary: Node.js Package Manager - binary symlinks
Epoch: %{npm_epoch}
Version: %{npm_version}
Release: %{npm_release}
BuildArch: noarch
Requires: %{name}-npm = %{npm_envr}
Requires(meta): %{name}-bin = %{nodejs_envr}
Provides: alternative-for(nodejs-npm-bin) = %{npm_envr}
Conflicts: alternative-for(nodejs-npm-bin)

%description npm-bin
Binary symlinks for Node.js Package Manager.
''']

[[overlays]]
description = "Build the unversioned command and manual symlinks independently of default-stream packaging"
type = "spec-append-lines"
section = "%install"
lines = ['''
pushd '%{buildroot}%{_bindir}'
for binname in node npm npx; do
    ln -srfL "${binname}-%{nodejs_pkg_major}" "${binname}"
done
popd

readonly VERSIONED_MANDIR="%{buildroot}%{_mandir}/nodejs-%{nodejs_pkg_major}"
find "${VERSIONED_MANDIR}" -type d -name 'man[123456789]' -printf "%{buildroot}%{_mandir}/%%P\0" | xargs -0 mkdir -p
find "${VERSIONED_MANDIR}" -type f -name '*.[123456789]*' -printf '%%P\n' | while read -r man_stem; do
    ln -srfL "${VERSIONED_MANDIR}/${man_stem}" "%{buildroot}%{_mandir}/${man_stem}"
done
''']

[[overlays]]
description = "Keep the common module directory available after retiring default-stream ownership"
type = "spec-prepend-lines"
section = "%files"
package = "%{pkgname}"
lines = ['%dir %{nodejs_default_sitelib}']

[[overlays]]
description = "Assign the unversioned commands and manuals exclusively to their selector RPMs"
type = "spec-append-lines"
section = "%files"
package = "%{pkgname}-docs"
lines = ['''%files bin
%license LICENSE
%{_bindir}/node
%{_mandir}/man1/node.1*

%files npm-bin
%license deps/npm/LICENSE
%{_bindir}/npm
%{_bindir}/npx
%{_mandir}/man*/*
%exclude %{_mandir}/man1/node.1*
''']
