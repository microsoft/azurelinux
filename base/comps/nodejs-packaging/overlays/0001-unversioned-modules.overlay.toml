[metadata]
category = "azl-branding-policy"
upstream-status = "needs-upstream-hook"

[[overlays]]
description = "Build modules in the default Node.js module directory instead of a parallel stream"
type = "file-search-replace"
file = "macros.nodejs"
regex = '(?m)^%nodejs_sitelib .*'
replacement = '%nodejs_sitelib %{_prefix}/lib/node_modules'
