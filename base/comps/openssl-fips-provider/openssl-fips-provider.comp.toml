# ── Pre-existing build fix ─────────────────────────────────────────────────────
# Patch0037's fips_config.pod hunk was written for older OpenSSL; the file was
# completely rewritten in 3.5.4. Replace with a version that drops the broken
# hunk (same fix as the openssl component).
#
# LOAD-BEARING — DO NOT DROP on rebase. Patch 0037 modifies
# providers/fips/include/fips_indicator_params.inc, which compiles into fips.so.
# It sets the compiled-in default for tls1-prf-ems-check (and other indicators)
# to 1. Without it, the FIPS provider silently loses EMS enforcement even if
# fipsmodule.cnf and crypto-policies are configured correctly.
[[components.openssl-fips-provider.overlays]]
type = "file-remove"
file = "0037-FIPS-TLS-Enforce-EMS-in-TLS-1.2-NOTE.patch"
description = "Remove original Patch0037 (fips_config.pod hunk incompatible with 3.5.4)"

[[components.openssl-fips-provider.overlays]]
type = "file-add"
file = "0037-FIPS-TLS-Enforce-EMS-in-TLS-1.2-NOTE.patch"
source = "0037-FIPS-TLS-Enforce-EMS-in-TLS-1.2-NOTE.patch"
description = "Add fixed Patch0037 without broken fips_config.pod hunk"

