# ── %check — test suite adjustments ───────────────────────────────────────────
# - Remove -pedantic from the FIPS prep test (incompatible with our build flags).
# - Exclude test suites that legitimately fail under our hardened FIPS config:
#
#   -test_ssl_new / -test_sslapi:
#     SSL integration tests that require the full openssl build (engines,
#     default provider, etc.) which aren't available in the fips-provider build.
#
#   -test_fipsinstall:
#     Tests 21, 27 expect fipsinstall to fail when KAT results are corrupted
#     for DSA and RSA_Encrypt asymmetric cipher. Our patches remove these KATs
#     from the FIPS provider, so corrupting a non-existent KAT is a no-op and
#     fipsinstall correctly passes — but the test expects failure.
#
#   -test_evp:
#     Tests 73, 82 fail because our hardened fipsinstall flags
#     (-ems_check, -no_short_mac, -rsa_pkcs15_padding_disabled,
#     -rsa_sign_x931_disabled) restrict operations that the vanilla test data
#     files assume are FIPS-approved. Specifically:
#       - evpkdf_tls12_prf.txt: TLS1.2 PRF rejected by EMS enforcement
#       - evppkey_rsa_common.txt: RSA ops rejected by PKCS#1 v1.5 / X9.31
#         padding restrictions
#
#   -test_acvp:
#     RSA X9.31 signature verify with SHA1 fails because our
#     rsa_sign_x931_disabled indicator rejects the digest.
#
#   -test_pairwise_fail:
#     EC/DSA pairwise failure tests can't load DSA parameters because our
#     patches (0043) disable DSA support in the FIPS provider.
#
#   -test_ec:
#     Test 16 (non-FIPS curve key with ?fips!=yes query) requires the default
#     provider to decode non-FIPS key types, unavailable in this build.
#
#   -test_cmp_protect / -test_cmp_vfy:
#     CMP cert chain tests use Ed25519 keys which aren't available in the
#     FIPS provider (EdDSA is not FIPS-approved).
#
# TODO: Investigate running these with modified test data that matches our
# FIPS policy, rather than excluding the entire test files.
[[components.openssl-fips-provider.overlays]]
type = "spec-search-replace"
description = "Remove -pedantic from FIPS test prep and exclude incompatible test suites"
regex = 'make test HARNESS_JOBS=8$'
replacement = "sed -i \"s/'-pedantic',//\" test/recipes/00-prep_fipsmodule_cnf.t\nmake test HARNESS_JOBS=8 TESTS='-test_ssl_new -test_sslapi -test_fipsinstall -test_evp -test_acvp -test_pairwise_fail -test_ec -test_cmp_protect -test_cmp_vfy'"

# ── __spec_install_post — fipsinstall AFTER strip ─────────────────────────────
# Replace the entire __spec_install_post block. Instead of deleting fips.so
# (RHEL path) or running hmacify (Fedora path), we run fipsinstall after
# debuginfo stripping to compute the correct HMAC of the stripped binary.
# The __spec_install_post: Since the RHEL guard is NOT extended to AZL4,
# AZL4 builds take the %else (Fedora) branch which runs hmacify.
# Replace hmacify with fipsinstall — runs AFTER debuginfo stripping.
[[components.openssl-fips-provider.overlays]]
type = "spec-search-replace"
description = "Replace hmacify with fipsinstall in __spec_install_post"
regex = '    %\{SOURCE1\} \$RPM_BUILD_ROOT/%\{_libdir\}/ossl-modules/fips\.so \\'
replacement = "    install -d $RPM_BUILD_ROOT/%{_sysconfdir}/pki/tls && LD_LIBRARY_PATH=%{_builddir}/openssl-%{version} %{_builddir}/openssl-%{version}/apps/openssl fipsinstall -ems_check -no_short_mac -rsa_pkcs15_padding_disabled -rsa_sign_x931_disabled -module $RPM_BUILD_ROOT/%{_libdir}/ossl-modules/fips.so -out $RPM_BUILD_ROOT/%{_sysconfdir}/pki/tls/fipsmodule.cnf && sed -i '/^activate = 1$/d' $RPM_BUILD_ROOT/%{_sysconfdir}/pki/tls/fipsmodule.cnf \\"

# ── %install — replace entirely with minimal fips-only install ─────────────────
# OpenSSL's install_fips target installs only fips.so + fipsmodule.cnf.
# We remove the entire inherited %install (full openssl install + cleanup)
# and replace it with a minimal version.
[[components.openssl-fips-provider.overlays]]
type = "spec-remove-section"
section = "%install"
description = "Remove full openssl %install section"

[[components.openssl-fips-provider.overlays]]
type = "spec-append-lines"
section = "%check"
lines = [
    "",
    "%install",
    "make install_fips DESTDIR=$RPM_BUILD_ROOT",
    "# Remove fipsmodule.cnf from install_fips — __spec_install_post regenerates",
    "# it after debuginfo stripping with correct HMAC of the stripped binary.",
    "rm -f $RPM_BUILD_ROOT%{_sysconfdir}/pki/tls/fipsmodule.cnf",
    "",
    "install -d $RPM_BUILD_ROOT%{_sysconfdir}/pki/tls/openssl.d",
    "install -m644 %{SOURCE9999} $RPM_BUILD_ROOT%{_sysconfdir}/pki/tls/openssl.d/openssl-fips-provider.cnf",
]
description = "Add minimal %install for fips-provider"

