[components.'rust-sha2_0.10']
# Version-suffixed compat package providing the OLDER sha2 0.10.x, serving
# its ~30 existing dynamically-generated consumers (rust-secret-service,
# rust-rsa, rust-dsa, rust-ecdsa, rust-uucore, etc.) which require
# sha2 < 0.11.0. The default rust-sha2 is now pinned to Fedora f43 HEAD
# (0.11.0) to satisfy uv's crate-alignment cascade. This is Fedora's own
# rust-sha2_0.10 dist-git package (real upstream import, no rename), not a
# hand-rolled rename -- same convention as the pre-existing rust-nix0.30
# compat package. Pinned to its current f43 HEAD (rather than left bare)
# because this Fedora repo was created after AZL's buildroot snapshot date,
# so the distro-default rolling snapshot can't resolve it.
spec = { type = "upstream", upstream-distro = { name = "fedora", version = "43" }, upstream-commit = "4b22e78ba80a86f4564295265dc3b9057c99a089" }
