# AZL does not ship opus. Opus is a hard meson dependency when RDP is
# enabled, so disable the RDP backend via build.without and remove
# RDP-only file entries so %files doesn't list missing files.

# Drop pkgconfig(ffnvcodec) BuildRequires — nv-codec-headers is not
# shipped in AZL and is only needed for the (disabled) RDP backend's
# NVENC hardware-encode path.

[[overlays]]
description = "Drop unconditional pkgconfig(ffnvcodec) BR; nv-codec-headers is not in AZL and is only used by the disabled RDP backend"
type = "spec-remove-tag"
tag = "BuildRequires"
value = "pkgconfig(ffnvcodec)"
