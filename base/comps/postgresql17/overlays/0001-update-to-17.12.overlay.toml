# Fedora does not package PostgreSQL 17.12 on f43/f44 yet (both are on 17.11). Update to
# the upstream 17.12 release, and the bundled previous-major server used by the
# -upgrade subpackage from 16.15 to 16.16, for the CVE fixes in the
# PostgreSQL 17.12 release. Remove this overlay once the imported Fedora spec
# packages 17.12 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 17.12"
type = "spec-update-tag"
tag = "Version"
value = "%{majorversion}.12"

[[overlays]]
description = "Update the bundled previous-major release to 16.16"
type = "spec-search-replace"
regex = '^%global prevversion %\{prevmajorversion\}\.15$'
replacement = "%global prevversion %{prevmajorversion}.16"

[[overlays]]
description = "Remove the obsolete postgresql-17.11.tar.bz2 source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(postgresql-17\.11\.tar\.bz2\) = [0-9a-f]+(?:\r?\n|$)'

[[overlays]]
description = "Remove the obsolete postgresql-16.15.tar.bz2 source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(postgresql-16\.15\.tar\.bz2\) = [0-9a-f]+(?:\r?\n|$)'

[[overlays]]
description = "Remove the obsolete postgresql-17.11.tar.bz2.sha256 source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(postgresql-17\.11\.tar\.bz2\.sha256\) = [0-9a-f]+(?:\r?\n|$)'

[[overlays]]
description = "Remove the obsolete postgresql-16.15.tar.bz2.sha256 source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(postgresql-16\.15\.tar\.bz2\.sha256\) = [0-9a-f]+(?:\r?\n|$)'
