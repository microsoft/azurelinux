# Remove this overlay once the imported Fedora spec packages 16.16 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 16.16"
type = "spec-update-tag"
tag = "Version"
value = "%majorversion.16"

[[overlays]]
description = "Remove the obsolete postgresql-16.4.tar.bz2 source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(postgresql-16\.4\.tar\.bz2\) = [0-9a-f]+(?:\r?\n|$)'

[[overlays]]
description = "Remove the obsolete postgresql-16.4.tar.bz2.sha256 source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(postgresql-16\.4\.tar\.bz2\.sha256\) = [0-9a-f]+(?:\r?\n|$)'
