# Put UKIs on the ESP. KIWI builds the image with the ESP unmounted, so
# kernel-install would otherwise fall back to /boot/EFI/Linux.
#
# No layout is set, since kernel-install picks the "uki" layout for UKIs.
# Only UKIs (Type #2 entries) are supported, so there's no
# loader/entries.srel, and other kernel images get no boot entry. See
# https://uapi-group.org/specifications/specs/boot_loader_specification/
BOOT_ROOT=/boot/efi
