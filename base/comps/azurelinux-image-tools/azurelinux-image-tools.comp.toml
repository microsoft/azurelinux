# Azure Linux Image Tools — provides imagecustomizer and osmodifier tools. Forward
# ported from the azurelinux-image-tools spec on the 3.0 branch. `imagecustomizer`
# uprevs from 1.5.0 to 1.7.0. This is maintained as a local spec with a manually
# generated vendor tarball.
[components.azurelinux-image-tools]
spec = { type = "local", path = "azurelinux-image-tools.spec" }
# Local package authored and maintained by AZL: use rpmautospec (%autorelease / %autochangelog).

