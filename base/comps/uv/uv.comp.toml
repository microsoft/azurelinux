# Pin to Fedora f43 uv-0.12.24-1, the version Fedora ships with
# rust-astral_async_http_range_reader 0.12.0; uv 0.12.19 needs 0.11.
# https://src.fedoraproject.org/rpms/uv/c/f174be201fff3ae5543dc62526e570154b933dea
[components.uv]
spec = { type = "upstream", upstream-commit = "f174be201fff3ae5543dc62526e570154b933dea" }

[components.uv.build]
# Python 3.15 and 3.15t are not packaged in Azure Linux. Use Fedora's supported
# reduced interpreter test set while retaining the rest of %check.
without = ["other_python_versions"]
