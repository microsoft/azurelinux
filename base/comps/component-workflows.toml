# =============================================================================
# COMPONENT CHARACTERISTIC DEFINITIONS
# =============================================================================

[component_characteristics]

[component_characteristics.execution_environments]
build = {
    description = "Build-time environment for static analysis"
    capabilities = ["source_code_access", "build_artifacts", "static_analysis_tools"]
    max_parallelism = 8
}
container = {
    description = "Container runtime environment for isolated testing"
    capabilities = ["runtime_execution", "isolated_environment", "network_access"]
    max_parallelism = 4
}
vm = {
    description = "Virtual machine environment for full system testing"
    capabilities = ["full_system_access", "hardware_emulation", "privileged_operations"]
    max_parallelism = 2
}

[component_characteristics.test_categories]
static_analysis = {
    description = "Code analysis without execution"
    typical_duration = "5-15 minutes"
    parallel_friendly = true
}
unit_testing = {
    description = "Component-level functionality testing"
    typical_duration = "10-30 minutes" 
    parallel_friendly = true
}
integration_testing = {
    description = "Multi-component interaction testing"
    typical_duration = "20-60 minutes"
    parallel_friendly = false
}
system_testing = {
    description = "Full system behavior validation"
    typical_duration = "30-120 minutes"
    parallel_friendly = false
}
performance_testing = {
    description = "Performance and scalability validation"
    typical_duration = "45-180 minutes"
    parallel_friendly = false
}
