# Deny unused modules in cloud images by default. Administrators who need a
# module can override this policy with
# /etc/modprobe.d/60-azurelinux-cis-module-denylist.conf.

install atm /bin/false
blacklist atm

install can /bin/false
blacklist can

install tipc /bin/false
blacklist tipc

install sctp /bin/false
blacklist sctp

install usb-storage /bin/false
blacklist usb-storage
