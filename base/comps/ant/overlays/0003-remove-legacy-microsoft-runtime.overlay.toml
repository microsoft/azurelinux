# Remove this overlay and its patch when importing Ant 1.10.18 or newer,
# which includes the upstream fix. Microsoft OpenJDK uses a modular runtime,
# not the obsolete Microsoft JVM's ${java.home}/Packages/*.ZIP layout.
[[overlays]]
description = "Backport the Ant 1.10.18 fix for obsolete Microsoft JVM runtime discovery"
type = "patch-add"
source = "../ant-remove-obsolete-microsoft-runtime-discovery.patch"
