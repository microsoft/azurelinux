[metadata]
category = "azl-platform-adaptation"
upstream-status = "inapplicable"

[[overlays]]
description = "Build Ant with its provider-neutral JDK binding"
type = "spec-remove-tag"
tag = "BuildRequires"
value = "ant-openjdk25"

[[overlays]]
description = "Add Ant's provider-neutral JDK binding build dependency"
type = "spec-add-tag"
tag = "BuildRequires"
value = "ant-unbound"

[[overlays]]
description = "Build Ant with Microsoft OpenJDK 25"
type = "spec-add-tag"
tag = "BuildRequires"
value = "msopenjdk-25-fedora-compat"

[[overlays]]
description = "Use Microsoft OpenJDK 25 while building Ant"
type = "spec-prepend-lines"
section = "%build"
lines = ["export JAVA_HOME=%{_jvmdir}/msopenjdk-25"]

[[overlays]]
description = "Point Ant's openjdk25 binding at Microsoft OpenJDK 25"
type = "spec-search-replace"
section = "%install"
regex = "^echo 'JAVA_HOME=%\\{_jvmdir\\}/jre-25-openjdk' > %\\{buildroot\\}%\\{_javaconfdir\\}/ant-openjdk25\\.conf$"
replacement = "echo 'JAVA_HOME=%{_jvmdir}/msopenjdk-25' > %{buildroot}%{_javaconfdir}/ant-openjdk25.conf"

[[overlays]]
description = "Back Ant's openjdk25 binding with Microsoft OpenJDK 25"
type = "spec-search-replace"
section = "%install"
regex = '^%jp_binding --verbose --variant openjdk25 --ghost ant\.conf --target %\{_javaconfdir\}/ant-openjdk25\.conf --provides %\{name\}-jdk-binding --requires java-25-openjdk-headless --recommends java-25-openjdk-devel$'
replacement = '%jp_binding --verbose --variant openjdk25 --ghost ant.conf --target %{_javaconfdir}/ant-openjdk25.conf --provides %{name}-jdk-binding --requires msopenjdk-25'