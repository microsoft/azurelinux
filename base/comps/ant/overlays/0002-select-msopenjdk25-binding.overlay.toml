[metadata]
category = "azl-compatibility"
upstream-status = "inapplicable"

# Keep compat required until the provider guarantees the binding's JVM paths
# and system trust integration across installs and upgrades. Removing Fedora
# OpenJDK from the repository does not satisfy these requirements.
[[overlays]]
description = "Require Microsoft OpenJDK compatibility paths and system trust for Ant's OpenJDK 25 binding"
type = "spec-search-replace"
section = "%install"
regex = '^%jp_binding --verbose --variant openjdk25 --ghost ant\.conf --target %\{_javaconfdir\}/ant-openjdk25\.conf --provides %\{name\}-jdk-binding --requires java-25-openjdk-headless --recommends java-25-openjdk-devel$'
replacement = '%jp_binding --verbose --variant openjdk25 --ghost ant.conf --target %{_javaconfdir}/ant-openjdk25.conf --provides %{name}-jdk-binding --requires msopenjdk-25-fedora-compat'

# Microsoft Build of OpenJDK 25 can produce a default-compression archive with
# the same size as a level-9 archive, invalidating the test's strict comparison.
[[overlays]]
description = "Compare explicit ZIP compression levels because Java 25 default compression can match level 9"
type = "patch-add"
source = "ant-1.10.15-explicit-compression-level.patch"
