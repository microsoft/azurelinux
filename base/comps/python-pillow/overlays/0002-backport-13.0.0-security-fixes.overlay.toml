# Backport the Pillow 13.0.0 security fixes onto Fedora 44's Pillow 12.3.0.
# Pillow 13.0.0 also removes and changes APIs, and there is no 12.3.x release,
# so the upstream commits are applied as patches like the EPS fix in 0001.
# Patches are in upstream merge order and apply on top of the Fedora patches.
# Patches marked "Azure Linux backport" in their message were rebased onto 12.3.0.
# CVE-2026-112398 needs no patch: Fedora's CVE-2026-112403.patch is the same
# upstream commit (242a059aedc1).
# Drop when the imported Fedora spec packages Pillow 13.0.0 or newer.

