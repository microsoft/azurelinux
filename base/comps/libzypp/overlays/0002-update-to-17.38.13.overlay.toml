# Fedora does not package libzypp 17.38.13 on f43/f44 yet. Update to the upstream
# release for these CVE fixes:
# CVE-2026-25707, CVE-2026-44941, CVE-2026-44942
# Remove this overlay once the imported Fedora spec packages 17.38.13 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 17.38.13"
type = "spec-update-tag"
tag = "Version"
value = "17.38.13"

[[overlays]]
description = "Remove the obsolete libzypp-17.38.1.tar.gz source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(libzypp-17\.38\.1\.tar\.gz\) = [0-9a-f]+(?:\r?\n|$)'
