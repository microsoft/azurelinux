[components.'rust-sha1_0.10']
# Version-suffixed compat package providing the OLDER sha1 0.10.x, serving
# its existing dynamically-generated consumers (rust-pbkdf2, rust-rsa,
# rust-uucore, rust-uuid, rust-reqsign-*, rust-sequoia-openpgp) which
# require sha1 < 0.11.0. The default rust-sha1 is now pinned to Fedora f43
# HEAD (0.11.0) to satisfy uv's crate-alignment cascade. This is Fedora's
# own rust-sha1_0.10 dist-git package (real upstream import, no rename,
# currently 0.10.7), not a hand-rolled rename -- same convention as the
# pre-existing rust-nix0.30 compat package. Pinned to its current f43 HEAD
# (rather than left bare) because this Fedora repo was created after AZL's
# buildroot snapshot date, so the distro-default rolling snapshot can't
# resolve it.
spec = { type = "upstream", upstream-distro = { name = "fedora", version = "43" }, upstream-commit = "670436e06815031a50a09a0fe4a8103131916c13" }
