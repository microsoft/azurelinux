# fop (Apache FOP) is not packaged in Azure Linux. It's only needed to build
# the erlang-doc subpackage (PDF documentation). Disable doc generation.

# Pin to Fedora f43 erlang-26.2.5.21-12, which backports the upstream CVE fixes.
# https://src.fedoraproject.org/rpms/erlang/c/652e72aac1369ea81c4d09a2797689854d7cb642
[components.erlang]
spec = { type = "upstream", upstream-commit = "652e72aac1369ea81c4d09a2797689854d7cb642" }

[components.erlang.build]
without = ["doc"]
