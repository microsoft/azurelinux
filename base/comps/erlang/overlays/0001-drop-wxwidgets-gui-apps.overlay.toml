# --- Drop the wxWidgets GUI applications ------------------------------------
#
# AZL is a headless cloud distro and does not want wxGTK in the runtime closure.
# Upstream exposes a `%global __with_wxwidgets` toggle, but it is far too coarse:
# it also drops common_test, dialyzer and megaco, none of which link against wx.
# They are only swept up because the spec's autogenerated `Requires:` lists name
# the GUI sub-packages (common_test -> debugger/observer for its optional int and
# ttb hooks, dialyzer -> wx for `dialyzer --gui`, megaco -> debugger/et).
#
# So leave the toggle at its upstream value and remove just the five real GUI
# applications instead. This keeps erlang-common_test, erlang-dialyzer and
# erlang-megaco in the distro; without them erlang-rebar3, erlang-lager and
# erlang-cth_readable have unsatisfiable dependencies, which in turn blocks
# every package that builds with rebar3.
#
# The trade-off is that `dialyzer --gui`, observer, debugger, et_viewer, reltool
# and common_test's int/ttb hooks are unavailable. All are GUI or interactive
# tools with no use on a headless image.
#
# upstream-status is needs-upstream-hook: upstream's only knob is the coarse
# __with_wxwidgets toggle; fine-grained per-application removal would require a
# hook upstream does not yet provide.
[metadata]
category = "azl-pruning"
upstream-status = "needs-upstream-hook"

# Stop OTP building the five applications; otherwise their files land in the
# buildroot with no %files section left to claim them.
[[overlays]]
description = "Configure OTP without the wxWidgets GUI applications"
type = "spec-search-replace"
regex = '^\s*--with-wx-config=/usr/bin/wx-config$'
replacement = ' --without-wx --without-debugger --without-et --without-observer --without-reltool'

# Removing the wx sub-package also drops its `BuildRequires: wxGTK-devel`, which
# lives in the same %package block.
[[overlays]]
description = "Drop the erlang-wx sub-package (wxGTK bindings)"
type = "spec-remove-subpackage"
package = "wx"

[[overlays]]
description = "Drop the erlang-debugger sub-package (wx GUI debugger)"
type = "spec-remove-subpackage"
package = "debugger"

[[overlays]]
description = "Drop the erlang-et sub-package (wx GUI event tracer)"
type = "spec-remove-subpackage"
package = "et"

[[overlays]]
description = "Drop the erlang-observer sub-package (wx GUI system observer)"
type = "spec-remove-subpackage"
package = "observer"

[[overlays]]
description = "Drop the erlang-reltool sub-package (wx GUI release tool)"
type = "spec-remove-subpackage"
package = "reltool"

# The dropped sub-packages are still named by `Requires:` lines in the erlang
# meta-package, in erlang-src, and in the sub-packages we keep.
[[overlays]]
description = "Strip Requires on the dropped wxWidgets GUI sub-packages"
type = "spec-search-replace"
regex = '^Requires: %\{name\}-(wx|debugger|et|observer|reltool)%\{\?_isa\} = %\{version\}-%\{release\}$'
replacement = ''

# erlang-examples globs the examples/ directory of every built application.
[[overlays]]
description = "Drop erlang-examples entries for the dropped wxWidgets GUI applications"
type = "spec-search-replace"
regex = '^%\{_libdir\}/erlang/lib/(wx|debugger|et|observer|reltool)-\*/examples/$'
replacement = ''
