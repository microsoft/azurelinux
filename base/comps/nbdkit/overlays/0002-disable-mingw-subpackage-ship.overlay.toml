# Azure Linux does not ship mingw cross-compilation toolchains.

[metadata]
category = "azl-pruning"
upstream-status = "needs-upstream-hook"

[[overlays]]
description = "Disable mingw subpackage — Azure Linux does not ship mingw toolchains"
type = "spec-search-replace"
regex = "%global have_mingw 1"
replacement = "%global have_mingw 0"
