# Fedora does not package graphite2 1.3.15 on f43/f44 yet. Update to the upstream
# release for these CVE fixes:
# CVE-2026-50593
# Remove this overlay once the imported Fedora spec packages 1.3.15 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 1.3.15"
type = "spec-update-tag"
tag = "Version"
value = "1.3.15"

[[overlays]]
description = "Drop the GCC 15 test fix; 1.3.15 already includes <cstdint>"
type = "patch-remove"
file = "**/graphite2-1.3.14-gcc15.patch"

[[overlays]]
description = "1.3.15 is published on GitHub releases, not SourceForge"
type = "spec-search-replace"
regex = '^Source0:\s+https://downloads\.sourceforge\.net/project/silgraphite/graphite2//%\{name\}-%\{version\}\.tgz$'
replacement = "Source0:        https://github.com/silnrsi/graphite/releases/download/%{version}/%{name}-%{version}.tgz"

[[overlays]]
description = "Drop the comment left over from the removed GCC 15 patch"
type = "spec-search-replace"
regex = '^# This fixes compilation with gcc15$'
replacement = ""

[[overlays]]
description = "Remove the obsolete graphite2-1.3.14.tgz source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(graphite2-1\.3\.14\.tgz\) = [0-9a-f]+(?:\r?\n|$)'
