# Fedora does not package python-flask 3.1.3 on f43/f44 yet. Update to the upstream
# release for these CVE fixes:
# CVE-2026-27205
# Remove this overlay once the imported Fedora spec packages 3.1.3 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 3.1.3"
type = "spec-update-tag"
tag = "Version"
value = "3.1.3"

[[overlays]]
description = "Remove the obsolete flask-3.1.2.tar.gz source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(flask-3\.1\.2\.tar\.gz\) = [0-9a-f]+(?:\r?\n|$)'
