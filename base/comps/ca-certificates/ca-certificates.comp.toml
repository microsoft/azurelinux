[components.ca-certificates]
# Track the latest Fedora 43 CA trust update beyond the distro snapshot.
# https://bodhi.fedoraproject.org/updates/FEDORA-2026-3ee4dad1c6
spec = { type = "upstream", upstream-commit = "b4d9c2bbbddef29041afa8158a7b47a27740c6a2" }
# Release: 4%{?dist}
release = { calculation = "manual" }

[[components.ca-certificates.overlays]]
description = "Set the component-wide manually managed release"
type = "spec-update-tag"
tag = "Release"
value = "4%{?dist}"
metadata = { category = "azl-release-management", upstream-status = "inapplicable" }
