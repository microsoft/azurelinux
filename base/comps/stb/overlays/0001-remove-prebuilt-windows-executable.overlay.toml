# Drop the prebuilt Win32 demo executable checked into the oversampling test
# directory. It is a compiled artifact, not source: %build compiles the
# tests/Makefile "will it compile" targets and %check runs
# ./tests/image_write_test, neither of which references tests/oversample, and
# nothing under tests/oversample is shipped in a binary RPM. The rest of the
# directory (README.md, main.c, stb_wingraph.h and the MSVC project files) is
# kept, so the documentation reference in stb_truetype.h stays valid.
[metadata]
category = "azl-pruning"
upstream-status = "inapplicable"

[[overlays]]
description = "Remove the prebuilt Win32 demo executable from the oversampling test directory"
type = "file-remove"
archive = "stb-f1c79c02822848a9bed4315b12c8c8f3761e1296.tar.gz"
file = "tests/oversample/oversample.exe"
