# Java portable package has a bootstrap stage which requires N-1 or N version of
# JDK. For stage-1 we have an _option_ to pull deps from elsewhere. For stage-2
# packages are restricted to what we build. We do not build jdk 24 and only 'N' or
# 25 will work for us.
#
# The second workaround is to deliver the appropriate minor version of java portable.
# Java 25 sdk needs 25.0.0.0.32 version of the -sources as a build requires. We pull
# from the last snapshot of the spec at that version.

[components.java-25-openjdk-portable]
# Release: %{?eaprefix}%{rpmrelease}%{?extraver}%{?dist}
release = { calculation = "manual" }
spec = { type = "upstream", upstream-distro = { name = "fedora", version = "43" }, upstream-commit = "cad9d5a1ed48cf7e9e12cfadfdacc11f523d46cb" }
# Disable slowdebug variant builds; we don't ship -slowdebug subpackages.
build.without = ["slowdebug"]

[components.java-25-openjdk-portable.build.defines]
# AZL-only release counter. Added to upstream's %{rpmrelease} so the final
# Release tag is a single number (Fedora-style schema). Bump when shipping
# new AZL-only changes on top of the pinned upstream commit.
azl_release = "2"

