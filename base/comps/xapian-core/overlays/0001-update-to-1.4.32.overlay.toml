# Fedora f43 packages xapian-core 1.4.29 and f44 packages 1.4.30. Update to the
# upstream 1.4.32 patch release on the same f43 spec for this CVE fix:
# CVE-2026-77643
# Remove this overlay once the imported Fedora spec packages 1.4.32 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 1.4.32"
type = "spec-update-tag"
tag = "Version"
value = "1.4.32"

[[overlays]]
description = "Remove the obsolete 1.4.29 source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(xapian-core-1\.4\.29\.tar\.xz\) = [0-9a-f]+(?:\r?\n|$)'
