[components.rust-pbkdf2]
# Pinned to Fedora f43 HEAD (past the distro default snapshot) to provide
# pbkdf2 0.13.0, required by rust-zip 8.6.0 in uv 0.10.12's crate-alignment
# cascade (crate(pbkdf2/default) >= 0.13.0). Existing dynamically-generated consumers
# (rust-scrypt, rust-bcrypt-pbkdf, rust-pkcs5) which require pbkdf2 < 0.13.0
# are served by the new rust-pbkdf2_0.12 compat package, pinned at the
# commit this default previously resolved to. Note: the Fedora f43 HEAD
# spec at this commit patches out a belt-hash dev-dependency/tests
# (unpackaged crate) via pbkdf2-fix-metadata.diff / pbkdf2-0.13.0-no-belt-hash.patch;
# both are inherited automatically from the upstream import at this commit.
spec = { type = "upstream", upstream-distro = { name = "fedora", version = "43" }, upstream-commit = "64125a7336413fb33a8a876b293fed44d72d9292" }
