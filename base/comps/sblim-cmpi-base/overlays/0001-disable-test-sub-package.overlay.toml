# The optional sblim-cmpi-base-test harness hard-requires sblim-testsuite.
# Its package and dependency are both gated by with_test_subpackage, so
# disabling that macro keeps the base provider without the sdk-tier harness.
[metadata]
category = "azl-pruning"
upstream-status = "needs-upstream-hook"

[[overlays]]
description = "Disable test sub-package - sblim-testsuite is sdk-tier in AZL"
type = "spec-search-replace"
regex = "^%global with_test_subpackage 1$"
replacement = "%global with_test_subpackage 0"
