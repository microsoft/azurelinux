# Pin to Fedora f44 httpd-2.4.71 to pick up upstream CVE fixes.
# f43 is still on 2.4.69; the f44 commit only bumps the version from it.
# https://src.fedoraproject.org/rpms/httpd/c/dd036578128f894e8d7a7c95a5968cee9be4bbb7
[components.httpd]
tests.tests = [{ name = "httpd-fedora-tmt" }]
spec = { type = "upstream", upstream-distro = { name = "fedora", version = "44" }, upstream-commit = "dd036578128f894e8d7a7c95a5968cee9be4bbb7" }
release = { calculation = "manual" }

[[components.httpd.overlays]]
description = "Bump release"
type = "spec-set-tag"
tag = "Release"
value = "1.2.1%{?dist}"
metadata = { category = "azl-temp-workaround", upstream-status = "inapplicable" }
