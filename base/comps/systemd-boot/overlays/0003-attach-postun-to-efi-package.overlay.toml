[metadata]
category = "azl-compatibility"
upstream-status = "inapplicable"

[[overlays]]
description = "Remove the main-package scriptlet so it can be reattached without editing a section header"
type = "spec-remove-section"
section = "%postun"

[[overlays]]
description = "Reinsert the bootctl update scriptlet on the systemd-boot EFI package"
type = "spec-append-lines"
section = "%install"
lines = [
    "%postun -n systemd-boot-%{efi_arch}",
    "# This part will need to be updated in bootctl first, and then here.",
    "if [ $1 -ge 1 ] && bootctl is-installed &>/dev/null; then",
    '  echo "Updating systemd-boot…"',
    "  bootctl update || :",
    "fi",
    "",
]
