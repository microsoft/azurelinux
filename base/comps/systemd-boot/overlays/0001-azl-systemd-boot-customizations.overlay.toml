[metadata]
category = "azl-compatibility"
upstream-status = "inapplicable"

[[overlays]]
description = "Update the Fedora systemd-boot package version to the Azure Linux build version"
type = "spec-set-tag"
tag = "Version"
value = "258.11"

[[overlays]]
description = "Remove the linux EFI stub copy from the install step"
type = "spec-search-replace"
regex = '^cp -a %\{_prefix\}/lib/systemd/boot/efi/linux%\{efi_arch\}\.efi\.stub %\{buildroot\}%\{_prefix\}/lib/systemd/boot/efi/linux%\{efi_arch\}\.efi\.stub\.alt$'
replacement = ''

[[overlays]]
description = "Remove the linux ELF stub copy from the install step"
type = "spec-search-replace"
regex = '^cp -a %\{_prefix\}/lib/systemd/boot/efi/linux%\{efi_arch\}\.elf\.stub %\{buildroot\}%\{_prefix\}/lib/systemd/boot/efi/linux%\{efi_arch\}\.elf\.stub\.alt$'
replacement = ''

[[overlays]]
description = "Remove the linux EFI stub alt file from the package manifest"
type = "spec-search-replace"
regex = '^%\{_prefix\}/lib/systemd/boot/efi/linux%\{efi_arch\}\.efi\.stub\.alt$'
replacement = ''

[[overlays]]
description = "Remove the linux ELF stub alt file from the package manifest"
type = "spec-search-replace"
regex = '^%\{_prefix\}/lib/systemd/boot/efi/linux%\{efi_arch\}\.elf\.stub\.alt$'
replacement = ''

[[overlays]]
description = "Rewrite the signing step to use the systemd-boot signing flow"
type = "spec-search-replace"
regex = '^%pesign -s -i %\{_prefix\}/lib/systemd/boot/efi/systemd-boot%\{efi_arch\}\.efi -o %\{buildroot\}%\{_prefix\}/lib/systemd/boot/efi/systemd-boot%\{efi_arch\}\.efi\.signed$'
replacement = '''SYSTEMD_BOOT_EFI="%{buildroot}%{_prefix}/lib/systemd/boot/efi/systemd-boot%{efi_arch}.efi"
%define __pesign_client_cert systemd-boot-signer
%pesign -s -i $SYSTEMD_BOOT_EFI -o $SYSTEMD_BOOT_EFI.signed
mv $SYSTEMD_BOOT_EFI.signed $SYSTEMD_BOOT_EFI'''
