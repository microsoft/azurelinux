# Drop test-pe from check_PROGRAMS — references the stripped PE fixtures
[[components.yara.overlays]]
type = "file-search-replace"
file = "yara-4.5.4.tar.gz/Makefile.am"
regex = '  test-pe \\\n'
replacement = ''
description = "Remove test-pe from check_PROGRAMS list (stripped PE fixtures make it fail)"

# Drop orphan test_pe_* variable declarations — automake -Werror rejects them
[[components.yara.overlays]]
type = "file-search-replace"
file = "yara-4.5.4.tar.gz/Makefile.am"
regex = 'test_pe_SOURCES = tests/test-pe.c tests/util.c\n'
replacement = ''
description = "Remove orphan test_pe_SOURCES variable (automake -Werror rejects it)"

[[components.yara.overlays]]
type = "file-search-replace"
file = "yara-4.5.4.tar.gz/Makefile.am"
regex = 'test_pe_LDADD = libyara.la\n'
replacement = ''
description = "Remove orphan test_pe_LDADD variable (automake -Werror rejects it)"

