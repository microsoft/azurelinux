[metadata]
category = "azl-pruning"
upstream-status = "inapplicable"

# These encrypted, malformed, or intentionally malware-like test fixtures
# cannot be processed by Azure Linux source validation checks. They are not
# runtime inputs; prune them from Source0 during source preparation.

[[overlays]]
type = "file-remove"
file = "src/test/resources/bla.encrypted.7z"
description = "Remove encrypted 7-Zip test fixture that prevents source validation"
archive = "commons-compress-1.27.1-src.tar.gz"

[[overlays]]
type = "file-remove"
file = "src/test/resources/password-encrypted.zip"
description = "Remove encrypted ZIP test fixture that prevents source validation"
archive = "commons-compress-1.27.1-src.tar.gz"

[[overlays]]
type = "file-remove"
file = "src/test/resources/COMPRESS-256.7z"
description = "Remove crafted 7-Zip test fixture that prevents source validation"
archive = "commons-compress-1.27.1-src.tar.gz"

[[overlays]]
type = "file-remove"
file = "src/test/resources/zip64support.tar.bz2"
description = "Remove crafted tar.bz2 test fixture that prevents source validation"
archive = "commons-compress-1.27.1-src.tar.gz"
