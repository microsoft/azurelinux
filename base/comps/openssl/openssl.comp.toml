[components.openssl]
# Pin to Fedora f43 openssl-3.5.4-3 which includes CVE patches 0073–0079 fixing:
# CVE-2026-31789 (Critical), CVE-2026-28387, CVE-2026-31790, CVE-2026-2673,
# CVE-2026-28390, CVE-2026-28389, CVE-2026-28388 (all High).
# Fedora commit: https://src.fedoraproject.org/rpms/openssl/c/0990e54a2f6b6b8e4f3e238175382505fff8be51
spec = { type = "upstream", upstream-commit = "0990e54a2f6b6b8e4f3e238175382505fff8be51" }

# Azure Linux does not ship fips.so. Extend the existing RHEL fips.so-deletion
# path to cover Azure Linux so the module and its config are excluded from the
# package.
[[components.openssl.overlays]]
type = "spec-search-replace"
regex = '%if \( %\{defined rhel\} && \(! %\{defined centos\}\) && \(! %\{defined eln\}\) \)'
replacement = '%if ( %{defined rhel} && (! %{defined centos}) && (! %{defined eln}) ) || %{defined azurelinux}'
description = "Remove fips.so from openssl on Azure Linux (not supported for public preview)"

# The above replacement also hits the Requires: openssl-fips-provider guard.
# Suppress that dependency on Azure Linux — openssl-fips-provider is not
# shipped for public preview.
[[components.openssl.overlays]]
type = "spec-remove-tag"
tag = "Requires"
value = "openssl-fips-provider"
package = "libs"
description = "Don't require openssl-fips-provider on Azure Linux"

# Rework FIPS provider auto-activation. See comments in patch file for details.
[[components.openssl.overlays]]
type = "patch-add"
source = "0080-azl-fips-provider-drop-in-activation.patch"
description = "AZL config-driven FIPS provider drop-in activation. patch-add auto-assigns the next number (Patch80); the spec's `%autosetup -S git` applies it last -- i.e. on top of Fedora's pristine patch 0019."

# Drop the legacy /etc/pki/tls/fips_local.cnf symlink. Nothing reads it after the
# AZL 0080 rework above (which reads the openssl.d drop-in instead), so both its
# creation in %install and its %files entry are removed.
[[components.openssl.overlays]]
type = "spec-search-replace"
section = "%install"
regex = '^ln -s /etc/crypto-policies/back-ends/openssl_fips\.config \$RPM_BUILD_ROOT%\{_sysconfdir\}/pki/tls/fips_local\.cnf$'
replacement = ''
description = "Remove legacy fips_local.cnf symlink creation (unused after AZL 0080 rework)"

[[components.openssl.overlays]]
type = "spec-search-replace"
section = "%files"
package = "libs"
regex = '^%config %\{_sysconfdir\}/pki/tls/fips_local\.cnf$'
replacement = ''
description = "Remove legacy fips_local.cnf from %files (unused after AZL 0080 rework)"
