[components.openssl]
# Pin to Fedora f43 openssl-3.5.4-3 which includes CVE patches 0073–0079 fixing:
# CVE-2026-31789 (Critical), CVE-2026-28387, CVE-2026-31790, CVE-2026-2673,
# CVE-2026-28390, CVE-2026-28389, CVE-2026-28388 (all High).
# Fedora commit: https://src.fedoraproject.org/rpms/openssl/c/0990e54a2f6b6b8e4f3e238175382505fff8be51
spec = { type = "upstream", upstream-commit = "0990e54a2f6b6b8e4f3e238175382505fff8be51" }

# ── Pre-existing build fix ─────────────────────────────────────────────────────
# Patch0037's fips_config.pod hunk was written for older OpenSSL; the file was
# completely rewritten in 3.5.4. The hunk is RH-specific documentation that
# 3.5.4 already covers natively. Replace with a version that drops the broken
# hunk (all code changes still apply).
[[components.openssl.overlays]]
type = "file-remove"
file = "0037-FIPS-TLS-Enforce-EMS-in-TLS-1.2-NOTE.patch"
description = "Remove original Patch0037 (fips_config.pod hunk incompatible with 3.5.4)"

[[components.openssl.overlays]]
type = "file-add"
file = "0037-FIPS-TLS-Enforce-EMS-in-TLS-1.2-NOTE.patch"
source = "0037-FIPS-TLS-Enforce-EMS-in-TLS-1.2-NOTE.patch"
description = "Add fixed Patch0037 without broken fips_config.pod hunk"

# ── AZL4 FIPS architecture ────────────────────────────────────────────────────
# AZL4 builds fips.so in the openssl SRPM but ships it via a separate
# openssl-fips-provider package. The overlays below:
#   1. Remove fips.so and fipsmodule.cnf from the openssl RPMs
#   2. Remove RH-specific FIPS patches that conflict with our fipsinstall approach
#   3. Fix %check to use fipsinstall instead of the RH hmacify script
#   4. Replace the fips_local.cnf symlink with a real file using .include
#   5. Rebrand the FIPS vendor string

# ── Extend RHEL guard to AZL4 ─────────────────────────────────────────────────
# This guard controls: fips.so deletion in __spec_install_post, fipsmodule.cnf
# removal from %install, Requires: openssl-fips-provider, and Patch0053 (MLKEM).
[[components.openssl.overlays]]
type = "spec-search-replace"
regex = '%if \( %\{defined rhel\} && \(! %\{defined centos\}\) && \(! %\{defined eln\}\) \)'
replacement = '%if ( %{defined rhel} && (! %{defined centos}) && (! %{defined eln}) ) || 0%{?azl4}'
description = "Extend RHEL FIPS guard to AZL4"

# ── WI-1: Remove conflicting FIPS patches ─────────────────────────────────────
# These implement Red Hat's embedded-HMAC approach. AZL4 uses fipsinstall +
# fipsmodule.cnf instead.
[[components.openssl.overlays]]
type = "spec-remove-tag"
tag = "Patch0017"
description = "Remove RH FIPS vendor branding patch (openssl doesn't ship fips.so)"

[[components.openssl.overlays]]
type = "spec-remove-tag"
tag = "Patch0018"
description = "Remove fipsinstall disabler (we need fipsinstall to work)"

[[components.openssl.overlays]]
type = "spec-remove-tag"
tag = "Patch0020"
description = "Remove embedded HMAC patch (conflicts with fipsmodule.cnf approach)"

[[components.openssl.overlays]]
type = "spec-remove-tag"
tag = "Patch0022"
description = "Remove KAT reorder patch (meaningless without Patch0020)"

# ── WI-2: Fix %check — use fipsinstall instead of hmacify ─────────────────────
# With Patch0020 removed, the .rodata1 section doesn't exist so hmacify fails.
# Run fipsinstall to generate fipsmodule.cnf; the FIPS self-tests use it.
[[components.openssl.overlays]]
type = "spec-search-replace"
regex = '%\{SOURCE1\} providers/fips\.so'
replacement = 'LD_LIBRARY_PATH=. apps/openssl fipsinstall -module providers/fips.so -out providers/fipsmodule.cnf'
description = "Use fipsinstall instead of hmacify during %check"

# Patch0018 disabled the test that generates test/fipsmodule.cnf via fipsinstall.
# With it removed, the test runs fipsinstall -pedantic, which enables strict FIPS
# indicators that conflict with Fedora's FIPS patch set. Remove -pedantic to
# match the indicator defaults the test data expects.
[[components.openssl.overlays]]
type = "spec-search-replace"
regex = 'make test HARNESS_JOBS=8'
replacement = "sed -i \"s/'-pedantic',//\" test/recipes/00-prep_fipsmodule_cnf.t\nmake test HARNESS_JOBS=8 TESTS='!03-test_fipsinstall !30-test_evp !80-test_ssl_new !90-test_sslapi'"
description = "Remove -pedantic from fipsinstall test prep; exclude known-failing FIPS tests"

# Known FIPS test exclusions (pre-existing Fedora FIPS patch issues):
# - 03-test_fipsinstall: tests 21,27 — corruption tests for DSA/RSA_Encrypt
#   which are disabled by Fedora FIPS patches (0043, 0059)
# - 30-test_evp: tests 73,82 — FIPS KDF/RSA tests where fipsmodule.cnf
#   indicator values differ from code defaults set by Fedora patches
# - 80-test_ssl_new: test 20 (cert-select FIPS) — RSA X9.31 padding check
#   from Patch0028 conflicts with cert selection test expectations
# - 90-test_sslapi: tests 2-3 (pipelining FIPS) — RSA PKCS1 padding
#   disallowed in FIPS mode by Patch0059, breaks pipelining test
# TODO: Narrow exclusions once FIPS test issues are resolved upstream.

# ── WI-3: Rebrand FIPS vendor string ──────────────────────────────────────────
[[components.openssl.overlays]]
type = "spec-search-replace"
regex = 'Red Hat Enterprise Linux OpenSSL FIPS Provider'
replacement = 'Microsoft Azure Linux OpenSSL FIPS Provider'
description = "Brand FIPS vendor string for Azure Linux"

# ── WI-8: Make FIPS provider loadable on-demand via openssl.cnf ────────────────
# Without this, `-provider fips` fails because SELF_TEST_post() can't find
# module-mac. We add .include fipsmodule.cnf (provides [fips_sect] with the
# HMAC) and register fips in [provider_sect] without activating it by default.
[[components.openssl.overlays]]
type = "spec-search-replace"
regex = 'mv rh-openssl\.cnf \$RPM_BUILD_ROOT%\{_sysconfdir\}/pki/tls/openssl\.cnf'
replacement = """mv rh-openssl.cnf $RPM_BUILD_ROOT%{_sysconfdir}/pki/tls/openssl.cnf
# Wire FIPS provider config so `-provider fips` works without manual editing.
# 1. Include fipsmodule.cnf (provides [fips_sect] with module-mac) near the top
sed -i '/^openssl_conf = openssl_init$/a \\\n# Include FIPS module integrity data (module-mac) so the provider can self-test.\\n.include /etc/pki/tls/fipsmodule.cnf' $RPM_BUILD_ROOT%{_sysconfdir}/pki/tls/openssl.cnf
# 2. Register fips provider in [provider_sect] (not activated by default)
sed -i '/^default = default_sect$/a fips = fips_sect' $RPM_BUILD_ROOT%{_sysconfdir}/pki/tls/openssl.cnf"""
description = "Wire fipsmodule.cnf and fips provider into openssl.cnf for on-demand loading"

# ── WI-7: fips_local.cnf — real file with .include directives ─────────────────
# Patch 0019 loads fips_local.cnf via NCONF_load() when the kernel FIPS flag is
# set. The upstream self_test.c requires module-mac (HMAC of fips.so) from
# config; the crypto-policies backend alone doesn't provide it. We replace the
# symlink with a real file that .includes both fipsmodule.cnf (HMAC, from
# openssl-fips-provider) and the crypto-policies backend (algorithm settings).
[[components.openssl.overlays]]
type = "spec-search-replace"
regex = 'ln -s /etc/crypto-policies/back-ends/openssl_fips\.config \$RPM_BUILD_ROOT%\{_sysconfdir\}/pki/tls/fips_local\.cnf'
replacement = "cat > $RPM_BUILD_ROOT%{_sysconfdir}/pki/tls/fips_local.cnf << 'FIPS_LOCAL_EOF'\n# Loaded by patch 0019 when kernel FIPS flag is set.\n# Merges FIPS module integrity data with crypto-policy settings.\n.include /etc/pki/tls/fipsmodule.cnf\n.include /etc/crypto-policies/back-ends/openssl_fips.config\nFIPS_LOCAL_EOF"
description = "Replace fips_local.cnf symlink with real file using .include directives"


[[components.openssl.overlays]]
type = "file-add"
file = "0019-FIPS-Require-fips-capable-provider.patch"
source = "0019-FIPS-Require-fips-capable-provider.patch"

[[components.openssl.overlays]]
type = "spec-search-replace"
regex = "0019-FIPS-Force-fips-provider-on"
replacement = "0019-FIPS-Require-fips-capable-provider"
description = "Replace FIPS provider with drop-in replacement on Azure Linux (not supported for public preview)"

[[components.openssl.overlays]]
type = "spec-search-replace"
regex = "enable-camellia"
replacement = "enable-camellia enable-trace"
description = "TRACE!!!"
