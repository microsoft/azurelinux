[components.'rust-pbkdf2_0.12']
# Version-suffixed compat package providing the OLDER pbkdf2 0.12.x,
# serving its existing dynamically-generated consumers (rust-scrypt,
# rust-bcrypt-pbkdf, rust-pkcs5) which require pbkdf2 < 0.13.0. The default
# rust-pbkdf2 is now pinned to Fedora f43 HEAD (0.13.0) to satisfy uv's
# crate-alignment cascade. This is Fedora's own rust-pbkdf2_0.12 dist-git
# package (real upstream import, no rename), not a hand-rolled rename --
# same convention as the pre-existing rust-nix0.30 compat package. Pinned
# to its current f43 HEAD (rather than left bare) because this Fedora repo
# was created after AZL's buildroot snapshot date, so the distro-default
# rolling snapshot can't resolve it.
spec = { type = "upstream", upstream-distro = { name = "fedora", version = "43" }, upstream-commit = "e84459d291d055c026d4b81d527abb3bf402980e" }
