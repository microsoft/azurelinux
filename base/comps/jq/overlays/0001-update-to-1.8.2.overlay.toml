# Fedora f43/f44 package jq 1.8.1. Update the f43 spec in-line to the upstream 1.8.2 patch
# release (security and bug fixes only, same libjq ABI) for:
# CVE-2025-9403, CVE-2026-33948, CVE-2026-40612, CVE-2026-41256, CVE-2026-41257,
# CVE-2026-43894, CVE-2026-43895, CVE-2026-43896, CVE-2026-44777, CVE-2026-47770,
# CVE-2026-49839, CVE-2026-54679
# Remove this overlay once the imported Fedora spec packages 1.8.2 or newer.

[metadata]
category = "azl-temp-workaround"
upstream-status = "upstreamable"

[[overlays]]
description = "Update to upstream 1.8.2"
type = "spec-update-tag"
tag = "Version"
value = "1.8.2"

[[overlays]]
description = "Drop skipped_too_deep.patch; 1.8.2 already contains the print depth change (jqlang/jq#3414)"
type = "spec-remove-tag"
tag = "Patch"
value = "skipped_too_deep.patch"

[[overlays]]
description = "Remove the dropped patch file skipped_too_deep.patch"
type = "file-remove"
file = "skipped_too_deep.patch"

[[overlays]]
description = "Drop CVE-2026-32316.patch; 1.8.2 already contains the CVE-2026-32316 fix"
type = "spec-remove-tag"
tag = "Patch"
value = "CVE-2026-32316.patch"

[[overlays]]
description = "Remove the dropped patch file CVE-2026-32316.patch"
type = "file-remove"
file = "CVE-2026-32316.patch"

[[overlays]]
description = "Drop CVE-2026-39956.patch; 1.8.2 already contains the CVE-2026-39956 fix"
type = "spec-remove-tag"
tag = "Patch"
value = "CVE-2026-39956.patch"

[[overlays]]
description = "Remove the dropped patch file CVE-2026-39956.patch"
type = "file-remove"
file = "CVE-2026-39956.patch"

[[overlays]]
description = "Drop CVE-2026-39979.patch; 1.8.2 already contains the CVE-2026-39979 fix"
type = "spec-remove-tag"
tag = "Patch"
value = "CVE-2026-39979.patch"

[[overlays]]
description = "Remove the dropped patch file CVE-2026-39979.patch"
type = "file-remove"
file = "CVE-2026-39979.patch"

[[overlays]]
description = "Drop CVE-2026-40164.patch; 1.8.2 already contains the CVE-2026-40164 fix"
type = "spec-remove-tag"
tag = "Patch"
value = "CVE-2026-40164.patch"

[[overlays]]
description = "Remove the dropped patch file CVE-2026-40164.patch"
type = "file-remove"
file = "CVE-2026-40164.patch"

[[overlays]]
description = "Drop CVE-2026-33947.patch; 1.8.2 already contains the CVE-2026-33947 fix"
type = "spec-remove-tag"
tag = "Patch"
value = "CVE-2026-33947.patch"

[[overlays]]
description = "Remove the dropped patch file CVE-2026-33947.patch"
type = "file-remove"
file = "CVE-2026-33947.patch"

[[overlays]]
description = "Remove the obsolete jq-1.8.1.tar.gz source checksum"
type = "file-search-replace"
file = "sources"
regex = '(?m)^SHA512 \(jq-1\.8\.1\.tar\.gz\) = [0-9a-f]+(?:\r?\n|$)'
