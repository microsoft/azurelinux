# ============================================================================
# Image registry
# ============================================================================
#
# Most images select one leaf profile from the shared AzureLinux.kiwi
# hierarchy. The VM ISO installer retains its standalone definition.
# Images with runtime package management ship azurelinux-repos. Distroless
# images intentionally omit repository packages.
#
# The kiwi repositories are build-time sources. Koji overrides them for
# distro builds.
# ============================================================================

# ---- vm-base -----------------------------------------------------------

[images.vm-base]
description = "VM Base Image"
definition = { type = "kiwi", path = "AzureLinux.kiwi", profile = "vm-base" }
architectures = ["x86_64", "aarch64"]
tests.tests = [
  { name = "static-image-checks" },
  { group = "vm-base-functional" },
  { group = "vm-base-performance" },
]

[images.vm-base.capabilities]
machine-bootable = true
container = false
systemd = true
runtime-package-management = true

[images.vm-base.properties]
openssl-fips-provider = "upstream"

[images.container-base]
description = "Container Base Image"
definition = { type = "kiwi", path = "AzureLinux.kiwi", profile = "core" }
architectures = ["x86_64", "aarch64"]
tests.tests = [
    { name = "static-image-checks" },
    { name = "runtime-container-tests" },
]

[images.container-base.capabilities]
machine-bootable = false
container = true
systemd = false
runtime-package-management = true

[images.container-base.properties]
openssl-fips-provider = "upstream"

[images.container-distroless-minimal]
description = "Container Distroless Minimal Image"
definition = { type = "kiwi", path = "AzureLinux.kiwi", profile = "distroless-minimal" }
architectures = ["x86_64", "aarch64"]
tests.tests = [{ name = "static-image-checks" }]

[images.container-distroless-minimal.capabilities]
machine-bootable = false
container = true
systemd = false
runtime-package-management = false

[images.container-distroless-minimal.properties]
openssl-fips-provider = "none"

[images.container-distroless-base]
description = "Container Distroless Base Image"
definition = { type = "kiwi", path = "AzureLinux.kiwi", profile = "distroless-base" }
architectures = ["x86_64", "aarch64"]
tests.tests = [{ name = "static-image-checks" }]

[images.container-distroless-base.capabilities]
machine-bootable = false
container = true
systemd = false
runtime-package-management = false

[images.container-distroless-base.properties]
openssl-fips-provider = "upstream"

[images.container-distroless-debug]
description = "Container Distroless Debug Image"
definition = { type = "kiwi", path = "AzureLinux.kiwi", profile = "distroless-debug" }
architectures = ["x86_64", "aarch64"]
tests.tests = [{ name = "static-image-checks" }]

[images.container-distroless-debug.capabilities]
machine-bootable = false
container = true
systemd = false
runtime-package-management = false

[images.container-distroless-debug.properties]
openssl-fips-provider = "upstream"

