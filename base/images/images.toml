# ============================================================================
# Image registry
# ============================================================================
#
# Package-manageable images ship `azurelinux-repos`, which exposes repositories.
# Distroless images contain neither a package manager nor runtime repositories.
#
# Image build inputs remain independent of the runtime repository definitions:
# each kiwi `<repository>` points at azl4-dev for local builds, and koji
# overrides it for distro builds.
# ============================================================================

# ---- vm-base -----------------------------------------------------------

[images.vm-base]
description = "VM Base Image"
definition = { type = "kiwi", path = "vm-base/vm-base.kiwi", profile = "vm-base" }
tests.test-suites = [
  { name = "static-image-checks" },
  { name = "lisa-main" },
  { name = "lisa-xfs" },
  { name = "lisa-perf" },
  { name = "lisa-smoke" },
  { name = "lisa-kernel-ltp" },
]

[images.vm-base.capabilities]
machine-bootable = true
container = false
systemd = true
runtime-package-management = true

# ---- minimal-os --------------------------------------------------------

[images.minimal-os]
description = "Minimal OS Image"
definition = { type = "kiwi", path = "minimal-os/minimal-os.kiwi", profile = "minimal-os" }
tests.test-suites = [
  { name = "static-image-checks" },
]

[images.minimal-os.capabilities]
machine-bootable = true
container = false
systemd = true
runtime-package-management = true

# ---- container-base (core profile) -------------------------------------
[images.container-base]
description = "Container Base Image"
definition = { type = "kiwi", path = "container-base/container-base.kiwi", profile = "core" }
tests.test-suites = [
    { name = "static-image-checks" },
    { name = "runtime-container-tests" },
]

[images.container-base.capabilities]
machine-bootable = false
container = true
systemd = false
runtime-package-management = true

# ---- distroless containers ---------------------------------------------

[images.container-distroless-minimal]
description = "Container Distroless Minimal Image"
definition = { type = "kiwi", path = "container-base/container-base.kiwi", profile = "distroless-minimal" }
tests.test-suites = [{ name = "static-image-checks" }]

[images.container-distroless-minimal.capabilities]
machine-bootable = false
container = true
systemd = false
runtime-package-management = false

[images.container-distroless-base]
description = "Container Distroless Base Image"
definition = { type = "kiwi", path = "container-base/container-base.kiwi", profile = "distroless-base" }
tests.test-suites = [{ name = "static-image-checks" }]

[images.container-distroless-base.capabilities]
machine-bootable = false
container = true
systemd = false
runtime-package-management = false

[images.container-distroless-debug]
description = "Container Distroless Debug Image"
definition = { type = "kiwi", path = "container-base/container-base.kiwi", profile = "distroless-debug" }
tests.test-suites = [{ name = "static-image-checks" }]

[images.container-distroless-debug.capabilities]
machine-bootable = false
container = true
systemd = false
runtime-package-management = false

# ---- wsl ---------------------------------------------------------------

[images.wsl]
description = "WSL Image"
definition = { type = "kiwi", path = "wsl/wsl.kiwi", profile = "wsl" }
tests.test-suites = [{ name = "static-image-checks" }]

[images.wsl.capabilities]
machine-bootable = false
container = false
systemd = true
runtime-package-management = true

# ---- vm-iso-installer --------------------------------------------------

[images.vm-iso-installer]
description = "VM ISO Installer"
definition = { type = "kiwi", path = "vm-iso-installer/vm-iso-installer.kiwi", profile = "vm-iso-installer" }

# ============================================================================
# Test suites
# ============================================================================

[test-suites.lisa-main]
type = "lisa"
description = "Lisa tests which are run by default"

[test-suites.lisa-xfs]
type = "lisa"
description = "Lisa xfs tests"

[test-suites.lisa-perf]
type = "lisa"
description = "Lisa perf tests"

[test-suites.lisa-smoke]
type = "lisa"
description = "Lisa smoke tests"

[test-suites.lisa-cvm]
type = "lisa"
description = "Lisa cvm tests"

[test-suites.lisa-kernel-ltp]
type = "lisa"
description = "Lisa kernel LTP tests"

# Single shared pytest suite for static (offline) image validation.
[test-suites.static-image-checks]
type = "pytest"
description = "Offline image validation (shared + image-specific tests)"

[test-suites.static-image-checks.pytest]
working-dir = "tests"
install = "pyproject"
test-paths = ["cases/static/"]
# {capabilities} is substituted by azldev as a comma-separated list of
# the names of capabilities set to `true` for the image (e.g.
# "machine-bootable,systemd,runtime-package-management"). Names use
# the same dash-case form declared above. The pytest plugin parses
# this string into a set; @pytest.mark.require_capability("...") tests
# that don't match are skipped.
extra-args = [
    "--image-path", "{image-path}",
    "--image-name", "{image-name}",
    "--capabilities", "{capabilities}",
]

# Runtime container tests — validate live container behavior via podman.
[test-suites.runtime-container-tests]
type = "pytest"
description = "Runtime container validation (exec into live containers)"

[test-suites.runtime-container-tests.pytest]
working-dir = "tests"
install = "pyproject"
test-paths = ["cases/runtime/"]
extra-args = [
    "--image-path", "{image-path}",
    "--image-name", "{image-name}",
    "--capabilities", "{capabilities}",
]
