# ---- single-purpose workload containers ---------------------------------
#
# One well-known package (or small package family) per image, defined in
# containers-workloads.xml. Shared package requirements across these images
# are hoisted into workload-specific kiwi profiles (e.g. PythonCore) rather
# than duplicated.

[images.container-busybox]
