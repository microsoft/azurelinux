# Point containerd at the ACL composition root.
#
# The unit that actually runs on ACL is the Flatcar-derived sysext unit, whose
# ExecStart interpolates ${CONTAINERD_CONFIG}. Overriding the variable is
# therefore sufficient; no ExecStart override is needed.
#
# The "90-" prefix is load-bearing. systemd sorts drop-ins by filename across
# /usr/lib, /run and /etc together, so this file applies after AgentBaker's
# /etc/systemd/system/containerd.service.d/50-default-config.conf, which points
# CONTAINERD_CONFIG at /etc/containerd/config.toml. Renaming this file below
# "50-" would silently hand the selection back to AgentBaker and disable the
# ACL profile.
#
# NOTE: this has no effect on stock Azure Linux, whose containerd.service runs
# "ExecStart=/usr/bin/containerd" with no --config and therefore ignores
# CONTAINERD_CONFIG. That is intentional: the subpackage is inert if it is ever
# installed outside an ACL image.
#
# Load erofs and dm_verity from here rather than relying on modules-load.d.
#
# On ACL this package ships inside the containerd sysext, and
# systemd-sysext.service merges /usr AFTER systemd-modules-load.service has
# already run:
#
#   systemd-modules-load.service  Finished     03:39:56
#   systemd-sysext: /usr <- containerd         03:39:58
#   containerd.service                         03:40:01
#
# so a modules-load.d drop-in does not exist yet at the only moment it would
# ever be read, and erofs is never loaded. containerd then skips the
# erofs snapshotter ("EROFS unsupported, please `modprobe erofs`"), the
# transfer plugin fails to resolve that snapshotter, and the Transfer gRPC
# service is never registered -- so every ctr/CRI image pull dies with
# "unknown service containerd.services.transfer.v1.Transfer".
#
# modprobe@.service is ordered correctly by construction: it is pulled into the
# same transaction as containerd.service, which by definition cannot start
# before the sysext providing it has been merged. dm_verity is usually already
# resident (the initramfs loads it for the dm-verity-protected /usr), but
# assert it too so the erofs differ's init check does not silently depend on
# that side effect.
[Unit]
Wants=modprobe@erofs.service modprobe@dm_verity.service
After=modprobe@erofs.service modprobe@dm_verity.service

[Service]
Environment=CONTAINERD_CONFIG=/usr/share/containerd2/acl-config.toml
