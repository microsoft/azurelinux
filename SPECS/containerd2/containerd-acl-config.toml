# ACL containerd composition root for an overlayfs runtime.
#
# acl-select-profile selects this root when IPE is inactive. It preserves the
# node-specific base configuration while loading EROFS/dm-verity capability for
# snapshotter-neutral referrer caching. It does not override CRI's snapshotter
# or generic diff-service order.
#
# Import order:
#   1. /etc/containerd/config.toml       node-specific base.
#                                        On AKS, generated by CSE.
#                                        Elsewhere, a symlink to the image's
#                                        base config, created by
#                                        tmpfiles.d/10-containerd-acl.conf.
#                                        Guaranteed to exist before containerd
#                                        starts on every ACL platform.
#   2. acl-erofs.toml                    EROFS/dm-verity capability and transfer
#                                        combinations. Merges last.
version = 2

imports = [
  "/etc/containerd/config.toml",
  "/usr/share/containerd2/acl-erofs.toml",
]
