# ACL containerd composition root.
#
# This file is selected by containerd.service.d/90-acl-profile.conf via
# CONTAINERD_CONFIG. It carries no settings of its own: it exists only to fix
# the merge order, because containerd's loader merges a file BEFORE its imports
# and later imports override earlier ones. The ACL delta must therefore be the
# LAST import to win, which means it cannot live in this file.
#
# Import order:
#   1. /etc/containerd/config.toml       node-specific base.
#                                        On AKS, generated by CSE.
#                                        Elsewhere, a symlink to the image's
#                                        base config, created by
#                                        tmpfiles.d/10-containerd-acl.conf.
#                                        Guaranteed to exist before containerd
#                                        starts on every ACL platform.
#   2. acl-erofs.toml                    ACL EROFS/dm-verity policy. Merges
#                                        last so it overrides the base.
version = 2

imports = [
  "/etc/containerd/config.toml",
  "/usr/share/containerd2/acl-erofs.toml",
]
