# Guarantee that /etc/containerd/config.toml exists before containerd starts,
# on every ACL platform.
#
# acl-config.toml imports this path literally, and a missing literal import is
# fatal to containerd. The 90-acl-profile.conf drop-in is baked into /usr, so
# the ACL composition root is selected from the very first boot -- before any
# provisioning agent runs, and on images that have no provisioning agent at all
# (bare metal, generic VM). The path must therefore be guaranteed by the image,
# not by a consumer.
#
# "L" creates the symlink only when the path does not already exist, so this is
# a no-op wherever something else owns the file:
#   AKS      - AgentBaker custom data links it, then CSE replaces it with a
#              generated node-specific config. Both win over this rule.
#   non-AKS  - nothing else writes it, so it resolves to the image's base
#              containerd config and the Flatcar defaults (SystemdCgroup,
#              enable_selinux, oom_score, grpc.address, root/state) are
#              preserved instead of being silently dropped.
#
# Ordering is guaranteed: systemd-tmpfiles-setup.service is WantedBy and Before
# sysinit.target, and containerd.service is After sysinit.target.
L /etc/containerd/config.toml - - - - /usr/share/containerd/config.toml
