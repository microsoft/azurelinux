# containerd.service drop-in installed by the containerd2 RPM.
#
# Re-overlays the dm-verity-aware config AND the mcr->notaryaksegistry
# hosts.toml redirect from the /usr/share/containerd2 stash onto /etc on
# EVERY containerd start.
#
# Why both, and why on every start:
#   * AKS CSE (cse_config.sh's ensureContainerd) rewrites
#     /etc/containerd/config.toml at provisioning time, clobbering the
#     dm-verity-aware config the RPM ships.
#   * On ACL (Azure Container Linux) the immutable-OS image bake strips
#     everything under /etc/* contributed by RPMs (only /usr/* survives),
#     so the /etc-shipped config.toml AND certs.d/hosts.toml never land on
#     the node. Before this drop-in restores them, first-boot image
#     acquisition runs BEFORE CSE and pulls unsigned straight from MCR
#     (no redirect, no dm-verity referrers); those layers are cached
#     content-addressed and never re-checked, so unsigned images run
#     forever despite require_signatures=true.
#
# This drop-in lives under %{_unitdir} (/usr/lib/systemd/system, which
# survives the ACL bake) and runs as ExecStartPre, so the enforcing config
# + redirect are in place the instant containerd starts on first boot --
# before any prefetch/pull -- without depending on CSE timing.
#
# Each leading '-' makes the step non-fatal if a stash file is absent.
[Service]
ExecStartPre=-/bin/mkdir -p /etc/containerd
ExecStartPre=-/bin/cp -f /usr/share/containerd2/config.toml /etc/containerd/config.toml
ExecStartPre=-/bin/mkdir -p /etc/containerd/certs.d/mcr.microsoft.com
ExecStartPre=-/bin/cp -f /usr/share/containerd2/certs.d/mcr.microsoft.com/hosts.toml /etc/containerd/certs.d/mcr.microsoft.com/hosts.toml
