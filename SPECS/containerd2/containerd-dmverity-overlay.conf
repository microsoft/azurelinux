# containerd.service drop-in installed by the containerd2 RPM.
#
# AKS CSE (cse_config.sh's ensureContainerd) rewrites /etc/containerd/config.toml
# at provisioning time, clobbering the dm-verity-aware config the RPM ships.
# This drop-in re-overlays the stashed copy from /usr/share/containerd2/ on
# every containerd start, so the config survives both initial bootstrap and
# any later CSE-driven restart. The leading '-' makes it non-fatal if the
# stashed copy is absent.
[Service]
ExecStartPre=-/bin/cp -f /usr/share/containerd2/config.toml /etc/containerd/config.toml
