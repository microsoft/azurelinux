# /etc/modules-load.d/aks-dmverity.conf — installed by the containerd2 RPM.
#
# erofs       — file system mounted by the erofs snapshotter for each layer.
# dm_verity   — dm-target enforcing Merkle-tree integrity against a signed
#               root hash. The erofs differ asserts this at init, so it must
#               be loaded before containerd.service starts.
erofs
dm_verity
