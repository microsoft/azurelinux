[distros.azurelinux]
description = "Azure Linux"

[distros.azurelinux.versions.'4.0']
description = "Azure Linux 4.0 (prod only)"
release-ver = "4.0"
mock-config-x86_64 = "mock/azl4/azurelinux-4.0-x86_64.cfg"
mock-config-aarch64 = "mock/azl4/azurelinux-4.0-aarch64.cfg"
kiwi-config-override = "kiwi/azl4/azurelinux-4.0-kiwi-override.yml"

[distros.azurelinux.versions.'4.0'.default-component-config]
spec = { type = "upstream", upstream-distro = { name = "fedora", version = "43", snapshot = "2026-10-01T00:00:00+00:00" } }

[distros.azurelinux.versions.'4.0-preview']
description = "Azure Linux 4.0 (prod + preview)"
release-ver = "4.0"
mock-config-x86_64 = "mock/azl4/azurelinux-4.0-preview-x86_64.cfg"
mock-config-aarch64 = "mock/azl4/azurelinux-4.0-preview-aarch64.cfg"
kiwi-config-override = "kiwi/azl4/azurelinux-4.0-kiwi-override.yml"

[distros.azurelinux.versions.'4.0-preview'.default-component-config]
spec = { type = "upstream", upstream-distro = { name = "fedora", version = "43", snapshot = "2026-10-01T00:00:00+00:00" } }
