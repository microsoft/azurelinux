extend-exclude = [
    # Generated build artifacts and output trees are not source.
    "base/build",
    "base/out",
    # Imported upstream kernel tooling is maintained with the kernel sources.
    # This does not exclude Azure Linux-owned tooling under scripts/ci/kernel.
    "base/comps/kernel",
    # Package sources may contain vendored or upstream Python code that we do
    # not maintain as part of the repository's Python tooling.
    "specs",
]

line-length = 120

target-version = "py312"

[lint]
select = ["ALL"] # Everything
ignore = [
    "COM812", # Conflicts with formatter.
    # Keep exception messages beside the conditions that produce them.
    # Introducing a temporary variable solely to shorten traceback source
    # lines adds indirection without improving behavior or error handling.
    "EM101",
    "EM102",
    "S603",   # Check for validation of input to subprocess calls, almost always a false positive
    "S607",   # Requiring abspath for all binaries used is very restrictive
    "T201",   # These scripts are fine to use `print` for output
    # Detailed exception messages belong beside the condition that raises
    # them; moving each message into a one-off exception class adds code
    # without improving error handling or the public exception boundary.
    "TRY003",
]

# We want D401 still, even though google style omits it.
extend-select = ["D401"]

fixable = ["ALL"]

[lint.per-file-ignores]
# Bare assertions are pytest's standard assertion mechanism.
"**/tests/**/*.py" = ["S101"]
# Test names describe the behavior under test; require docstrings for helpers
# and plugins under tests/, but not for the test functions themselves.
"**/test_*.py" = ["D103"]

# Helpers under scripts/ci/ are executed directly (python3 path/to/script.py)
# with sibling-module imports, not imported as a package, so they intentionally
# have no __init__.py. Silence the implicit-namespace-package rule for that tree.
"scripts/ci/**/*.py" = ["INP001"]

[lint.isort]
# Just force this, its better than dealing with a mishmash of modules that have annotations and those that don't
required-imports = ["from __future__ import annotations"]

[lint.flake8-copyright]
# Microsoft OSS headers intentionally omit the year.
notice-rgx = "(?i)Copyright \\(c\\)"
author = "Microsoft Corporation"

[lint.pydocstyle]
convention = "google"
