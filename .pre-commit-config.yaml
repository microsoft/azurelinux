default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c # v0.17.3
    hooks:
      - id: ruff-check
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: 1aa6dfeb849ae43fb6f16fc17228bcbd358a19c3 # v1.1.414
    hooks:
      - id: pyright
        pass_filenames: false
        additional_dependencies:
          - azure-devops==7.1.0b4
          - azure-identity==1.27.0
          - mcp==2.3.0
          - pydantic==2.14.1
          - pytest==9.2.0
          - python-dotenv==1.2.4
          - python-on-whales==0.81.0
          - requests==2.34.2
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: e8b4e28241a9ae8296ba6e4a491b5da4eda73283 # 3.11.1
    hooks:
      - id: editorconfig-checker
  - repo: https://github.com/commitizen-tools/commitizen
    rev: f690817de25831a37094ca35af5ada05c909ff1c # v4.19.3
    hooks:
      - id: commitizen
        args:
          - --allow-abort
          - --allowed-prefixes
          - "fixup!"
          - "squash!"
          - "amend!"
          - --commit-msg-file
      - id: commitizen-branch
  - repo: https://github.com/lycheeverse/lychee
    rev: 2bba271688c1abb1503097a064e6c3bc1d1b6a9b # lychee-v0.24.2
    hooks:
      - id: lychee-system
        args:
          - .
          - --hidden
          - --offline
          - --verbose
          - --include-verbatim
          - --include-fragments
          - --no-progress
        pass_filenames: false
