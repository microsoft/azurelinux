default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 2eeb5678de71a00c0902cbda7105d328432f72cb # v0.16.8
    hooks:
      - id: ruff-check
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: 1aa6dfeb849ae43fb6f16fc17228bcbd358a19c3 # v1.1.414
    hooks:
      - id: pyright
        pass_filenames: false
        additional_dependencies:
          - azure-devops==7.1.0b4
          - azure-identity==1.25.3
          - mcp==2.2.0
          - pydantic==2.13.5
          - pytest==9.0.3
          - python-dotenv==1.2.3
          - python-on-whales==0.81.0
          - requests==2.34.2
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: e8b4e28241a9ae8296ba6e4a491b5da4eda73283 # 3.11.1
    hooks:
      - id: editorconfig-checker
  - repo: https://github.com/commitizen-tools/commitizen
    rev: db073f6e2776db0e634dc8d6c20d4123a1cab086 # v4.18.1
    hooks:
      - id: commitizen
        args:
          - --allow-abort
          - --allowed-prefixes
          - "fixup!"
          - "squash!"
          - "amend!"
          - --commit-msg-file
      - id: commitizen-branch
  - repo: https://github.com/lycheeverse/lychee
    rev: 2bba271688c1abb1503097a064e6c3bc1d1b6a9b # lychee-v0.24.2
    hooks:
      - id: lychee-system
        args:
          - .
          - --hidden
          - --offline
          - --verbose
          - --include-verbatim
          - --include-fragments
          - --no-progress
        pass_filenames: false
